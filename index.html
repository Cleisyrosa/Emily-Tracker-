    function wireSectionSave(id){
      const btn = document.getElementById(id); if(!btn) return;
      const orig = btn.innerHTML;
      btn.addEventListener('click', ()=>{
        const ok = save();
        btn.innerHTML = ok ? ICONS.check+' '+tr('Guardado!') : ICONS.sos+' '+tr('Não foi possível guardar');
        setTimeout(()=>{ btn.innerHTML = orig; }, 1500);
      });
    }
    ['saveFotos','saveBasicos','saveCriticos','savePediatra','saveHospital','saveFamilia','saveAlimentacao','savePenico','saveNotas','saveDocumentos'].forEach(wireSectionSave);

    const bind=(id,obj,field,after)=>{
      const el=document.getElementById(id); if(!el) return;
      const commit=()=>{ obj[field]=el.value; save(); if(after) after(); };
      el.addEventListener('input', commit);
      el.addEventListener('change', commit);
    };
    bind('pNome',c,'nome',renderHeader); bind('pSexo',c,'sexo');
    bind('pLocal',c,'localNascimento'); bind('pNac',c,'nacionalidade');
    bind('pDocId',c,'documentoId'); bind('pSaude',c,'sistemaSaude'); bind('pMorada',c,'moradaAtual');
    // Data de nascimento: mesma regra "não pode ser no futuro" do resto da app. Vazia é permitida (opcional);
    // data futura mostra erro junto ao campo (showFieldErrors) e NÃO é gravada — mantém o valor anterior.
    const bindDob=(id,obj,field,after)=>{
      const el=document.getElementById(id); if(!el) return;
      const commit=()=>{ const p=el.parentElement; p.querySelectorAll('.field-err').forEach(e=>e.remove()); el.classList.remove('input-err');
        const v=el.value;
        if(v && v>todayISO()){ showFieldErrors([[id, msgFuturo()]]); return; }
        obj[field]=v; save(); if(after) after(); };
      el.addEventListener('input', commit); el.addEventListener('change', commit);
    };
    bindDob('pDob',c,'dataNascimento',renderHeader);
    // Campos numéricos do perfil: vazio ou número > 0 (vírgula/ponto). Valor inválido mostra erro e NÃO é gravado.
    const bindNum=(id,obj,field)=>{
      const el=document.getElementById(id); if(!el) return;
      const commit=()=>{ const p=el.parentElement; p.querySelectorAll('.field-err').forEach(e=>e.remove()); el.classList.remove('input-err');
        const v=readNum(id);
        if(v!=null && (Number.isNaN(v) || v<=0)){ showFieldErrors([[id, lx('Número maior que 0 (ex.: 3,4), ou deixa vazio.','Nombre supérieur à 0 (ex. 3,4), ou laisse vide.','Number above 0 (e.g. 3.4), or leave empty.')]]); return; }
        obj[field]=el.value.trim(); save(); };
      el.addEventListener('change', commit); el.addEventListener('blur', commit);
    };
    // Medições ao nascer (peso/altura/PC): mesmas regras da Evolução — measureError (limite duro), measureUnusual +
    // confirmUnusual (valor invulgar mas possível). Ao cancelar a confirmação, o valor escrito fica no campo, só não é gravado.
    const bindBirthMeasure=(id,obj,field,metric)=>{
      const el=document.getElementById(id); if(!el) return;
      const commit=()=>{ const p=el.parentElement; p.querySelectorAll('.field-err').forEach(e=>e.remove()); el.classList.remove('input-err');
        const v=readNum(id);
        const err=measureError(metric,v);
        if(err){ showFieldErrors([[id, err]]); return; }
        const doSave=()=>{ obj[field]=v==null?'':el.value.trim(); save(); };
        const warn=measureUnusual(metric,v);
        if(warn) confirmUnusual([warn], doSave); else doSave(); };
      el.addEventListener('change', commit);
    };
    bindBirthMeasure('pNascPeso',c.nascimento,'peso','peso'); bindBirthMeasure('pNascAlt',c.nascimento,'altura','altura'); bindBirthMeasure('pNascPc',c.nascimento,'pc','pc');

      showConfirm(lx(`Apagar «${it.nome}»? Deixa de aparecer no Perfil e na ficha de emergência.`,`Supprimer « ${it.nome} » ? Cela n'apparaîtra plus dans le Profil ni dans la fiche d'urgence.`,`Delete "${it.nome}"? It will no longer appear in Profile or on the emergency sheet.`), ()=>{ c.deficiencias=c.deficiencias.filter(a=>a.id!==b.dataset.rmdefic); save(); renderPerfil(); }); }));
    document.getElementById('addTrad').addEventListener('click', ()=>{

  // Validação comum ao criar e editar um medicamento: nome obrigatório, intervalo mínimo > 0 h, máximo diário 1–24 ou vazio.
  function medFormErrors(nome, intH, mx, idNome, idInt, idMax){
    const errs=[];
    if(!nome) errs.push([idNome, lx('Indica o nome do medicamento.','Indique le nom du médicament.','Enter the medicine name.')]);
    if(intH==null) errs.push([idInt, lx('Indica o intervalo mínimo entre doses (horas).','Indique l\'intervalle minimum entre doses (heures).','Enter the minimum interval between doses (hours).')]);
    else if(Number.isNaN(intH) || intH<=0) errs.push([idInt, lx('O intervalo tem de ser um número maior que 0.','L\'intervalle doit être supérieur à 0.','Interval must be a number above 0.')]);
    if(mx!=null && (Number.isNaN(mx) || !Number.isInteger(mx) || mx<1 || mx>24)) errs.push([idMax, lx('Máximo: número inteiro de 1 a 24, ou deixa vazio.','Maximum : nombre entier de 1 à 24, ou laisse vide.','Maximum: whole number 1–24, or leave empty.')]);
    return errs;
  }

  /* ============ Medicação: registo seguro de doses (U9 · Fase A) ============
     Ordem: alergia → máximo diário → intervalo mínimo. Cada limite tem de ser confirmado explicitamente;
     "Voltar" não regista nada. É o ÚNICO caminho para registar uma dose (Perfil e Início usam-no). */
  function normName(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
  const NAME_STOP = new Set(['de','da','do','das','dos','com','sem','mg','ml','gota','gotas','xarope','comprimido','comprimidos','solucao','oral','para','exemplo','dose','dia','ui']);
  function nameWords(s){ return normName(s).split(' ').filter(w=>w.length>=3 && !NAME_STOP.has(w) && !/^\d+$/.test(w)); }
  // Devolve as alergias registadas que PODEM corresponder a este medicamento (nome ou texto da dose).
  // Sem "inteligência" médica: igualdade normalizada, palavra igual, ou palavra com o mesmo início (≥5 letras).
  // Na dúvida mostra-se o aviso — nunca se assume que é seguro.
  function allergyMatches(med){
    const mWords=nameWords((med.nome||'')+' '+(med.dose||'')), mFull=normName(med.nome);
    return (S.crianca.alergiasMed||[]).filter(a=>{
      const aFull=normName(a.nome); if(!aFull) return false;
      if(aFull===mFull) return true;
      const aWords=nameWords(a.nome);
      return aWords.some(aw=>mWords.some(mw=> aw===mw || (Math.min(aw.length,mw.length)>=5 && (aw.startsWith(mw)||mw.startsWith(aw)))));
    });
  }
  function doseSheet({tone, title, lines, primary, onPrimary, back}){
    showOverlay(`<div class="voice-panel" id="doseSheet"><div class="voice-card" role="alertdialog" aria-modal="true" aria-labelledby="doseSheetTitle" style="text-align:left;">
      <div class="alert ${tone}" style="margin-bottom:10px;">${ICONS.pill}<b id="doseSheetTitle">${title}</b></div>
      ${lines.map(l=>`<p style="margin:0 0 8px;">${l}</p>`).join('')}
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost wide" id="dsBack" type="button">${back||lx('Voltar','Retour','Back')}</button>
        <button class="btn sensitive wide" id="dsGo" type="button">${primary}</button>
      </div>
    </div></div>`);
    document.getElementById('dsBack').addEventListener('click', closeOverlay);
    document.getElementById('dsGo').addEventListener('click', ()=>{ closeOverlay(); onPrimary(); });
  }
  function registerDose(med, onDone, flags){
    flags = flags || {};
    const again = f => registerDose(med, onDone, Object.assign({}, flags, f));
    // 1) alergia
    const al = allergyMatches(med);
    if(al.length && !flags.allergyOk){
      doseSheet({ tone:'crit', title:lx('Possível alergia registada','Allergie possible enregistrée','Possible recorded allergy'),
        lines:[ ...al.map(a=>`<b>${a.nome}</b>${a.reacao?(' — '+a.reacao):''}`),
          lx(`${med.nome} pode corresponder a uma alergia registada no Perfil. Confirma apenas se um profissional de saúde indicou este medicamento.`,`${med.nome} peut correspondre à une allergie enregistrée. Confirme seulement si un professionnel de santé l'a indiqué.`,`${med.nome} may match an allergy recorded in the Profile. Only confirm if a health professional prescribed it.`) ],
        primary:lx('Continuar','Continuer','Continue'), onPrimary:()=>again({allergyOk:true}) });
      return;
    }
    // 2) máximo diário
    const nToday=dosesToday(med).length, max=med.maxVezesDia;
    if(max && nToday>=max && !flags.overMax){
      doseSheet({ tone:'warn', title:lx('Máximo diário atingido','Maximum journalier atteint','Daily maximum reached'),
        lines:[ lx(`Já foram registadas ${nToday} de ${max} doses de ${med.nome} hoje.`,`${nToday} doses sur ${max} de ${med.nome} déjà enregistrées aujourd'hui.`,`${nToday} of ${max} doses of ${med.nome} already logged today.`) ],
        primary:lx('Continuar','Continuer','Continue'),
        onPrimary:()=>doseSheet({ tone:'warn', title:lx('Tem a certeza?','Êtes-vous sûr ?','Are you sure?'),
          lines:[ lx(`Esta seria a ${nToday+1}.ª dose de hoje, acima do máximo de ${max} configurado. Confirme apenas se foi indicada por um profissional de saúde.`,`Ce serait la dose n°${nToday+1} aujourd'hui, au-dessus du maximum de ${max}. Confirmez seulement si un professionnel de santé l'a indiqué.`,`This would be dose #${nToday+1} today, above the configured maximum of ${max}. Only confirm if a health professional advised it.`) ],
          primary:lx('Confirmar registo','Confirmer','Confirm entry'), onPrimary:()=>again({overMax:true}) }) });
      return;
    }
    // 3) intervalo mínimo
    const last=dosesOf(med).sort((a,b)=>b.ts-a.ts)[0];
    const hoursSince = last ? (Date.now()-last.ts)/3600000 : Infinity;
    if(med.intervaloHoras>0 && hoursSince < med.intervaloHoras && !flags.overInterval){
      const whenTxt = last ? (new Date(last.ts).toLocaleDateString(localeTag(),{weekday:'short',day:'numeric',month:'short'})+' · '+hhmm(last.ts)) : '—';
      doseSheet({ tone:'warn', title:lx('Antes do intervalo mínimo','Avant l\'intervalle minimum','Before the minimum interval'),
        lines:[ lx('Esta dose está a ser registada antes do intervalo mínimo.','Cette dose est enregistrée avant l\'intervalle minimum.','This dose is being logged before the minimum interval.'),
          `<span class="muted">${lx('Última dose','Dernière dose','Last dose')}:</span> <b>${whenTxt}</b>`,
          `<span class="muted">${lx('Tempo decorrido','Temps écoulé','Time elapsed')}:</span> <b>${durStr(hoursSince*60)}</b> · <span class="muted">${lx('Intervalo mínimo','Intervalle minimum','Minimum interval')}:</span> <b>${med.intervaloHoras}h</b>` ],
        primary:lx('Continuar','Continuer','Continue'),
        onPrimary:()=>doseSheet({ tone:'warn', title:lx('Tem a certeza?','Êtes-vous sûr ?','Are you sure?'),
          lines:[ lx('O intervalo mínimo ainda não terminou. Confirme apenas se esta administração foi indicada por um profissional de saúde.','L\'intervalle minimum n\'est pas terminé. Confirmez seulement si cette administration a été indiquée par un professionnel de santé.','The minimum interval has not passed. Only confirm if a health professional advised this dose.') ],
          primary:lx('Confirmar registo','Confirmer','Confirm entry'), onPrimary:()=>again({overInterval:true}) }) });
      return;
    }
    // 4) registar
    const dose = {id:uid(), ts:Date.now(), nome:med.nome, dose:med.dose, medId:med.id};
    if(flags.overMax) dose.acimaDoMax = true;
    if(flags.overInterval) dose.antesDoIntervalo = true;
    if(flags.allergyOk) dose.alergiaConfirmada = true;
    S.doses.unshift(dose);
    save(); playChime();
    if(onDone) onDone(dose);
  }
  // Início › Medicação: escolher medicamento → confirmar → guardar. A gestão continua no Perfil.
  function showQuickMedication(){
    const meds=(S.crianca.medicacoes||[]).filter(m=>m.tipo!=='tradicional');
    const rows = meds.map(m=>{ const n=dosesToday(m).length, last=dosesOf(m).sort((a,b)=>b.ts-a.ts)[0];
      return `<div class="qm-row"><div class="body"><b>${m.nome}</b>${m.dose?(' — '+m.dose):''}<br><span class="muted">${lx('Hoje','Aujourd\'hui','Today')}: ${n}${m.maxVezesDia?('/'+m.maxVezesDia):''} · ${lx('última','dernière','last')}: ${last?hhmm(last.ts)+' ('+agoStr(last.ts)+')':'—'}</span></div>
        <button class="dose-btn give" data-qmDose="${m.id}" type="button">${ICONS.pill} ${tr('Dose')}</button></div>`; }).join('');
    showOverlay(`<div class="voice-panel" id="qmPanel"><div class="voice-card" role="dialog" aria-modal="true" aria-labelledby="qmTitle" style="text-align:left;max-height:85vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;">
        <h2 id="qmTitle" style="margin:0;">${tr('Medicação')}</h2>
        <button class="icon-btn" id="qmClose" type="button" aria-label="${tr('Fechar')}">${ICONS.close}</button>
      </div>
      ${meds.length ? `<p class="muted" style="margin:0 0 6px;">${lx('Escolhe o medicamento para registar uma dose.','Choisis le médicament pour enregistrer une dose.','Choose the medicine to log a dose.')}</p>${rows}` : `<p class="muted">${lx('Ainda não há medicamentos. Adiciona-os no Perfil.','Aucun médicament. Ajoute-les dans le Profil.','No medicines yet. Add them in the Profile.')}</p>`}
      <div id="qmMsg"></div>
      <button class="btn secondary wide" id="qmManage" type="button" style="margin-top:10px;">${lx('Gerir medicamentos no Perfil','Gérer dans le Profil','Manage in Profile')}</button>
    </div></div>`);
    const panel=document.getElementById('qmPanel');
    /* toque fora: regra comum em overlayBackdropAllowed() */
    document.getElementById('qmClose').addEventListener('click', closeOverlay);
    document.getElementById('qmManage').addEventListener('click', ()=>{ closeOverlay(); activeTab='perfil'; render(); const d=document.getElementById('accMed'); if(d){ d.open=true; d.scrollIntoView({block:'start'}); } });
    panel.querySelectorAll('[data-qmDose]').forEach(b=>b.addEventListener('click', ()=>{
      const med=meds.find(m=>m.id===b.dataset.qmdose); if(!med) return;
      registerDose(med, dose=>{
        render();
        showOverlay(`<div class="voice-panel" id="qmDone"><div class="voice-card" role="alertdialog" aria-modal="true" style="text-align:left;">
          <div class="alert good" role="status">${ICONS.pill}<span>${lx(`Dose de ${med.nome} registada às ${hhmm(dose.ts)}.`,`Dose de ${med.nome} enregistrée à ${hhmm(dose.ts)}.`,`Dose of ${med.nome} logged at ${hhmm(dose.ts)}.`)}</span></div>
          <div class="btn-row"><button class="btn secondary wide" id="qmUndo" type="button">${ICONS.undo} ${lx('Desfazer','Annuler','Undo')}</button><button class="btn wide" id="qmOk" type="button">${tr('OK')}</button></div>
        </div></div>`);
        document.getElementById('qmOk').addEventListener('click', closeOverlay);
        document.getElementById('qmUndo').addEventListener('click', ()=>{ undoDose(dose.id); closeOverlay(); render(); });
      });
    }));
  }
  function undoDose(id){ const i=S.doses.findIndex(x=>x.id===id); if(i>-1){ S.doses.splice(i,1); save(); return true; } return false; }

  // Perfil › Dose: usa o fluxo seguro e mostra o resultado com "Desfazer".
  function giveDose(med){
    registerDose(med, dose=>{
      rerenderMeds();
      const w2=document.getElementById('doseWarning'); if(!w2) return;
      w2.innerHTML = `<div class="alert good" role="status" style="flex-wrap:wrap;">${ICONS.pill} <span style="flex:1;">${lx(`Dose de ${med.nome} registada.`,`Dose de ${med.nome} enregistrée.`,`Dose of ${med.nome} logged.`)}</span> <button class="btn ghost" id="undoDose" type="button">${lx('Desfazer','Annuler','Undo')}</button></div>`;
      document.getElementById('undoDose').addEventListener('click', ()=>{ undoDose(dose.id); rerenderMeds();
        const w3=document.getElementById('doseWarning'); if(w3) w3.innerHTML=`<div class="alert info" role="status">${ICONS.pill} ${lx('Dose anulada.','Dose annulée.','Dose undone.')}</div>`; });
    });
  }

  function renderGallery(){
    const el = document.getElementById('gallery'); if(!el) return;
    el.innerHTML = S.crianca.fotos.map(f=>`<div class="g-item"><img src="${f.src}"><button class="g-del" data-rmPhoto="${f.id}" type="button" aria-label="${tr('Apagar foto')}">${ICONS.close}</button></div>`).join('') || `<span class="muted" style="grid-column:1/-1;">${tr('Sem fotos na galeria.')}</span>`;
    el.querySelectorAll('[data-rmPhoto]').forEach(b=>b.addEventListener('click', ()=>{ showConfirm(tr('Apagar esta foto?'), ()=>{ S.crianca.fotos=S.crianca.fotos.filter(f=>f.id!==b.dataset.rmphoto); save(); renderGallery(); }); }));
  }
  function renderDocGrid(){
    const el = document.getElementById('docGrid'); if(!el) return;
    const c=S.crianca;
    el.innerHTML = (c.documentos||[]).map(d=>`<div class="doc-item"><img src="${d.src}"><div class="doc-tag">${d.tipo}</div><button class="g-del" data-rmDoc="${d.id}" type="button" aria-label="${tr('Apagar')}">${ICONS.close}</button></div>`).join('') || `<span class="muted" style="grid-column:1/-1;">${tr('Sem documentos guardados.')}</span>`;
    el.querySelectorAll('[data-rmDoc]').forEach(b=>b.addEventListener('click', ()=>{ const it=(c.documentos||[]).find(d=>d.id===b.dataset.rmdoc); if(!it) return;
      showConfirm(lx(`Apagar o documento «${it.tipo}»? A imagem é removida deste dispositivo e não pode ser recuperada.`,`Supprimer le document « ${it.tipo} » ? L'image est supprimée de cet appareil et ne peut pas être récupérée.`,`Delete the document "${it.tipo}"? The image is removed from this device and cannot be recovered.`), ()=>{ c.documentos=c.documentos.filter(d=>d.id!==b.dataset.rmdoc); save(); renderDocGrid(); }); }));
  }
  function hidrTotalToday(c){
    const [t0,t1]=todayRange();
    return (c.hidratacao||[]).filter(h=>inRange(h.ts,t0,t1)).reduce((s,h)=>s+h.ml,0);
  }

  /* ============ MAMADAS ============ */
  function renderMamadas(){
    const [t0,t1]=todayRange();
    const today = S.mamadas.filter(l=>inRange(l.ts,t0,t1));
    const sorted = today.slice().sort((a,b)=>a.ts-b.ts);   // só hoje (o cartão diz "Hoje")
    let avgInterval='—';
    if(sorted.length>1){ const diffs=[]; for(let i=1;i<sorted.length;i++) diffs.push(sorted[i].ts-sorted[i-1].ts); avgInterval = durStr(diffs.reduce((a,b)=>a+b,0)/diffs.length/60000); }
    const totalMl = today.reduce((s,l)=> s + (l.tipo==='biberao' ? (bottleMl(l)||0) : 0), 0);
    const last = lastOf(S.mamadas);
    const days = last7();
    const bars = days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(), b=a+86400000; return {v:S.mamadas.filter(l=>inRange(l.ts,a,b)).length, label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'}), date:d}; });

    let html = '';
    const H=3600000;
    const feedGap = getFeedGapStatus(last);
    if(feedGap) html += `<div class="alert ${feedGap}">${ICONS.bottle} ${tr('Mais de 4h sem registo de refeição.')}</div>`;

    html += `<div class="card"><div class="section-label">${tr('Hoje')}</div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="text-align:center;"><div class="val">${today.length}</div><div class="sub">${today.length===1?lx('refeição','repas','feeding'):tr('refeições')}</div></div>
        <div class="stat" style="text-align:center;"><div class="val">${avgInterval}</div><div class="sub">${tr('intervalo médio')}</div></div>
        <div class="stat" style="text-align:center;"><div class="val">${totalMl}ml</div><div class="sub">${tr('biberão (estim.)')}</div></div>
      </div>
      <p class="muted" style="margin-top:8px;">${tr('Última:')} ${last?agoStr(last.ts)+' — '+feedLabel(last):tr('sem registos')}. ${tr('Meta: 8–12 mamadas/dia.')}</p>
      <button class="btn wide" id="newMamada" type="button">${tr('+ Registar mamada')}</button>
      <div id="formHolder"></div>
    </div>
    <div class="card"><h2>${tr('Semana')}</h2><p class="muted">${tr('nº de refeições por dia')}</p><div class="chart-wrap">${barChart(bars,{color:'var(--feed)'})}</div></div>
    <div class="card"><div class="section-label">${tr('Registos de hoje')}</div><div id="logList"></div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('newMamada').addEventListener('click', ()=>{ openForm = (openForm==='new'&&!editId)?null:'new'; editId=null; renderFeedForm(); });
    if(openForm==='new') renderFeedForm();
    renderFeedLog();
  }

  function renderFeedForm(){
    const holder=document.getElementById('formHolder'); if(!holder) return;
    if(openForm!=='new'){ holder.innerHTML=''; return; }
    const c = S.crianca;
    const editing = editId ? S.mamadas.find(l=>l.id===editId) : null;
    let tipo = editing ? editing.tipo : lastFeedType(c);
    holder.innerHTML = `<div class="form-panel">
      ${editing ? `<p class="muted" style="margin:0 0 4px;font-weight:700;">${tr('A editar registo')}</p>` : ''}
      <div class="form-row"><div style="flex:1;"><label>${tr('Data')}</label><input type="date" id="fData" value="${localISO(editing?editing.ts:Date.now())}"></div><div style="flex:1;"><label>${tr('Hora')}</label><input type="time" id="fHora" value="${editing?hhmm(editing.ts):new Date().toTimeString().slice(0,5)}"></div></div>
      <div class="form-row" style="flex-direction:column;"><label>${tr('Tipo')}</label>
        <div class="seg" id="fTipo"><button data-v="peito-esq" class="${tipo==='peito-esq'?'on':''}">${tr('Peito esq.')}</button><button data-v="peito-dir" class="${tipo==='peito-dir'?'on':''}">${tr('Peito dir.')}</button><button data-v="biberao" class="${tipo==='biberao'?'on':''}">${tr('Biberão')}</button></div>
      </div>
      <div id="fExtra"></div>
      <div class="form-row" style="flex-direction:column;"><label>${lx('Sucção (opcional)','Succion (facultatif)','Sucking (optional)')}</label><div class="seg" id="fQual"><button data-v="ativa" class="${editing&&editing.qualidade==='ativa'?'on':''}">${tr('Sucção ativa')}</button><button data-v="fraca" class="${editing&&editing.qualidade==='fraca'?'on':''}">${tr('Sucção fraca')}</button></div></div>
      <textarea id="fObs" placeholder="${tr('Observações (opcional)')}">${editing&&editing.obs?editing.obs:''}</textarea>
      <button class="btn wide" id="fSave" type="button">${editing?tr('Guardar alterações'):tr('Guardar')}</button>
      ${editing?`<button class="btn ghost wide" id="fCancelEdit" type="button" style="margin-top:8px;">${tr('Cancelar')}</button>`:''}
    </div>`;
    const seg=document.getElementById('fTipo'), extra=document.getElementById('fExtra');
    function drawExtra(){
      extra.innerHTML = tipo==='biberao'
        ? `<div class="form-row"><div style="flex:1;"><label>${tr('Marca fórmula')}</label><input type="text" id="fMarca" list="fMarcaList" placeholder="" class="${(!editing&&lastFormulaBrand(c))?'remembered-fill':''}" value="${editing?(editing.marcaFormula||''):lastFormulaBrand(c)}"><datalist id="fMarcaList">${formulaBrandOptions(c)}</datalist>${(!editing && formulaBrandSource(c)) ? `<p class="field-hint">${ICONS.note} ${formulaBrandSource(c)==='perfil' ? lx('Preenchido a partir do Perfil','Rempli depuis le Profil','Filled from the Profile') : lx('Preenchido com o último biberão','Rempli avec le dernier biberon','Filled from the last bottle')}</p>` : ''}</div></div>
           <div class="form-row"><div style="flex:1;"><label>${tr('Oferecido (ml)')}</label><input type="number" id="fOfer" placeholder="${lx('ex.','ex.','e.g.')} 150" value="${editing&&editing.mlOferecido!=null?editing.mlOferecido:''}"></div><div style="flex:1;"><label>${tr('Bebido (ml)')}</label><input type="number" id="fBeb" placeholder="${lx('ex.','ex.','e.g.')} 140" value="${editing&&editing.mlBebido!=null?editing.mlBebido:''}"></div></div>`
        : `<div class="form-row"><div style="flex:1;"><label>${tr('Duração (min)')}</label><input type="number" id="fDur" placeholder="${lx('ex.','ex.','e.g.')} 15" value="${editing&&editing.duracaoMin!=null?editing.duracaoMin:''}"></div></div>`;
    }
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tipo=b.dataset.v; drawExtra(); }));
    drawExtra();
    // Sem escolha = não indicado (null). Tocar de novo na opção escolhida desmarca.
    let qualidade = editing && editing.qualidade ? editing.qualidade : null;
    const qseg=document.getElementById('fQual');
    qseg.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ const off = qualidade===b.dataset.v; qseg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); qualidade = off ? null : b.dataset.v; if(!off) b.classList.add('on'); }));
    document.getElementById('fSave').addEventListener('click', ()=>{
      const holderEl=document.getElementById('formHolder'); clearFieldErrors(holderEl);
      const data={ ts:dateTimeToTs(document.getElementById('fData').value, document.getElementById('fHora').value, !editing), tipo, qualidade, obs:document.getElementById('fObs').value.trim(),
        marcaFormula:undefined, mlOferecido:undefined, mlBebido:undefined, duracaoMin:undefined };
      // Campo vazio = sem valor (null). O placeholder "ex. …" é só visual e nunca é gravado.
      const errs=[];
      if(!(data.ts<=Date.now()+FUTURE_TOL_MS)) errs.push(['fHora', msgFuturo()]);
      if(tipo==='biberao'){
        data.marcaFormula=document.getElementById('fMarca').value.trim(); data.mlOferecido=readNum('fOfer'); data.mlBebido=readNum('fBeb');
        // 0 ml é permitido (ex.: recusou o biberão); não entra nas médias de ml (bottleMl só conta valores > 0).
        const mlErr = v => (Number.isNaN(v)) ? lx('Número inválido.','Nombre invalide.','Invalid number.')
          : (v!=null && v<0) ? lx('O valor não pode ser negativo.','La valeur ne peut pas être négative.','Value cannot be negative.') : null;
        const eo=mlErr(data.mlOferecido), eb=mlErr(data.mlBebido);
        if(eo) errs.push(['fOfer', eo]);
        if(eb) errs.push(['fBeb', eb]);
        if(!eo && !eb && data.mlOferecido!=null && data.mlBebido!=null && data.mlBebido>data.mlOferecido)
          errs.push(['fBeb', lx(`Bebido (${data.mlBebido} ml) não pode ser mais do que o oferecido (${data.mlOferecido} ml).`,`Bu (${data.mlBebido} ml) ne peut pas dépasser le proposé (${data.mlOferecido} ml).`,`Drunk (${data.mlBebido} ml) cannot exceed offered (${data.mlOferecido} ml).`)]);
      } else {
        data.duracaoMin=readNum('fDur');
        if(Number.isNaN(data.duracaoMin)) errs.push(['fDur', lx('Número inválido.','Nombre invalide.','Invalid number.')]);
        else if(data.duracaoMin!=null && data.duracaoMin<=0) errs.push(['fDur', lx('A duração tem de ser maior que 0 min, ou deixa vazio.','La durée doit être supérieure à 0 min, ou laisse vide.','Duration must be above 0 min, or leave empty.')]);
      }
      if(!showFieldErrors(errs)) return;
      const warns=[];
      if(tipo==='biberao') [data.mlOferecido, data.mlBebido].forEach(v=>{ if(v!=null && v>LIMITS.mlMax) warns.push(lx(`Este valor é invulgar. Tens a certeza que queres guardar ${numTxt(v)} ml?`,`Cette valeur est inhabituelle. Veux-tu vraiment enregistrer ${numTxt(v)} ml ?`,`This value is unusual. Are you sure you want to save ${numTxt(v)} ml?`)); });
      else if(data.duracaoMin!=null && data.duracaoMin>LIMITS.peitoMaxMin) warns.push(lx(`Esta duração é invulgar. Tens a certeza que queres guardar ${numTxt(data.duracaoMin)} minutos?`,`Cette durée est inhabituelle. Veux-tu vraiment enregistrer ${numTxt(data.duracaoMin)} minutes ?`,`This duration is unusual. Are you sure you want to save ${numTxt(data.duracaoMin)} minutes?`));
      const commit=()=>{ if(editing) Object.assign(editing, data); else S.mamadas.unshift({id:uid(), ...data});
        save(); playChime(); openForm=null; editId=null; renderMamadas(); };
      if(warns.length) confirmUnusual(warns, commit); else commit();
    });
    const cancelBtn=document.getElementById('fCancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editId=null; openForm=null; renderMamadas(); });
  }
  function renderFeedLog(){
    const el=document.getElementById('logList'); if(!el) return;
    const [t0,t1]=todayRange();
    const list=S.mamadas.filter(l=>inRange(l.ts,t0,t1)).sort((a,b)=>b.ts-a.ts);
    el.innerHTML = list.length ? list.map(l=>`<div class="log-item" data-edit="${l.id}" role="button" tabindex="0" style="cursor:pointer;"><div class="ic feed">${ICONS.bottle}</div><div class="body"><div class="title">${feedLabel(l)}</div><div class="meta">${[l.qualidade==='fraca'?tr('sucção fraca'):l.qualidade==='ativa'?tr('sucção ativa'):'', l.obs||''].filter(Boolean).join(' · ')}</div></div><div class="time">${fmtTimeOnly(l.ts)}</div><button class="log-del" data-del="${l.id}" type="button" aria-label="${tr('Apagar')}">${ICONS.trash}</button></div>`).join('') : `<div class="empty">${tr('Sem registos hoje.')}</div>${exampleHint(tr('Biberão')+' · '+tr('Bebido')+' 140ml · 14:30')}${exampleHint(tr('Peito esquerdo')+' · 15min · 17:00')}`;
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ev=>{ ev.stopPropagation(); showConfirm(tr('Apagar este registo de mamada?'), ()=>{ const i=S.mamadas.findIndex(l=>l.id===b.dataset.del); if(i>-1) S.mamadas.splice(i,1); save(); renderFeedLog(); }); }));
    el.querySelectorAll('[data-edit]').forEach(row=>row.addEventListener('click', ()=>showRecordDetails('mamada', row.dataset.edit)));
  }

  /* ============ FRALDAS ============ */
  function renderFraldas(){
    const [t0,t1]=todayRange();
    const today=S.fraldas.filter(l=>inRange(l.ts,t0,t1));
    const xixi=today.filter(d=>d.tipo==='xixi').length, coco=today.filter(d=>d.tipo==='coco').length;
    const sorted=today.slice().sort((a,b)=>a.ts-b.ts);   // só hoje (o cartão diz "Hoje")
    let avgInterval='—';
    if(sorted.length>1){ const diffs=[]; for(let i=1;i<sorted.length;i++) diffs.push(sorted[i].ts-sorted[i-1].ts); avgInterval=durStr(diffs.reduce((a,b)=>a+b,0)/diffs.length/60000); }
    const days=last7();
    const xixiBars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; return {v:S.fraldas.filter(l=>inRange(l.ts,a,b)&&l.tipo==='xixi').length, label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'}), date:d}; });
    const cocoBars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; return {v:S.fraldas.filter(l=>inRange(l.ts,a,b)&&l.tipo==='coco').length, label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'}), date:d}; });

    let html='';
    const wetStatus = getWetDiaperStatus(xixi);
    if(wetStatus){
      const lang=(S.settings&&S.settings.lang)||'pt';
      let msg;
      msg = wetDiaperMsg(xixi);
      html += `<div class="alert ${wetStatus}">${ICONS.drop} ${msg}</div>`;
    }

    html += `<div class="card"><div class="section-label">${tr('Hoje')}</div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="text-align:center;"><div class="val">${xixi}</div><div class="sub">${tr('xixi')}</div></div>
        <div class="stat" style="text-align:center;"><div class="val">${coco}</div><div class="sub">${tr('cocó')}</div></div>
        <div class="stat" style="text-align:center;"><div class="val">${avgInterval}</div><div class="sub">${tr('intervalo médio')}</div></div>
      </div>
      <button class="btn wide" id="newFralda" type="button">${tr('+ Registar fralda')}</button>
      <div id="formHolder"></div>
    </div>
    <div class="card"><h2>${tr('Xixi · semana')}</h2><p class="muted">${tr('meta 6–8/dia')}</p><div class="chart-wrap">${barChart(xixiBars,{targetLine:6, color:'var(--diaper)'})}</div></div>
    <div class="card"><h2>${tr('Cocó · semana')}</h2><div class="chart-wrap">${barChart(cocoBars,{color:'var(--diaper)'})}</div></div>
    <div class="card"><div class="section-label">${tr('Registos de hoje')}</div><div id="logList"></div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('newFralda').addEventListener('click', ()=>{ openForm = (openForm==='new'&&!editId)?null:'new'; editId=null; renderDiaperForm(); });
    if(openForm==='new') renderDiaperForm();
    renderDiaperLog();
  }
  function renderDiaperForm(){
    const holder=document.getElementById('formHolder'); if(!holder) return;
    if(openForm!=='new'){ holder.innerHTML=''; return; }
    const editing = editId ? S.fraldas.find(l=>l.id===editId) : null;
    let tipo = editing ? editing.tipo : 'xixi', quantidade = editing && editing.quantidade ? editing.quantidade : null;   // sem escolha = não indicado
    holder.innerHTML = `<div class="form-panel">
      ${editing?`<p class="muted" style="margin:0 0 4px;font-weight:700;">${tr('A editar registo')}</p>`:''}
      <div class="form-row"><div style="flex:1;"><label>${tr('Data')}</label><input type="date" id="dData" value="${localISO(editing?editing.ts:Date.now())}"></div><div style="flex:1;"><label>${tr('Hora')}</label><input type="time" id="dHora" value="${editing?hhmm(editing.ts):new Date().toTimeString().slice(0,5)}"></div></div>
      <div class="form-row" style="flex-direction:column;"><label>${tr('Tipo')}</label><div class="seg" id="dTipo"><button data-v="xixi" class="${tipo==='xixi'?'on':''}">${tr('Xixi')}</button><button data-v="coco" class="${tipo==='coco'?'on':''}">${tr('Cocó')}</button></div></div>

    const seg=document.getElementById('dTipo'), extra=document.getElementById('dExtra'), qseg=document.getElementById('dQtd');

        <div style="flex:1;"><label>${tr('Consistência')}</label><select id="dCons"><option value="" ${!(editing&&editing.consistencia)?'selected':''}>${lx('— não indicado —','— non indiqué —','— not given —')}</option><option value="Mole" ${editing&&editing.consistencia==='Mole'?'selected':''}>${tr('Mole')}</option><option value="Normal" ${editing&&editing.consistencia==='Normal'?'selected':''}>${tr('Normal')}</option><option value="Dura" ${editing&&editing.consistencia==='Dura'?'selected':''}>${tr('Dura')}</option><option value="Seca" ${editing&&editing.consistencia==='Seca'?'selected':''}>${tr('Seca')}</option></select></div>

  /* ============ SONO ============ */
  // Estado do sono de HOJE. O dia ainda está a decorrer: comparar o sono acumulado com a meta de 24 h
  // faria de qualquer manhã um "crítico". Por isso:
  //  good     → já atingiu o mínimo da meta
  //  watch    → já passou ¾ do dia e está a menos de metade do proporcional esperado até agora (atenção, nunca crítico)
  //  progress → caso contrário: dia em curso, sem juízo
  function sleepDayState(hoursSoFar, targetLo, elapsedFrac){
    const f = Math.max(0, Math.min(1, elapsedFrac));
    if(hoursSoFar >= targetLo) return 'good';
    if(f >= 0.75 && hoursSoFar < targetLo*f*0.5) return 'watch';
    return 'progress';
  }
  function sleepTargetH(months){ if(months<1) return [14,17]; if(months<4) return [14,16]; if(months<6) return [12,15]; if(months<12) return [11,14]; return [10,13]; }
  function renderSono(){
    const isSleeping=!!S.running.sleepStart;
    const [t0,t1]=todayRange();
    const todayMins=S.sono.filter(l=>l.inicio<t1 && l.fim>t0).reduce((s,l)=>s+overlapMinutes(l.inicio,l.fim,t0,t1),0);
    const months = ageInfo(S.crianca.dataNascimento).months;
    const [lo,hi]=sleepTargetH(months);
    const hoursToday = todayMins/60;
    const dayState = sleepDayState(hoursToday, lo, (Date.now()-t0)/86400000);
    const statusDot = dayState==='good' ? 'good' : dayState==='watch' ? 'warn' : 'neutral';
    const statusLabel = `<span class="status-dot ${statusDot}" aria-hidden="true"></span>`+(dayState==='good'?lx('Na meta','Objectif atteint','On target'):dayState==='watch'?lx('A observar','À surveiller','Keep an eye'):lx('Dia em curso','Journée en cours','Day in progress'));
    const withQual = S.sono.filter(l=>typeof l.qualidade==='number' && l.qualidade>0);
    const avgQual = withQual.length ? (withQual.reduce((s,l)=>s+l.qualidade,0)/withQual.length).toFixed(1) : '—';
    const days=last7();
    const bars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; const mins=S.sono.filter(l=>l.inicio<b && l.fim>a).reduce((s,l)=>s+overlapMinutes(l.inicio,l.fim,a,b),0); return {v:+(mins/60).toFixed(1), label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'}), date:d}; });

    const lang=(S.settings&&S.settings.lang)||'pt';
    const metaLbl = lang==='fr' ? `objectif (${months}m)` : lang==='en' ? `target (${months}m)` : `meta (${months}m)`;
    const qualTxt = avgQual==='—' ? '—' : fmtNum(avgQual,1)+'/10';
    const qualMedLbl = lang==='fr' ? `Qualité moyenne : ${qualTxt}` : lang==='en' ? `Average quality: ${qualTxt}` : `Qualidade média: ${qualTxt}`;
    const terminarLbl = lang==='fr' ? `Terminer le sommeil (${durStr((Date.now()-S.running.sleepStart)/60000)})` : lang==='en' ? `End sleep (${durStr((Date.now()-S.running.sleepStart)/60000)})` : `Terminar sono (${durStr((Date.now()-S.running.sleepStart)/60000)})`;
    const horasDiaLbl = lang==='fr' ? `heures par jour · objectif ${lo}–${hi}h` : lang==='en' ? `hours per day · target ${lo}–${hi}h` : `horas por dia · meta ${lo}–${hi}h`;
    const napsToday = S.sono.filter(l=>inRange(l.inicio,t0,t1) && l.periodo==='sesta').length;   // só sestas; noites e "sem período" não contam
    let html = `<div class="card"><div class="section-label">${tr('Hoje')}</div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.moon}</div><div class="val">${fmtNum(hoursToday,1,true)} h</div><div class="sub">${tr('total')}</div></div>
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.moon}</div><div class="val">${napsToday}</div><div class="sub">${napsToday===1?lx('sesta hoje','sieste aujourd\'hui','nap today'):tr('sestas hoje')}</div></div>
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.chart}</div><div class="val">${statusLabel}</div><div class="sub">${tr('estado')}</div></div>
      </div>
      <p class="muted" style="margin-top:6px;">${qualMedLbl}</p>
      <button type="button" class="qa-tile${isSleeping?' running':''}" id="sleepToggle" style="width:100%;flex-direction:row;justify-content:center;gap:8px;margin-top:6px;">${ICONS.moon}<span class="lbl">${isSleeping?terminarLbl:tr('Iniciar sono agora')}</span></button>
      <button class="btn ghost wide" id="newSono" type="button" style="margin-top:8px;">${tr('+ Registo manual')}</button>
      <div id="formHolder"></div>
    </div>
    <div class="card"><h2>${tr('Semana')}</h2><p class="muted">${horasDiaLbl}</p><div class="chart-wrap">${barChart(bars,{targetLine:lo, color:'var(--sleep)'})}</div></div>
    <div class="card"><div class="section-label">${tr('Registos')}</div><div id="logList"></div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('sleepToggle').addEventListener('click', ()=>{ isSleeping ? stopSleep() : (S.running.sleepStart=Date.now(), save(), playChime(), render()); });
    document.getElementById('newSono').addEventListener('click', ()=>{ openForm = (openForm==='new'&&!editId)?null:'new'; editId=null; renderSleepForm(); });
    if(openForm==='new') renderSleepForm();
    renderSleepLog();
  }
  function renderSleepForm(){
    const holder=document.getElementById('formHolder'); if(!holder) return;
    if(openForm!=='new'){ holder.innerHTML=''; return; }
    const editing = editId ? S.sono.find(l=>l.id===editId) : null;
    const now = new Date();
    const isSleeping = !!S.running.sleepStart;
    const iniVal = editing ? hhmm(editing.inicio) : now.toTimeString().slice(0,5);
    const fimVal = editing ? hhmm(editing.fim) : now.toTimeString().slice(0,5);
    holder.innerHTML = `<div class="form-panel">
      ${editing?`<p class="muted" style="margin:0 0 4px;font-weight:700;">${tr('A editar registo')}</p>`:''}
      <div class="form-row" style="flex-direction:column;"><label>${tr('Período')} ${lx('(opcional)','(facultatif)','(optional)')} <span class="muted" id="sPeriodoHint" style="font-weight:600;"></span></label><div class="seg" id="sPeriodo"><button data-v="noite" class="${editing&&editing.periodo==='noite'?'on':''}">${tr('Noite')}</button><button data-v="sesta" class="${editing&&editing.periodo==='sesta'?'on':''}">${tr('Sesta')}</button></div></div>
      <div class="form-row" style="flex-direction:column;"><label>${tr('Posição')} ${lx('(opcional)','(facultatif)','(optional)')}</label><div class="seg" id="sPos"><button data-v="costas" class="${editing&&editing.posicao==='costas'?'on':''}">${tr('Costas')}</button><button data-v="lado" class="${editing&&editing.posicao==='lado'?'on':''}">${tr('Lado')}</button><button data-v="barriga" class="${editing&&editing.posicao==='barriga'?'on':''}">${tr('Barriga')}</button></div></div>
      <div class="form-row"><div style="flex:1;"><label>${tr('Data')}</label><input type="date" id="sData" value="${localISO(editing?editing.inicio:Date.now())}"></div><div style="flex:1;"><label>${tr('Adormeceu')}</label><input type="time" id="sIni" value="${iniVal}"></div></div>
      ${(!isSleeping&&!editing) ? `<label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-sm);"><input type="checkbox" id="sAindaDorme" style="width:auto;"> ${tr('Ainda está a dormir — registar só a hora que adormeceu')}</label>` : ''}
      <div id="sFimBlock">
        <div class="form-row"><div style="flex:1;"><label>${tr('Acordou')}</label><input type="time" id="sFim" value="${fimVal}"></div></div>
        <div class="form-row"><div style="flex:1;"><label>${tr('Qualidade (1–10)')}</label><input type="number" id="sQual" min="1" max="10" placeholder="${lx('ex.','ex.','e.g.')} 7" value="${editing&&editing.qualidade!=null?editing.qualidade:''}"></div><div style="flex:1;"><label>${tr('Interrupções')}</label><input type="number" id="sInter" min="0" placeholder="${lx('ex.','ex.','e.g.')} 0" value="${editing&&editing.interrupcoes?editing.interrupcoes:''}"></div></div>
      </div>
      <textarea id="sObs" placeholder="${tr('Observações (opcional)')}">${editing&&editing.obs?editing.obs:''}</textarea>
      <button class="btn wide" id="sSave" type="button">${editing?tr('Guardar alterações'):tr('Guardar')}</button>
      ${editing?`<button class="btn ghost wide" id="sCancelEdit" type="button" style="margin-top:8px;">${tr('Cancelar')}</button>`:''}
    </div>`;
    // Sem escolha = não indicado (null). A hora só SUGERE Noite/Sesta (texto), nunca grava sozinha.
    const toggleSeg = (segEl, get, set) => segEl.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ const off = get()===b.dataset.v; segEl.querySelectorAll('button').forEach(x=>x.classList.remove('on')); set(off ? null : b.dataset.v); if(!off) b.classList.add('on'); }));
    const seg=document.getElementById('sPeriodo'); let periodo = editing && editing.periodo ? editing.periodo : null;
    toggleSeg(seg, ()=>periodo, v=>{ periodo=v; });
    const posSeg=document.getElementById('sPos'); let posicao = editing && editing.posicao ? editing.posicao : null;
    toggleSeg(posSeg, ()=>posicao, v=>{ posicao=v; });
    const hintEl=document.getElementById('sPeriodoHint');
    const updHint=()=>{ const t=document.getElementById('sIni').value; if(!hintEl||!t) return; const h=+t.split(':')[0]; hintEl.textContent = '· '+lx('sugestão pela hora: ','suggestion selon l\'heure : ','suggested by time: ')+((h>=20||h<7)?tr('Noite'):tr('Sesta')); };
    updHint(); document.getElementById('sIni').addEventListener('input', updHint);
    const aindaChk = document.getElementById('sAindaDorme');
    const fimBlock = document.getElementById('sFimBlock');
    if(aindaChk) aindaChk.addEventListener('change', ()=>{ fimBlock.style.display = aindaChk.checked ? 'none' : 'block'; });
    document.getElementById('sSave').addEventListener('click', ()=>{
      clearFieldErrors(document.getElementById('formHolder'));
      const inicio = dateTimeToTs(document.getElementById('sData').value, document.getElementById('sIni').value, !editing);
      if(!(inicio<=Date.now()+FUTURE_TOL_MS)){ showFieldErrors([['sIni', msgFuturo()]]); return; }
      if(aindaChk && aindaChk.checked){
        S.running.sleepStart = inicio;
        save(); playChime(); openForm=null; editId=null; renderSono();
        return;
      }
      const [fh,fm]=document.getElementById('sFim').value.split(':').map(Number);
      let fim=new Date(inicio); fim.setHours(fh,fm,0,0);
      const errs=[];
      if(fim.getTime()===inicio) errs.push(['sFim', lx('A hora de acordar é igual à de adormecer. Corrige uma das horas.','L\'heure de réveil est égale à celle d\'endormissement.','Wake time equals sleep time. Fix one of them.')]);
      if(fim.getTime()<inicio) fim.setDate(fim.getDate()+1);   // atravessa a meia-noite (ex. 22:00 → 06:00): permitido
      const durMin=(fim.getTime()-inicio)/60000;
      if(!errs.length && fim.getTime()>Date.now()+FUTURE_TOL_MS) errs.push(['sFim', lx('A hora de acordar não pode ser no futuro.','L\'heure de réveil ne peut pas être dans le futur.','Wake time cannot be in the future.')]);
      const qual=readNum('sQual'), inter=readNum('sInter');
      if(qual!=null && (Number.isNaN(qual) || !Number.isInteger(qual) || qual<LIMITS.qualMin || qual>LIMITS.qualMax)) errs.push(['sQual', lx('A qualidade tem de ser um número inteiro de 1 a 10.','La qualité doit être un nombre entier de 1 à 10.','Quality must be a whole number from 1 to 10.')]);
      if(inter!=null && (Number.isNaN(inter) || !Number.isInteger(inter) || inter<0)) errs.push(['sInter', lx('Interrupções: número inteiro, 0 ou mais.','Interruptions : nombre entier, 0 ou plus.','Interruptions: whole number, 0 or more.')]);
      if(!showFieldErrors(errs)) return;
      const data={ periodo, posicao, inicio, fim:fim.getTime(), duracaoMin:durMin, qualidade:qual, interrupcoes:inter, obs:document.getElementById('sObs').value.trim() };
      const commit=()=>{ if(editing) Object.assign(editing, data); else S.sono.unshift({id:uid(), ...data});
        save(); playChime(); openForm=null; editId=null; renderSono(); };
      if(durMin>LIMITS.sonoMaxH*60) confirmUnusual([lx(`Esta duração de sono é invulgar. Tens a certeza que queres guardar ${durStr(durMin)}?`,`Cette durée de sommeil est inhabituelle. Veux-tu vraiment enregistrer ${durStr(durMin)} ?`,`This sleep duration is unusual. Are you sure you want to save ${durStr(durMin)}?`)], commit);
      else commit();
    });
    const cancelBtn=document.getElementById('sCancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editId=null; openForm=null; renderSono(); });
  }
  function renderSleepLog(){

    const list=S.sono.filter(l=>(l.fim||l.inicio)>=cutoff).slice().sort((a,b)=>b.inicio-a.inicio);
    el.innerHTML = list.length ? list.map(l=>`<div class="log-item" data-edit="${l.id}" role="button" tabindex="0" style="cursor:pointer;"><div class="ic sleepc">${ICONS.moon}</div><div class="body"><div class="title">${sleepPeriodLabel(l)} · ${fmtTimeOnly(l.inicio)} → ${fmtTimeOnly(l.fim)}</div><div class="meta">${durStr(l.duracaoMin)}${l.qualidade!=null?(' · '+tr('qualidade')+' '+l.qualidade+'/10'):''}${l.interrupcoes?(' · '+l.interrupcoes+' '+tr('interrupções')):''}${l.posicao?(' · '+tr(l.posicao)):''}</div></div><button class="log-del" data-del="${l.id}" type="button" aria-label="${tr('Apagar')}">${ICONS.trash}</button></div>`).join('') : `<div class="empty">${tr('Sem registos.')}</div>${exampleHint(tr('Sesta')+' · 13:00 → 14:30 · 1h 30min')}`;
    el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ev=>{ ev.stopPropagation(); showConfirm(tr('Apagar este registo de sono?'), ()=>{ const i=S.sono.findIndex(l=>l.id===b.dataset.del); if(i>-1) S.sono.splice(i,1); save(); renderSleepLog(); }); }));
    el.querySelectorAll('[data-edit]').forEach(row=>row.addEventListener('click', ()=>showRecordDetails('sono', row.dataset.edit)));
  }

  /* ============ EVOLUÇÃO ============ */
  // Crescimento segundo os padrões da OMS (0–5 anos).
  //   Dados oficiais (L, M, S): who-growth-data.js — gerado por tools/who-growth/build_who_growth.py.
  //   Cálculos (idade em dias, z-score LMS, percentil): who-growth.js → window.WhoGrowth.
  //   Aqui só há apresentação. Nenhum registo é alterado: tudo é calculado na hora a partir de {date, valor}.
  const GW = window.WhoGrowth || null;
  let growthView = 'wfa';
  const GROWTH_VIEWS = { wfa:{ic:'⚖️', metric:'peso', unit:'kg'}, lhfa:{ic:'📏', metric:'altura', unit:'cm'},
    hcfa:{ic:'🧠', metric:'pc', unit:'cm'}, wfl:{ic:'⚖️', metric:'peso', unit:'kg'} };
  const GROWTH_PCTS = [3, 15, 50, 85, 97];
  const escapeAttr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeHtml = escapeAttr;
  function growthViewLabel(v){
    return v==='wfa' ? tr('Peso') : v==='lhfa' ? tr('Comprimento/altura') : v==='hcfa' ? tr('Perímetro cefálico') : lx('Peso/comprimento','Poids/longueur','Weight/length');
  }
  const growthNum = v => new Intl.NumberFormat(localeTag(), {maximumFractionDigits:3}).format(v);
  const growthDate = iso => new Date(iso+'T12:00:00').toLocaleDateString(localeTag(), {day:'2-digit', month:'2-digit', year:'numeric'});
  function pctText(p){ const r=Math.round(p); return r<1 ? '<P1' : r>99 ? '>P99' : 'P'+r; }
  function pctSpoken(p){ const r=Math.round(p);
    if(r<1) return lx('Percentil inferior a 1','Percentile inférieur à 1','Below percentile 1');
    if(r>99) return lx('Percentil superior a 99','Percentile supérieur à 99','Above percentile 99');
    return lx('Percentil ','Percentile ','Percentile ')+r; }
  const zText = z => new Intl.NumberFormat(localeTag(), {minimumFractionDigits:2, maximumFractionDigits:2, signDisplay:'exceptZero'}).format(z);
  function growthSexLabel(){ return S.crianca.sexo==='M' ? lx('meninos','garçons','boys') : S.crianca.sexo==='F' ? lx('meninas','filles','girls') : lx('sexo por indicar','sexe non indiqué','sex not set'); }
  function growthReason(res){
    switch(res && res.reason){
      case 'no-data': return lx('As tabelas da OMS não foram carregadas (ficheiros who-growth-data.js e who-growth.js). O histórico continua disponível.','Les tables de l\'OMS n\'ont pas été chargées (fichiers who-growth-data.js et who-growth.js). L\'historique reste disponible.','The WHO tables were not loaded (files who-growth-data.js and who-growth.js). The history is still available.');
      case 'no-dates': return lx('Indica a data de nascimento no Perfil para calcular o percentil.','Indique la date de naissance dans le Profil pour calculer le percentile.','Add the date of birth in Profile to calculate the percentile.');
      case 'no-sex': return lx('Indica o sexo no Perfil para calcular o percentil.','Indique le sexe dans le Profil pour calculer le percentile.','Add the sex in Profile to calculate the percentile.');
      case 'before-birth': return lx('A data da medição é anterior à data de nascimento.','La date de la mesure est antérieure à la naissance.','The measurement date is before the date of birth.');
      case 'over-5y': return lx('Os padrões da OMS usados aqui cobrem dos 0 aos 5 anos.','Les standards de l\'OMS utilisés ici couvrent de 0 à 5 ans.','The WHO standards used here cover 0 to 5 years.');
      case 'length-out-of-range': { const [a,b]=res.range||[];
        return res.indicator==='wfh' ? lx(`O peso para a altura só está definido entre ${a} e ${b} cm.`,`Le poids pour la taille n'est défini qu'entre ${a} et ${b} cm.`,`Weight-for-height is only defined between ${a} and ${b} cm.`)
          : lx(`O peso para o comprimento só está definido entre ${a} e ${b} cm.`,`Le poids pour la longueur n'est défini qu'entre ${a} et ${b} cm.`,`Weight-for-length is only defined between ${a} and ${b} cm.`); }
      default: return lx('Não foi possível calcular o percentil para este valor.','Impossible de calculer le percentile pour cette valeur.','The percentile could not be calculated for this value.');
    }
  }
  function growthResult(metric, rec){
    if(!GW) return {ok:false, reason:'no-data'};
    const days=GW.ageInDays(S.crianca.dataNascimento, rec.date), sex=S.crianca.sexo, v=Number(rec.valor);
    if(metric==='peso') return GW.weightForAge(sex, days, v);
    if(metric==='altura') return GW.lengthForAge(sex, days, v);
    return GW.headForAge(sex, days, v);
  }
  // Nome do indicador (com comprimento deitado vs altura em pé, conforme a idade — como nas tabelas da OMS).
  function growthIndicatorName(res, metric){
    const ind = res && res.indicator;
    if(ind==='wfa' || (!ind && metric==='peso')) return lx('Peso para a idade','Poids pour l\'âge','Weight-for-age');
    if(ind==='lhfa' || (!ind && metric==='altura')) return res && res.measure==='height' ? lx('Altura para a idade (medida em pé)','Taille pour l\'âge (debout)','Height-for-age (standing)')
      : res && res.measure==='length' ? lx('Comprimento para a idade (medido deitado)','Longueur pour l\'âge (couché)','Length-for-age (lying down)') : lx('Comprimento/altura para a idade','Longueur/taille pour l\'âge','Length/height-for-age');
    if(ind==='hcfa' || (!ind && metric==='pc')) return lx('Perímetro cefálico para a idade','Périmètre crânien pour l\'âge','Head circumference-for-age');
    if(ind==='wfh') return lx('Peso para a altura','Poids pour la taille','Weight-for-height');
    return lx('Peso para o comprimento','Poids pour la longueur','Weight-for-length');
  }
  function growthMetricWord(metric, res){
    if(metric==='altura') return res && res.measure==='height' ? tr('Altura') : res && res.measure==='length' ? lx('Comprimento','Longueur','Length') : tr('Comprimento/altura');
    return metric==='peso' ? tr('Peso') : tr('Perímetro cefálico');
  }
  // Registos de uma medida, por data (empate → ordem de inserção). Guarda o índice original para abrir o detalhe.
  function growthSeries(metric){
    return (S.evolucao[metric]||[]).map((r,i)=>({r,i})).filter(o=>o.r && o.r.date && Number(o.r.valor)>0)
      .sort((a,b)=>String(a.r.date).localeCompare(String(b.r.date)) || a.i-b.i)
      .map(o=>({date:o.r.date, v:Number(o.r.valor), idx:o.i, metric, res:growthResult(metric, o.r)}));
  }
  // Peso/comprimento: só com peso E comprimento/altura registados na MESMA data (se houver vários nesse dia, o último inserido).
  function growthPairs(){
    const byDate = arr => { const m={}; (arr||[]).forEach((r,i)=>{ if(r && r.date && Number(r.valor)>0) m[r.date]={r,i}; }); return m; };
    const P=byDate(S.evolucao.peso), A=byDate(S.evolucao.altura);
    return Object.keys(P).filter(d=>A[d]).sort().map(d=>{
      const kg=Number(P[d].r.valor), cm=Number(A[d].r.valor);
      const res = GW ? GW.weightForLengthHeight(S.crianca.sexo, GW.ageInDays(S.crianca.dataNascimento, d), cm, kg) : {ok:false, reason:'no-data'};
      return {date:d, v:kg, cm, idx:P[d].i, metric:'peso', res};
    });
  }
  function growthAria(view, p){
    if(view==='wfl') return `${lx('Peso/comprimento em','Poids/longueur le','Weight/length on')} ${growthDate(p.date)}: ${growthNum(p.v)} kg, ${growthNum(p.cm)} cm. ${p.res.ok?pctSpoken(p.res.percentile)+'.':''}`;
    const M=GROWTH_VIEWS[view];
    return `${growthMetricWord(M.metric, p.res)} ${lx('em','le','on')} ${growthDate(p.date)}: ${growthNum(p.v)} ${M.unit}. ${p.res.ok?pctSpoken(p.res.percentile)+'.':''}`;
  }
  function niceStep(range, target){
    const raw=range/target, mag=Math.pow(10, Math.floor(Math.log10(raw))), n=raw/mag;
    return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  }
  // Gráfico: curvas OMS (P3, P15, P50, P85, P97) + medições da criança. Cores das curvas fixas (não seguem o acento).
  function whoGrowthChart(view, pts){
    const sex=S.crianca.sexo, W=340, H=236, padL=36, padR=42, padT=14, padB=30;
    let xMin=0, xMax, xTicks=[], xFmt, curves;
    if(view!=='wfl'){
      const maxDay=Math.max(0, ...pts.map(p=>p.res.days));
      const winM = maxDay<=183 ? 6 : maxDay<=365 ? 12 : maxDay<=730 ? 24 : 60;
      xMax=winM; const tstep = winM===6?1 : winM===12?2 : winM===24?3 : 12;
      for(let m=0;m<=winM;m+=tstep) xTicks.push(m);
      xFmt = m => m+lx('m','m','m');
      const toDay=Math.min(GW.MAX_DAY, Math.floor(winM*GW.DAYS_PER_MONTH)), step=Math.max(1, Math.round(toDay/140));
      const segs = view==='lhfa' && toDay>=GW.HEIGHT_FROM_DAY ? [[0,GW.HEIGHT_FROM_DAY-1],[GW.HEIGHT_FROM_DAY,toDay]] : [[0,toDay]];
      curves = GROWTH_PCTS.map(p=>({p, segs:segs.map(([a,b])=>GW.curveByAge(view, sex, p, a, b, step).map(q=>({x:q.day/GW.DAYS_PER_MONTH, v:q.v})))}));
      pts = pts.map(p=>Object.assign({}, p, {x:p.res.days/GW.DAYS_PER_MONTH}));
    } else {
      const ind=pts[pts.length-1].res.indicator, [lo,hi]= ind==='wfh' ? [65,120] : [45,110];
      const cms=pts.map(p=>p.cm);
      xMin=Math.max(lo, Math.floor((Math.min(...cms)-3)/5)*5); xMax=Math.min(hi, Math.ceil((Math.max(...cms)+3)/5)*5);
      if(xMax-xMin<15){ xMax=Math.min(hi, xMin+15); xMin=Math.max(lo, xMax-15); }
      const tstep = xMax-xMin<=30 ? 5 : 10;
      for(let c=Math.ceil(xMin/tstep)*tstep;c<=xMax;c+=tstep) xTicks.push(c);
      xFmt = c => String(c);
      curves = GROWTH_PCTS.map(p=>({p, segs:[GW.curveByLength(ind, sex, p, xMin, xMax, 0.5).map(q=>({x:q.cm, v:q.v}))]}));
      pts = pts.map(p=>Object.assign({}, p, {x:p.cm}));
    }
    const allV=[...curves.flatMap(c=>c.segs.flat().map(q=>q.v)), ...pts.map(p=>p.v)];
    let yLo=Math.min(...allV), yHi=Math.max(...allV); const yStep=niceStep(yHi-yLo, 5);
    yLo=Math.floor(yLo/yStep)*yStep; yHi=Math.ceil(yHi/yStep)*yStep;
    const X = x => padL + (x-xMin)/(xMax-xMin)*(W-padL-padR);
    const Y = v => H-padB - (v-yLo)/(yHi-yLo)*(H-padB-padT);
    const path = seg => seg.map((q,i)=>`${i?'L':'M'}${X(q.x).toFixed(1)},${Y(q.v).toFixed(1)}`).join('');
    const band = (lo,hi) => lo.segs.map((s,k)=>`<path d="${path(s)}L${hi.segs[k].slice().reverse().map(q=>`${X(q.x).toFixed(1)},${Y(q.v).toFixed(1)}`).join('L')}Z" fill="var(--who-band)" stroke="none"/>`).join('');
    const C = p => curves.find(c=>c.p===p);
    const DASH = {3:'2 3', 97:'2 3', 15:'6 3', 85:'6 3', 50:''};
    const grid=[]; for(let v=yLo; v<=yHi+1e-9; v+=yStep){ const yy=Y(v).toFixed(1);
      grid.push(`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-width="1"/><text class="axis-label" x="${padL-5}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${growthNum(Math.round(v*100)/100)}</text>`); }
    const xt = xTicks.map(t=>`<text class="axis-label" x="${X(t).toFixed(1)}" y="${H-10}" text-anchor="${t===xTicks[0]&&X(t)<padL+6?'start':'middle'}">${xFmt(t)}</text>`).join('');
    const lines = curves.map(c=>c.segs.map(s=>`<path d="${path(s)}" fill="none" stroke="var(--who-line)" stroke-width="${c.p===50?1.8:1.3}"${DASH[c.p]?` stroke-dasharray="${DASH[c.p]}"`:''}/>`).join('')).join('');
    // Rótulos das curvas à direita, afastados uns dos outros para não se sobreporem.
    const lab = curves.map(c=>{ const s=c.segs[c.segs.length-1], q=s[s.length-1]; return {p:c.p, y:Y(q.v)}; }).sort((a,b)=>b.y-a.y);
    for(let i=1;i<lab.length;i++) if(lab[i-1].y-lab[i].y<11) lab[i].y=lab[i-1].y-11;
    const labels = lab.map(l=>`<text x="${W-padR+12}" y="${(l.y+4).toFixed(1)}" font-size="11" fill="var(--who-line)" font-weight="${l.p===50?700:500}">P${l.p}</text>`).join('');
    const cut = view==='lhfa' && xMax>24 ? `<line x1="${X(24).toFixed(1)}" x2="${X(24).toFixed(1)}" y1="${padT}" y2="${H-padB}" stroke="var(--who-line)" stroke-width="1" stroke-dasharray="1 3"/>` : '';
    const child = pts.length>1 ? `<path d="${pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.v).toFixed(1)}`).join('')}" fill="none" stroke="var(--growth)" stroke-width="2.4" stroke-linejoin="round"/>` : '';
    const last=pts[pts.length-1];
    const dots = pts.map(p=>{ const cx=X(p.x).toFixed(1), cy=Y(p.v).toFixed(1), isLast=p===last;
      return `<g class="g-pt" role="button" tabindex="0" data-meas-metric="${p.metric}" data-meas-idx="${p.idx}" aria-label="${escapeAttr(growthAria(view,p))}${isLast?' '+lx('(última medição)','(dernière mesure)','(latest measurement)'):''}" style="cursor:pointer;">
        <circle cx="${cx}" cy="${cy}" r="13" fill="transparent"/>
        <circle class="g-ring" cx="${cx}" cy="${cy}" r="${isLast?10:7.5}" fill="none" stroke="${isLast?'var(--growth)':'transparent'}" stroke-width="2"/>
        <circle cx="${cx}" cy="${cy}" r="${isLast?5.5:4}" fill="var(--growth)" stroke="var(--surface)" stroke-width="1.5"/></g>`; }).join('');
    const lx0=X(last.x), ly0=Y(last.v);
    const anchor = lx0>W-padR-50 ? 'end' : lx0<padL+50 ? 'start' : 'middle';
    const tag = `<text x="${lx0.toFixed(1)}" y="${(ly0<padT+24 ? ly0+24 : ly0-15).toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="var(--growth)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${growthNum(last.v)} ${GROWTH_VIEWS[view].unit} · ${pctText(last.res.percentile)}</text>`;
    const summary = `${lx('Gráfico','Graphique','Chart')}: ${growthIndicatorName(last.res, GROWTH_VIEWS[view].metric)}, ${lx('padrões OMS para','standards OMS pour les','WHO standards for')} ${growthSexLabel()}. ${pl(pts.length,'medição','medições','mesure','mesures','measurement','measurements')}. ${lx('Curvas','Courbes','Curves')} P3, P15, P50, P85, P97. ${lx('Última','Dernière','Latest')}: ${growthAria(view,last)}`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="group" aria-label="${escapeAttr(summary)}" class="growth-svg">
      ${grid.join('')}${band(C(3),C(97))}${band(C(15),C(85))}${lines}${cut}${labels}${xt}${child}${dots}${tag}</svg>`;
  }
  function growthLegendHtml(view){
    const sw = (stroke, dash, w, dot) => `<svg width="26" height="10" aria-hidden="true" focusable="false"><line x1="1" x2="25" y1="5" y2="5" stroke="${stroke}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>${dot?`<circle cx="13" cy="5" r="3.5" fill="${stroke}"/>`:''}</svg>`;
    const axis = view==='wfl' ? lx('Horizontal: comprimento/altura (cm) · vertical: peso (kg)','Horizontal : longueur/taille (cm) · vertical : poids (kg)','Horizontal: length/height (cm) · vertical: weight (kg)')
      : lx('Horizontal: idade (meses) · vertical: ','Horizontal : âge (mois) · vertical : ','Horizontal: age (months) · vertical: ')+GROWTH_VIEWS[view].unit;
    return `<div class="legend growth-legend" aria-hidden="true">
      <span>${sw('var(--growth)','',2.4,true)}${escapeHtml(S.crianca.nome||tr('Bebé'))}</span>
      <span>${sw('var(--who-line)','',1.8)}P50</span>
      <span>${sw('var(--who-line)','6 3',1.3)}P15 / P85</span>
      <span>${sw('var(--who-line)','2 3',1.3)}P3 / P97</span></div>
      <p class="muted growth-axis">${axis}</p>`;
  }
  function growthCardHtml(){
    const view=growthView, V=GROWTH_VIEWS[view];
    const seg = `<div class="growth-seg" role="group" aria-label="${lx('Indicador de crescimento','Indicateur de croissance','Growth indicator')}">${Object.keys(GROWTH_VIEWS).map(k=>`<button type="button" data-growth-view="${k}" class="${k===view?'on':''}" aria-pressed="${k===view}"><span aria-hidden="true">${GROWTH_VIEWS[k].ic}</span> ${growthViewLabel(k).replace('/','/<wbr>')}</button>`).join('')}</div>`;
    const all = view==='wfl' ? growthPairs() : growthSeries(V.metric);

    if(setupIssue) body = `<div class="alert info" style="margin:10px 0 0;flex-wrap:wrap;">${ICONS.chart} <span style="flex:1;min-width:180px;">${growthReason(setupIssue)}</span>${setupIssue.reason!=='no-data'?`<button type="button" class="btn secondary" id="growthToProfile" style="min-height:44px;">${lx('Abrir Perfil','Ouvrir le Profil','Open Profile')}</button>`:''}</div>`;
    else if(!all.length) body = `<div class="chart-empty muted">${view==='wfl' ? lx('Para o peso/comprimento é preciso peso e comprimento/altura medidos no mesmo dia.','Pour le poids/longueur, il faut un poids et une longueur/taille mesurés le même jour.','Weight/length needs a weight and a length/height measured on the same day.') : tr('Sem registos suficientes.')}</div>`;
    else if(!valid.length) body = `<div class="chart-empty muted">${growthReason(all[all.length-1].res)}</div>`;
    else {
      let pts = valid;
      if(view==='wfl'){ const ind=valid[valid.length-1].res.indicator; pts=valid.filter(p=>p.res.indicator===ind); }

      const valTxt = view==='wfl' ? `${growthNum(last.v)} kg · ${growthNum(last.cm)} cm` : `${growthNum(last.v)} ${V.unit}`;
      body = `<p class="growth-last">${lx('Última medição: ','Dernière mesure : ','Latest measurement: ')}<b>${valTxt}</b> ${lx('em','le','on')} ${growthDate(last.date)}${ageTxt} · <b class="growth-pct">${pctText(last.res.percentile)}</b></p>
        <div class="chart-wrap">${whoGrowthChart(view, pts)}</div>${growthLegendHtml(view)}
        ${otherInd>0 ? `<p class="muted growth-note">${pl(otherInd,'medição','medições','mesure','mesures','measurement','measurements')} ${pts[0].res.indicator==='wfh' ? lx('de antes dos 24 meses (peso para o comprimento) fora deste gráfico de peso para a altura; ver histórico.','d\'avant 24 mois (poids pour la longueur) hors de ce graphique poids pour la taille ; voir l\'historique.','from before 24 months (weight-for-length) not in this weight-for-height chart; see history.') : lx('a partir dos 24 meses (peso para a altura) fora deste gráfico de peso para o comprimento; ver histórico.','à partir de 24 mois (poids pour la taille) hors de ce graphique poids pour la longueur ; voir l\'historique.','from 24 months (weight-for-height) not in this weight-for-length chart; see history.')}</p>` : ''}
        ${hidden>0 ? `<p class="muted growth-note">${pl(hidden,'medição não aparece','medições não aparecem','mesure n\'apparaît pas','mesures n\'apparaissent pas','measurement is not shown','measurements are not shown')} ${lx('no gráfico (fora do intervalo dos padrões; ver histórico).','dans le graphique (hors de l\'intervalle des standards ; voir l\'historique).','in the chart (outside the range of the standards; see history).')}</p>` : ''}`;
    }
    const viewNote = view==='lhfa' ? lx('Até aos 24 meses, a OMS usa o comprimento medido deitado; a partir dos 24 meses, a altura medida em pé. A app assume a posição pela idade na data da medição.','Jusqu\'à 24 mois, l\'OMS utilise la longueur mesurée couché ; à partir de 24 mois, la taille mesurée debout. L\'app déduit la position de l\'âge à la date de la mesure.','Up to 24 months the WHO uses length measured lying down; from 24 months, height measured standing. The app assumes the position from the age on the measurement date.')
      : view==='wfl' ? lx('Usa o peso e o comprimento/altura registados no mesmo dia. Até aos 24 meses: peso para o comprimento (45–110 cm); a partir dos 24 meses: peso para a altura (65–120 cm).','Utilise le poids et la longueur/taille enregistrés le même jour. Jusqu\'à 24 mois : poids pour la longueur (45–110 cm) ; à partir de 24 mois : poids pour la taille (65–120 cm).','Uses the weight and length/height logged on the same day. Up to 24 months: weight-for-length (45–110 cm); from 24 months: weight-for-height (65–120 cm).') : '';
    const history = all.slice().reverse().map(p=>{
      const val = view==='wfl' ? `${growthNum(p.v)} kg · ${growthNum(p.cm)} cm` : `${growthNum(p.v)} ${V.unit}`;

    }).join('');
    return `<div class="card growth-card">
      <p class="muted" style="margin:0 0 10px;">${lx('Padrões de crescimento da OMS (0–5 anos)','Standards de croissance de l\'OMS (0–5 ans)','WHO Child Growth Standards (0–5 years)')} · ${growthSexLabel()}</p>
      ${seg}${body}

      <div class="section-label" style="margin-top:14px;">${lx('Histórico','Historique','History')} · ${growthViewLabel(view)}</div>

      <p class="growth-disclaimer">${growthDisclaimer()}</p>

    </div>`;
  }
  function growthDisclaimer(){
    return lx('Os percentis comparam a medida da criança com os padrões de crescimento da OMS para crianças da mesma idade e sexo. Não constituem um diagnóstico médico.',
      'Les percentiles comparent la mesure de l\'enfant aux standards de croissance de l\'OMS pour les enfants du même âge et du même sexe. Ils ne constituent pas un diagnostic médical.',

  function renderEvolucao(){
    document.getElementById('main').innerHTML = `

        <div style="flex:1;"><label>${tr('PC (cm)')}</label><input type="text" inputmode="decimal" id="gHead"></div>
