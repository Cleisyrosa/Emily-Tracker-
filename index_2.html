<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily Tracker v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --surface-2:#f5f0e8; --border:#e6dcc9;
  --ink:#5a4a42; --ink-muted:#8a7a6e; --ink-faint:#ab9d90;
  --accent:#f8d7e6; --accent-ink:#5a4a42; --brand:#c9a876;
  --good:#2f6b4f; --good-soft:#c3e4d4;
  --warn:#8a6a10; --warn-soft:#fce4a4;
  --crit:#93332b; --crit-soft:#f5c4c4;
  --info:#2f5a86; --info-soft:#d9e8f7;
  --feed:#b8567a; --feed-soft:#f8d7e6; --diaper:#a06a3a; --diaper-soft:#f0e2c9; --sleepc:#6b5aa8; --sleepc-soft:#e2dcf0;
  --shadow:0 1px 2px rgba(90,74,66,.08), 0 10px 26px -14px rgba(90,74,66,.25);
  --bg-scrim:rgba(250,247,242,.40); --topbar-scrim-a:rgba(248,215,230,.55); --topbar-scrim-b:rgba(255,255,255,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a2622; --surface:#3d3935; --surface-2:#46413c; --border:#5a4a42;
    --ink:#f2ede8; --ink-muted:#c9bdb2; --ink-faint:#9c8f83;
    --accent:#f8d7e6; --accent-ink:#2a2622; --brand:#d9bd8f;
    --good:#8fd6ae; --good-soft:#24392f;
    --warn:#e0be6f; --warn-soft:#3a2f14;
    --crit:#e89b92; --crit-soft:#3a201d;
    --info:#8fbde0; --info-soft:#1f2f3f;
    --feed:#e8a0be; --feed-soft:#4a2f3a; --diaper:#d9a468; --diaper-soft:#3f3222; --sleepc:#b3a3e0; --sleepc-soft:#332c47;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55);
    --bg-scrim:rgba(42,38,34,.40); --topbar-scrim-a:rgba(248,215,230,.32); --topbar-scrim-b:rgba(61,57,53,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#2a2622; --surface:#3d3935; --surface-2:#46413c; --border:#5a4a42;
  --ink:#f2ede8; --ink-muted:#c9bdb2; --ink-faint:#9c8f83;
  --accent:#f8d7e6; --accent-ink:#2a2622; --brand:#d9bd8f;
  --good:#8fd6ae; --good-soft:#24392f;
  --warn:#e0be6f; --warn-soft:#3a2f14;
  --crit:#e89b92; --crit-soft:#3a201d;
  --info:#8fbde0; --info-soft:#1f2f3f;
  --feed:#e8a0be; --feed-soft:#4a2f3a; --diaper:#d9a468; --diaper-soft:#3f3222; --sleepc:#b3a3e0; --sleepc-soft:#332c47;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55);
  --bg-scrim:rgba(42,38,34,.40); --topbar-scrim-a:rgba(248,215,230,.32); --topbar-scrim-b:rgba(61,57,53,.35);
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{ color:var(--ink); font-family:'Mulish',system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; font-weight:600; text-wrap:balance; color:var(--ink); margin:0; }
.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; } input,select,textarea{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
svg{ display:block; }
a{ color:inherit; }

.phone{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
@media (min-width:540px){ body{ padding:22px 12px; } .phone{ min-height:calc(100vh - 44px); border-radius:26px; box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; } }

.topbar{ display:flex; align-items:center; gap:12px; padding:14px 16px 12px; background:linear-gradient(160deg, var(--accent), var(--surface) 78%); border-bottom:1px solid var(--border); }
.avatar{ width:50px; height:50px; border-radius:15px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-size:1.3rem; font-weight:600; flex:none; overflow:hidden; box-shadow:var(--shadow); }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.topbar-text{ flex:1; min-width:0; }
.topbar-text h1{ font-size:1.15rem; line-height:1.2; }
.topbar-text .age{ font-size:.76rem; color:var(--ink-muted); font-weight:600; }
.blood-chip{ background:var(--crit-soft); color:var(--crit); font-weight:800; font-size:.78rem; padding:5px 10px; border-radius:9px; flex:none; text-align:center; line-height:1.1; border:1px solid var(--crit); }
.blood-chip small{ display:block; font-size:.55rem; font-weight:700; letter-spacing:.03em; }

main{ flex:1; overflow-y:auto; padding:14px 14px 84px; }
@keyframes fadeIn{ from{ opacity:.5; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
main.fade-in{ animation:fadeIn .22s ease; }
@media (prefers-reduced-motion:reduce){ main.fade-in{ animation:none; } }
.panel{ display:none; animation:fade .2s ease; } .panel.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:12px; box-shadow:var(--shadow); transition:box-shadow .15s ease; }
.card h2{ font-size:1.02rem; margin-bottom:2px; }
.muted{ color:var(--ink-muted); font-size:.83rem; }
.section-label{ font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; font-weight:800; color:var(--brand); margin:0 0 10px; }
.demo-banner{ display:flex; align-items:center; gap:10px; background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn); border-radius:12px; padding:10px 14px; font-size:.8rem; margin-bottom:14px; font-weight:700; }
.demo-banner button{ margin-left:auto; background:none; border:1px solid var(--warn); color:var(--warn); border-radius:8px; padding:4px 10px; font-size:.72rem; font-weight:700; cursor:pointer; flex:none; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 13px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow); }
.stat .ic{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--brand); margin-bottom:2px;}
.stat .ic.sleepc{ background:var(--sleepc-soft); color:var(--sleepc); }
.stat .ic.feed{ background:var(--feed-soft); color:var(--feed); }
.stat .ic.diaper{ background:var(--diaper-soft); color:var(--diaper); }
.stat .lbl{ font-size:.65rem; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
.stat .val{ font-family:'Fraunces'; font-size:1.02rem; }
.stat .sub{ font-size:.72rem; color:var(--ink-muted); }

.qa-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.qa-grid.g3{ grid-template-columns:repeat(3,1fr); }
.qa-tile{ border:1px solid var(--border); background:var(--surface); border-radius:13px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink); text-align:center; }
.qa-tile:hover{ border-color:var(--brand); }
.qa-tile .ic{ width:32px; height:32px; border-radius:10px; background:var(--accent); color:var(--brand); display:flex; align-items:center; justify-content:center; }
.qa-tile.running{ border-color:var(--good); background:var(--good-soft); }
.qa-tile .lbl{ font-size:.68rem; font-weight:700; }

.timeline-wrap{ overflow-x:auto; }
.form-panel{ margin-top:12px; padding:13px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); display:flex; flex-direction:column; gap:9px; }
.form-row{ display:flex; gap:8px; flex-wrap:wrap; }
.form-row label{ font-size:.72rem; font-weight:700; color:var(--ink-muted); display:block; margin-bottom:4px; }
.seg{ display:flex; gap:6px; flex-wrap:wrap; }
.seg button{ flex:1; min-width:64px; padding:8px 6px; border:1px solid var(--border); background:var(--surface); border-radius:9px; font-size:.75rem; font-weight:700; color:var(--ink-muted); cursor:pointer; }
.seg button.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); font-size:.83rem; }
textarea{ min-height:56px; resize:vertical; }
input.demo-ex,textarea.demo-ex{ font-style:italic; color:var(--ink-muted); border-style:dashed; background:var(--surface-2); }
.btn{ padding:9px 16px; border-radius:10px; border:none; background:var(--brand); color:#fff; font-weight:700; font-size:.83rem; cursor:pointer; }
.btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--ink-muted); }
.btn.crit{ background:var(--crit); }
.btn.wide{ width:100%; }
.btn-row{ display:flex; gap:8px; }

.log-item{ display:flex; align-items:center; gap:10px; padding:9px 3px; border-top:1px solid var(--border); }
.log-item:first-child{ border-top:none; }
.log-item .ic{ width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--brand); flex:none; }
.log-item .ic.feed{ background:var(--feed-soft); color:var(--feed); }
.log-item .ic.diaper{ background:var(--diaper-soft); color:var(--diaper); }
.log-item .ic.sleepc{ background:var(--sleepc-soft); color:var(--sleepc); }
.log-item .body{ flex:1; min-width:0; }
.log-item .title{ font-size:.83rem; font-weight:700; }
.log-item .meta{ font-size:.71rem; color:var(--ink-muted); }
.log-item .time{ font-family:'IBM Plex Mono'; font-size:.7rem; color:var(--ink-faint); flex:none; }
.log-del{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:.85rem; flex:none; padding:4px; }
.log-del:hover{ color:var(--crit); }
.empty{ color:var(--ink-faint); font-size:.8rem; font-style:italic; padding:8px 3px; }

.alert{ display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; font-size:.8rem; font-weight:600; margin-bottom:10px; }
.alert.crit{ background:var(--crit-soft); color:var(--crit); border:1px solid var(--crit); }
.alert.warn{ background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); }
.alert.good{ background:var(--good-soft); color:var(--good); border:1px solid var(--good); }
.alert.info{ background:var(--info-soft); color:var(--info); border:1px solid var(--info); }

details.acc{ border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--surface); overflow:hidden; }
details.acc summary{ cursor:pointer; padding:12px 13px; font-weight:700; font-size:.86rem; list-style:none; display:flex; align-items:center; gap:9px; background:var(--surface-2); }
details.acc summary::-webkit-details-marker{ display:none; }
details.acc summary .car{ margin-left:auto; transition:transform .15s; color:var(--ink-muted); }
details.acc[open] summary .car{ transform:rotate(180deg); }
.acc-body{ padding:13px; display:flex; flex-direction:column; gap:10px; }
.tag{ display:inline-flex; align-items:center; gap:4px; background:var(--crit-soft); color:var(--crit); border-radius:999px; padding:4px 10px; font-size:.74rem; font-weight:700; border:1px solid var(--crit); }
.tag.intol{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip-x{ background:none; border:none; color:inherit; cursor:pointer; font-weight:900; margin-left:2px; }
.add-inline{ display:flex; gap:6px; }
.add-inline input{ flex:1; }
.med-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
.med-row:first-child{ border-top:none; }
.med-row .body{ flex:1; font-size:.83rem; }
.dose-btn{ background:var(--accent); color:var(--ink); border:none; border-radius:8px; padding:6px 10px; font-size:.72rem; font-weight:700; cursor:pointer; flex:none; }

.critical-block{ background:var(--crit-soft); border:2px solid var(--crit); border-radius:14px; padding:14px; margin-bottom:12px; text-align:center; }
.critical-block .bt{ font-family:'Fraunces'; font-size:2.1rem; font-weight:700; color:var(--crit); line-height:1; }
.critical-block .rh{ font-size:.78rem; color:var(--crit); font-weight:700; margin-top:2px; }

.vax-group{ border-top:1px solid var(--border); padding:9px 0; }
.vax-group:first-child{ border-top:none; }
.vax-group .vname{ font-weight:700; font-size:.85rem; margin-bottom:6px; }
.vax-dose{ display:flex; align-items:center; gap:8px; padding:4px 0; font-size:.78rem; }
.vax-dose .lbl{ flex:1; color:var(--ink-muted); }
.vax-badge{ font-size:.66rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.02em; border:none; cursor:pointer; font-family:'IBM Plex Mono'; }
.vax-badge.done{ background:var(--good-soft); color:var(--good); }
.vax-badge.pending{ background:var(--warn-soft); color:var(--warn); }
.vax-badge.soon{ background:var(--crit-soft); color:var(--crit); }

.milestone-band{ border-top:1px solid var(--border); padding:10px 0; }
.milestone-card{ border-radius:22px; padding:28px 22px; text-align:center; color:#3d3935; box-shadow:0 8px 24px -10px rgba(0,0,0,.25); }
.milestone-card .mc-name{ font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:1.4rem; }
.milestone-card .mc-week{ display:inline-block; margin:8px 0 14px; padding:5px 14px; border-radius:999px; background:rgba(0,0,0,.06); font-weight:700; font-size:.8rem; }
.milestone-card .mc-text{ font-size:1.05rem; line-height:1.5; margin-bottom:16px; }
.milestone-card .mc-brand{ font-size:.75rem; font-weight:700; color:#8a7a6e; letter-spacing:.03em; }
.milestone-band:first-child{ border-top:none; }
.milestone-band h3{ font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin-bottom:6px; }
.mi-row{ display:flex; align-items:center; gap:9px; padding:5px 0; font-size:.83rem; }
.mi-row .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.mi-row.done .dot{ background:var(--good); } .mi-row.pending .dot{ background:var(--warn); }
.mi-row .d{ margin-left:auto; font-size:.68rem; color:var(--ink-faint); font-family:'IBM Plex Mono'; }

.chart-wrap{ overflow-x:auto; } .chart-wrap svg{ font-family:'IBM Plex Mono',monospace; }
.axis-label{ fill:var(--ink-faint); font-size:8.5px; }
.legend{ display:flex; gap:14px; font-size:.68rem; color:var(--ink-muted); margin-top:6px; flex-wrap:wrap; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ width:12px; height:2.5px; display:inline-block; border-radius:2px; }

.sos-card{ background:var(--crit-soft); border:2px solid var(--crit); border-radius:16px; padding:16px; margin-bottom:12px; }
.sos-card h2{ color:var(--crit); font-size:1.05rem; }
.sos-line{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px dashed rgba(147,51,43,.3); font-size:.83rem; }
.sos-line:first-of-type{ border-top:none; }
.sos-line b{ color:var(--ink); text-align:right; }
.call-btn{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:12px; background:var(--surface); border:1px solid var(--border); text-decoration:none; color:var(--ink); margin-bottom:8px; box-shadow:var(--shadow); }
.call-btn .ic{ width:32px; height:32px; border-radius:9px; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center; flex:none; }
.call-btn .t1{ font-weight:700; font-size:.84rem; } .call-btn .t2{ font-size:.72rem; color:var(--ink-muted); font-family:'IBM Plex Mono'; }

.theme-seg{ display:flex; gap:8px; }
.theme-seg button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-weight:700; font-size:.8rem; cursor:pointer; }
.theme-seg button.on{ background:var(--brand); color:#fff; border-color:var(--brand); }

.gallery{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.gallery .g-item{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--surface-2); }
.gallery img{ width:100%; height:100%; object-fit:cover; }
.gallery .g-del{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:.65rem; cursor:pointer; }
.photo-row{ display:flex; align-items:center; gap:12px; }
.photo-box{ width:60px; height:60px; border-radius:15px; background:var(--surface-2); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
.photo-box img{ width:100%; height:100%; object-fit:cover; }
.file-btn{ font-size:.76rem; font-weight:700; color:var(--brand); background:none; border:1px dashed var(--brand); border-radius:9px; padding:8px 12px; cursor:pointer; }

.summary-box{ margin-top:10px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:.83rem; white-space:pre-wrap; line-height:1.6; }

nav.tabbar{ position:sticky; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:7px 3px calc(7px + env(safe-area-inset-bottom)); overflow-x:auto; gap:1px; }
.tab-btn{ flex:1 0 56px; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px 2px; border-radius:9px; }
.tab-btn.active{ color:var(--brand); }
.tab-btn .lbl{ font-size:.56rem; font-weight:700; white-space:nowrap; }

.swatch-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }
.swatch{ aspect-ratio:1; border-radius:11px; border:2px solid transparent; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center; }
.swatch.on{ border-color:var(--ink); }
.swatch.on::after{ content:"✓"; color:var(--ink); font-weight:900; }
.icon-btn{ width:36px; height:36px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--brand); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
.icon-btn.on{ background:var(--crit); border-color:var(--crit); color:#fff; animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
.sos-fab{ width:38px; height:38px; border-radius:50%; background:var(--crit); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; box-shadow:var(--shadow); }
.voice-panel{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
@media (min-width:540px){ .voice-panel{ align-items:center; } }
.voice-card{ background:var(--surface); border-radius:18px 18px 0 0; padding:20px; max-width:460px; width:100%; text-align:center; }
.voice-card.settings-card{ text-align:left; max-height:85vh; overflow-y:auto; }
.phone.has-bg{ background-size:cover; background-position:center; background-attachment:fixed; }
.phone.has-bg > main{ background:var(--bg-scrim); }
.phone.has-bg > main > .card, .phone.has-bg > main > .alert, .phone.has-bg > main > .demo-banner{ box-shadow:0 2px 10px -4px rgba(0,0,0,.18), var(--shadow); }
.phone.has-bg .topbar{ backdrop-filter:blur(4px); background:linear-gradient(160deg, var(--topbar-scrim-a), var(--topbar-scrim-b) 78%); }
.bg-preview{ width:100%; height:90px; border-radius:12px; object-fit:cover; border:1px solid var(--border); margin-top:8px; }
@media (min-width:540px){ .voice-card{ border-radius:18px; } }
.voice-transcript{ min-height:44px; margin:14px 0; font-size:.95rem; color:var(--ink-muted); }
.consulta-row{ border-top:1px solid var(--border); padding:10px 0; }
.consulta-row:first-child{ border-top:none; }
.consulta-row .cdate{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--brand); font-weight:700; }
.counter-row{ display:flex; align-items:center; gap:10px; }
.counter-btn{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-weight:900; cursor:pointer; color:var(--ink); }
.doc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.doc-item{ position:relative; border-radius:10px; overflow:hidden; background:var(--surface-2); aspect-ratio:3/4; display:flex; flex-direction:column; }
.doc-item img{ width:100%; height:100%; object-fit:cover; flex:1; }
.doc-item .doc-tag{ font-size:.6rem; padding:3px; text-align:center; background:var(--surface); color:var(--ink-muted); }
.doc-item .g-del{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:.65rem; cursor:pointer; }

.child-switch{ display:flex; gap:6px; padding:10px 14px 0; overflow-x:auto; }
.child-chip{ flex:none; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-size:.76rem; font-weight:700; cursor:pointer; white-space:nowrap; }
.child-chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
.child-chip.add{ border-style:dashed; color:var(--brand); border-color:var(--brand); background:transparent; }

    const merged = remote.criancas.map(rc=>{
      const local = localById[rc.id];
      const photo = local ? {foto:local.foto, fotos:local.fotos, documentos:local.documentos} : {};
      const child = hydrateChild(Object.assign({}, rc, photo));
      if(local){
        child.mamadas = mergeById(local.mamadas, rc.mamadas);

        child.sono = mergeById(local.sono, rc.sono);

    });

  function ageInfo(dob){
    const d0=new Date(dob+"T00:00:00"), d1=new Date();
    let months=(d1.getFullYear()-d0.getFullYear())*12+(d1.getMonth()-d0.getMonth());
    let days=d1.getDate()-d0.getDate();
    if(days<0){ months--; const pm=new Date(d1.getFullYear(),d1.getMonth(),0); days+=pm.getDate(); }
    const lang=(S.settings&&S.settings.lang)||'pt';
    let label;
    if(lang==='fr'){
      label = months<1 ? `${days} jour${days===1?'':'s'}` : `${months} mois`+(days>0?` et ${days} jour${days===1?'':'s'}`:'');
    } else if(lang==='en'){
      label = months<1 ? `${days} day${days===1?'':'s'}` : `${months} month${months===1?'':'s'}`+(days>0?` and ${days} day${days===1?'':'s'}`:'');
    } else {
      label = months<1 ? days+" dia"+(days===1?"":"s") : months+" mes"+(months===1?"":"es")+(days>0?" e "+days+" dia"+(days===1?"":"s"):"");
    }
    return {months, days, label};
  }
  async function triggerDownload(filename, blob){
    if(window.claude){

        const downloads = await claude.use("downloads");
        if(downloads){ await downloads.save({ filename, data:blob }); return 'saved'; }
      }catch(e){ if(e && e.code==='declined') return 'declined'; }
    }
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);

  function resizeImageFile(file, maxDim, quality, cb){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ cb(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ cb(e.target.result); }
      };
      img.onerror = ()=>cb(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = ()=>cb(null);
    reader.readAsDataURL(file);

  function fmtWhen(ts){

  function agoStr(ts){

    if(mins<60) return (lang==='fr'?"il y a ":lang==='en'?"":"há ")+mins+(lang==='en'?"min ago":"min");
    const h=Math.floor(mins/60), m=mins%60;

      if(lang==='en') return `${h}h`+(m?(' '+m+'min'):'')+' ago';

  function downloadMilestoneCard(d){
    const w=640, h=800;
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,d.g1); grad.addColorStop(1,d.g2);
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    const cardX=48,cardY=140,cardW=w-96,cardH=460,cardR=28;
    ctx.beginPath();
    ctx.moveTo(cardX+cardR,cardY);
    ctx.arcTo(cardX+cardW,cardY,cardX+cardW,cardY+cardH,cardR);
    ctx.arcTo(cardX+cardW,cardY+cardH,cardX,cardY+cardH,cardR);
    ctx.arcTo(cardX,cardY+cardH,cardX,cardY,cardR);
    ctx.arcTo(cardX,cardY,cardX+cardW,cardY,cardR);
    ctx.closePath(); ctx.fill();
    ctx.textAlign='center'; ctx.fillStyle='#3d3935';
    ctx.font='700 30px Georgia, serif'; ctx.fillText(d.nome, w/2, cardY+70);
    ctx.font='600 18px sans-serif'; ctx.fillStyle='#8a6a10';
    roundRectText(ctx, d.weekLbl, w/2, cardY+120);
    ctx.fillStyle='#5a4a42'; ctx.font='400 22px sans-serif';
    wrapText(ctx, d.text, w/2, cardY+200, cardW-80, 30);
    ctx.font='600 16px sans-serif'; ctx.fillStyle='#8a7a6e';
    ctx.fillText('Emily Tracker', w/2, cardY+cardH-30);
    canvas.toBlob(async (blob)=>{
      if(!blob){ showAlert(tr('Não foi possível gerar a imagem.')); return; }
      const result = await triggerDownload(`emily-tracker-marco-${todayISO()}.png`, blob);
      if(result==='error') showAlert(tr('Exportação de ficheiros indisponível nesta vista.'));
    }, 'image/png');
  }
  function roundRectText(ctx, text, cx, cy){
    ctx.save();

    ctx.fillStyle='rgba(0,0,0,0.06)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx-w/2, cy-hgt+8, w, hgt, 16) : ctx.rect(cx-w/2, cy-hgt+8, w, hgt);
    ctx.fill();

    ctx.fillText(text, cx, cy);
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words=text.split(' '); let line=''; let curY=y;
    words.forEach((word,i)=>{
      const test=line+word+' ';
      if(ctx.measureText(test).width>maxWidth && i>0){ ctx.fillText(line, x, curY); line=word+' '; curY+=lineHeight; }
      else line=test;
    });
    ctx.fillText(line, x, curY);
  }

  function playChime(force){
    if(!force && S.settings && S.settings.sound===false) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [880,1175].forEach((freq,i)=>{
        const t0 = now + i*0.09;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type='sine'; osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0+0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0+0.18);
      });
    }catch(e){ /* Web Audio indisponível — nunca bloqueia o registo */ }
  }

  function medDueSoon(m){

    if(!m.notificacoes) return null;
    const lang=(S.settings&&S.settings.lang)||'pt';
    if(last){
      const dueAt = last.ts + m.intervaloHoras*3600000;
      if(Date.now() >= dueAt){
        if(lang==='fr') return `La dose de ${m.nome} peut être administrée (min. ${m.intervaloHoras}h depuis la dernière).`;
        if(lang==='en') return `${m.nome}'s dose can be given now (min. ${m.intervaloHoras}h since the last one).`;
        return `Dose de ${m.nome} já pode ser administrada (mín. ${m.intervaloHoras}h desde a última).`;
      }
      return null;
    }
    if(m.horario){
      const [hh,mm] = m.horario.split(':').map(Number);
      const now=new Date(); const target=new Date(); target.setHours(hh,mm,0,0);
      const diffMin=(target-now)/60000;
      if(diffMin>=-30 && diffMin<=30){
        if(lang==='fr') return `${m.nome} prévu(e) à ${m.horario}.`;
        if(lang==='en') return `${m.nome} scheduled for ${m.horario}.`;

      let txt;
      if(lang==='fr') txt = lastBk ? `Ça fait plus de 2 semaines sans sauvegarde. Exporte tes données dans Réglages.` : `Tu n'as pas encore fait de sauvegarde. Exporte tes données dans Réglages pour ne rien perdre.`;
      else if(lang==='en') txt = lastBk ? `It's been over 2 weeks since your last backup. Export your data in Settings.` : `You haven't backed up yet. Export your data in Settings so you don't lose anything.`;
      else txt = lastBk ? `Já lá vão mais de 2 semanas sem backup. Exporta os teus dados em Definições.` : `Ainda não fizeste backup. Exporta os teus dados em Definições para não perderes nada.`;
      msgs.push(ICONS.note+' '+txt);
    }
    (c.medicacoes||[]).forEach(m=>{ const r=medDueSoon(m); if(r) msgs.push(ICONS.pill+' '+r); });
    (c.consultas||[]).forEach(cs=>{
      const days=(new Date(cs.data+"T00:00:00")-new Date())/86400000;
      if(days>=0 && days<=3){
        const dd=Math.ceil(days), esp=cs.especialista||tr('especialista'), dateStr=new Date(cs.data+"T00:00:00").toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT');
        let txt;
        if(lang==='fr') txt = `Rendez-vous avec ${esp} dans ${dd} jour(s) — ${dateStr}`;
        else if(lang==='en') txt = `Appointment with ${esp} in ${dd} day(s) — ${dateStr}`;
        else txt = `Consulta com ${esp} em ${dd} dia(s) — ${dateStr}`;
        msgs.push(ICONS.calendar+' '+txt);
      }
    });
    Object.keys(S.vacinacao.doses||{}).forEach(k=>{
      const d = S.vacinacao.doses[k];
      if(d && !d.done && d.proximaData){
        const days=(new Date(d.proximaData+"T00:00:00")-new Date())/86400000;
        if(days>=0 && days<=14){
          const dd=Math.ceil(days), dateStr=new Date(d.proximaData+"T00:00:00").toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT');
          let txt;
          if(lang==='fr') txt = `Vaccin prévu le ${dateStr} (${dd} jours)`;
          else if(lang==='en') txt = `Vaccine scheduled for ${dateStr} (${dd} days)`;
          else txt = `Vacina agendada para ${dateStr} (${dd} dias)`;
          msgs.push(ICONS.syringe+' '+txt);
        }
      }
    });
    el.innerHTML = msgs.length ? `<div style="padding:0 14px;">${msgs.map(m=>`<div class="alert warn">${m}</div>`).join('')}</div>` : '';
  }

  /* ============ INÍCIO ============ */
  function lastOf(arr){ return arr.slice().sort((a,b)=>b.ts-a.ts)[0]; }
  function timelineSvg(){
    const [t0] = todayRange();
    const w=600,h=70; const evs=[];
    S.mamadas.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'feed'}));
    S.fraldas.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'diaper'}));
    S.doses.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'med'}));
    const sleeps = S.sono.filter(l=>l.inicio<t0+86400000 && l.fim>t0);
    const xPos = ts => 10 + ((ts-t0)/86400000)*(w-20);
    const bands = sleeps.map(s=>{
      const a=Math.max(s.inicio,t0), b=Math.min(s.fim,t0+86400000);
      return `<rect x="${xPos(a).toFixed(1)}" y="18" width="${Math.max(2,(xPos(b)-xPos(a))).toFixed(1)}" height="20" rx="4" fill="var(--accent)"/>`;
    }).join('');
    const colors = {feed:'var(--brand)', diaper:'var(--info)', med:'var(--crit)'};
    const dots = evs.map(e=>`<circle cx="${xPos(e.x).toFixed(1)}" cy="28" r="4" fill="${colors[e.type]}"/>`).join('');
    const ticks = [0,6,12,18,24].map(hh=>`<text class="axis-label" x="${(10+hh/24*(w-20)).toFixed(1)}" y="55" text-anchor="middle">${hh}h</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="70">
      <line x1="10" y1="28" x2="${w-10}" y2="28" stroke="var(--border)"/>
      ${bands}${dots}${ticks}
    </svg>
    <div class="legend"><span><i style="background:var(--brand)"></i>${tr('refeição')}</span><span><i style="background:var(--info)"></i>${tr('fralda')}</span><span><i style="background:var(--crit)"></i>${tr('medicação')}</span><span><i style="background:var(--accent)"></i>${tr('sono')}</span></div>`;
  }

  function renderInicio(){
    const [t0,t1]=todayRange();
    const feed=lastOf(S.mamadas), diaper=lastOf(S.fraldas);
    const isSleeping=!!S.running.sleepStart;
    const lastSleep=lastOf(S.sono);
    const feedsToday=S.mamadas.filter(l=>inRange(l.ts,t0,t1)).length;
    const diapersToday=S.fraldas.filter(l=>inRange(l.ts,t0,t1));
    const xixiToday=diapersToday.filter(d=>d.tipo==='xixi').length, cocoToday=diapersToday.filter(d=>d.tipo==='coco').length;
    const sleepMinsToday=S.sono.filter(l=>inRange(l.inicio,t0,t1)||inRange(l.fim,t0,t1)).reduce((s,l)=>s+(l.duracaoMin||0),0);
    const peso = S.evolucao.peso.length ? S.evolucao.peso[S.evolucao.peso.length-1].valor : null;

    let html='';
    if(S.crianca.seed) html += `<div class="demo-banner">${ICONS.note} ${tr('Estás a ver dados de exemplo.')} <button id="clearSeed" type="button">${tr('Começar do zero')}</button></div>`;

    if(xixiToday>0 && xixiToday<6){
      const lang=(S.settings&&S.settings.lang)||'pt';
      let msg;
      if(lang==='fr') msg = `Seulement ${xixiToday} couche(s) mouillée(s) aujourd'hui — objectif 6–8/jour. Surveille les signes de déshydratation.`;
      else if(lang==='en') msg = `Only ${xixiToday} wet diaper(s) today — target 6–8/day. Watch for dehydration signs.`;

      html += `<div class="alert warn">${ICONS.drop} ${msg}</div>`;
    }
    const H = 3600000;
    if(feed && (Date.now()-feed.ts) > 4*H) html += `<div class="alert warn">${ICONS.bottle} ${tr('Já passaram mais de 4h desde a última refeição registada.')}</div>`;

    html += `<div class="grid2">
      <div class="stat"><div class="ic feed">${ICONS.bottle}</div><div class="lbl">${tr('Última refeição')}</div><div class="val">${feed?agoStr(feed.ts):'—'}</div><div class="sub">${feed?feedLabel(feed):tr('sem registos')}</div></div>
      <div class="stat"><div class="ic diaper">${ICONS.drop}</div><div class="lbl">${tr('Última fralda')}</div><div class="val">${diaper?agoStr(diaper.ts):'—'}</div><div class="sub">${diaper?diaperLabel(diaper):tr('sem registos')}</div></div>
      <div class="stat"><div class="ic sleepc">${ICONS.moon}</div><div class="lbl">${isSleeping?tr('A dormir há'):tr('Sono hoje')}</div><div class="val">${isSleeping? durStr((Date.now()-S.running.sleepStart)/60000) : durStr(sleepMinsToday)}</div><div class="sub">${isSleeping?tr('em curso'):(lastSleep?(tr('último:')+' '+agoStr(lastSleep.fim)):tr('sem registos'))}</div></div>
      <div class="stat"><div class="ic">${ICONS.chart}</div><div class="lbl">${tr('Peso atual')}</div><div class="val">${peso?peso+'kg':'—'}</div><div class="sub">${tr('ver em Evolução')}</div></div>
    </div>

    <div class="card"><div class="section-label">${tr('Hoje')}</div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat" style="align-items:center;text-align:center;"><div class="val">${feedsToday}</div><div class="sub">${tr('refeições')}</div></div>
        <div class="stat" style="align-items:center;text-align:center;"><div class="val">${xixiToday}x/${cocoToday}x</div><div class="sub">${tr('xixi / cocó')}</div></div>
        <div class="stat" style="align-items:center;text-align:center;"><div class="val">${(sleepMinsToday/60).toFixed(1)}h</div><div class="sub">${tr('sono')}</div></div>
      </div>
    </div>

    <div class="card"><div class="section-label">${tr('Linha do tempo · hoje')}</div><div class="timeline-wrap">${timelineSvg()}</div></div>

    <div class="card"><div class="section-label">${tr('Ações rápidas')}</div>
      <div class="qa-grid">
        <div class="qa-tile" data-quick="mamadas">${ICONS.bottle}<span class="lbl">${tr('Mamada')}</span></div>
        <div class="qa-tile" data-quick="fraldas">${ICONS.drop}<span class="lbl">${tr('Fralda')}</span></div>
        <div class="qa-tile${isSleeping?' running':''}" data-quick="sono">${ICONS.moon}<span class="lbl">${isSleeping?tr('Terminar'):tr('Sono')}</span></div>
        <div class="qa-tile" data-quick="med">${ICONS.pill}<span class="lbl">${tr('Medicação')}</span></div>
      </div>
    </div>`;
    document.getElementById('main').innerHTML = html;
    const cs=document.getElementById('clearSeed');
    if(cs) cs.addEventListener('click', ()=>{
      showConfirm(tr('Apaga os dados de exemplo deste perfil e começa do zero. Continuar?'), ()=>{
        const c=S.crianca;
        c.seed=false; S.mamadas.length=0; S.fraldas.length=0; S.sono.length=0; S.doses.length=0;
        c.evolucao.peso.length=0; c.evolucao.altura.length=0; c.evolucao.pc.length=0;
        c.alergiasMed=[]; c.intolerancias=[];
        save(); render();
      });
    });
    document.querySelectorAll('[data-quick]').forEach(t=>t.addEventListener('click', ()=>{
      const dest=t.dataset.quick;
      if(dest==='sono' && isSleeping){ stopSleep(); return; }
      if(dest==='sono'){ S.running.sleepStart=Date.now(); save(); playChime(); render(); return; }
      if(dest==='med'){ activeTab='perfil'; render(); return; }
      activeTab=dest; openForm='new'; render();
    }));
  }

  function stopSleep(){
    const start=S.running.sleepStart, end=Date.now();
    S.sono.unshift({id:uid(), periodo:(new Date(start).getHours()>=20||new Date(start).getHours()<7)?'noite':'sesta', posicao:'costas', inicio:start, fim:end, duracaoMin:(end-start)/60000, qualidade:7, interrupcoes:0, obs:''});

  }

  function giveDose(med, force){
    const last = S.doses.filter(d=>d.nome===med.nome).sort((a,b)=>b.ts-a.ts)[0];
    const hoursSince = last ? (Date.now()-last.ts)/3600000 : Infinity;
    const warnEl = document.getElementById('doseWarning');
    const lang=(S.settings&&S.settings.lang)||'pt';
    if(!force && hoursSince < med.intervaloHoras){
      const warnTxt = lang==='fr' ? `Dernière dose de ${med.nome} il y a ${hoursSince.toFixed(1)}h — minimum ${med.intervaloHoras}h.`
        : lang==='en' ? `Last dose of ${med.nome} was ${hoursSince.toFixed(1)}h ago — minimum ${med.intervaloHoras}h.`
        : `Última dose de ${med.nome} há ${hoursSince.toFixed(1)}h — mínimo ${med.intervaloHoras}h.`;
      const forceLbl = lang==='fr' ? 'Enregistrer quand même' : lang==='en' ? 'Log anyway' : 'Registar mesmo assim';
      if(warnEl) warnEl.innerHTML = `<div class="alert crit">${ICONS.pill} ${warnTxt} <button class="btn crit" style="margin-left:8px;" data-forceDose="${med.id}" type="button">${forceLbl}</button></div>`;
      const fb = warnEl ? warnEl.querySelector('[data-forceDose]') : null;
      if(fb) fb.addEventListener('click', ()=>giveDose(med, true));
      return;
    }
    S.doses.unshift({id:uid(), ts:Date.now(), nome:med.nome, dose:med.dose});
    const doneTxt = lang==='fr' ? `Dose de ${med.nome} enregistrée.` : lang==='en' ? `Dose of ${med.nome} logged.` : `Dose de ${med.nome} registada.`;
    save(); playChime(); if(warnEl) warnEl.innerHTML = `<div class="alert good">${ICONS.pill} ${doneTxt}</div>`;
  }

  function renderMamadas(){
    const [t0,t1]=todayRange();
    const today = S.mamadas.filter(l=>inRange(l.ts,t0,t1));
    const sorted = S.mamadas.slice().sort((a,b)=>a.ts-b.ts);
    let avgInterval='—';
    if(sorted.length>1){ const diffs=[]; for(let i=1;i<sorted.length;i++) diffs.push(sorted[i].ts-sorted[i-1].ts); avgInterval = durStr(diffs.reduce((a,b)=>a+b,0)/diffs.length/60000); }
    const totalMl = today.reduce((s,l)=> s + (l.tipo==='biberao' ? (l.mlBebido||l.mlOferecido||0) : 0), 0);
    const last = lastOf(S.mamadas);
    const days = last7();

  /* ============ FRALDAS ============ */
  function renderFraldas(){
    const [t0,t1]=todayRange();
    const today=S.fraldas.filter(l=>inRange(l.ts,t0,t1));
    const xixi=today.filter(d=>d.tipo==='xixi').length, coco=today.filter(d=>d.tipo==='coco').length;
    const sorted=S.fraldas.slice().sort((a,b)=>a.ts-b.ts);
    let avgInterval='—';
    if(sorted.length>1){ const diffs=[]; for(let i=1;i<sorted.length;i++) diffs.push(sorted[i].ts-sorted[i-1].ts); avgInterval=durStr(diffs.reduce((a,b)=>a+b,0)/diffs.length/60000); }
    const days=last7();
    const xixiBars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; return {v:S.fraldas.filter(l=>inRange(l.ts,a,b)&&l.tipo==='xixi').length, label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'})}; });
    const cocoBars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; return {v:S.fraldas.filter(l=>inRange(l.ts,a,b)&&l.tipo==='coco').length, label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'})}; });

      else if(lang==='en') msg = `Alert: ${xixi} wet diapers today — below the 6–8/day target. Possible dehydration sign.`;
      else msg = `Alerta: ${xixi} xixi hoje — abaixo da meta 6–8/dia. Possível sinal de desidratação.`;

      <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="text-align:center;"><div class="val">${xixi}</div><div class="sub">${tr('xixi')}</div></div>
        <div class="stat" style="text-align:center;"><div class="val">${coco}</div><div class="sub">${tr('cocó')}</div></div>

    <div class="card"><h2>${tr('Cocó · semana')}</h2><div class="chart-wrap">${barChart(cocoBars)}</div></div>
    <div class="card"><div class="section-label">${tr('Registos de hoje')}</div><div id="logList"></div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('newFralda').addEventListener('click', ()=>{ openForm = (openForm==='new'&&!editId)?null:'new'; editId=null; renderDiaperForm(); });

  /* ============ SONO ============ */
  function sleepTargetH(months){ if(months<1) return [14,17]; if(months<4) return [14,16]; if(months<6) return [12,15]; if(months<12) return [11,14]; return [10,13]; }
  function renderSono(){
    const isSleeping=!!S.running.sleepStart;
    const [t0,t1]=todayRange();
    const todayMins=S.sono.filter(l=>inRange(l.inicio,t0,t1)||inRange(l.fim,t0,t1)).reduce((s,l)=>s+(l.duracaoMin||0),0);
    const months = ageInfo(S.crianca.dataNascimento).months;
    const [lo,hi]=sleepTargetH(months);
    const hoursToday = todayMins/60;
    const status = hoursToday>=lo ? (hoursToday<=hi+2?'good':'good') : (hoursToday>=lo-2?'warn':'crit');
    const statusLabel = status==='good'?'🟢 '+tr('OK'):status==='warn'?'🟡 '+tr('BAIXO'):'🔴 '+tr('CRÍTICO');
    const avgQual = S.sono.length ? (S.sono.reduce((s,l)=>s+(l.qualidade||0),0)/S.sono.length).toFixed(1) : '—';
    const days=last7();
    const bars=days.map(d=>{ const a=new Date(d+"T00:00:00").getTime(),b=a+86400000; const mins=S.sono.filter(l=>inRange(l.inicio,a,b)).reduce((s,l)=>s+(l.duracaoMin||0),0); return {v:+(mins/60).toFixed(1), label:new Date(d+"T00:00:00").toLocaleDateString(localeTag(),{weekday:'narrow'})}; });

    const lang=(S.settings&&S.settings.lang)||'pt';
    const metaLbl = lang==='fr' ? `objectif (${months}m)` : lang==='en' ? `target (${months}m)` : `meta (${months}m)`;
    const qualMedLbl = lang==='fr' ? `Qualité moyenne : ${avgQual}/10` : lang==='en' ? `Average quality: ${avgQual}/10` : `Qualidade média: ${avgQual}/10`;
    const terminarLbl = lang==='fr' ? `Terminer le sommeil (${durStr((Date.now()-S.running.sleepStart)/60000)})` : lang==='en' ? `End sleep (${durStr((Date.now()-S.running.sleepStart)/60000)})` : `Terminar sono (${durStr((Date.now()-S.running.sleepStart)/60000)})`;
    const horasDiaLbl = lang==='fr' ? `heures par jour · objectif ${lo}–${hi}h` : lang==='en' ? `hours per day · target ${lo}–${hi}h` : `horas por dia · meta ${lo}–${hi}h`;
    const napsToday = S.sono.filter(l=>inRange(l.inicio,t0,t1)).length;
    let html = `<div class="card"><div class="section-label">${tr('Hoje')}</div>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.moon}</div><div class="val">${hoursToday.toFixed(1)}h</div><div class="sub">${tr('total')}</div></div>
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.moon}</div><div class="val">${napsToday}</div><div class="sub">${tr('sonecas hoje')}</div></div>
        <div class="stat" style="text-align:center;align-items:center;"><div class="ic sleepc">${ICONS.chart}</div><div class="val">${statusLabel}</div><div class="sub">${tr('estado')}</div></div>
      </div>
      <p class="muted" style="margin-top:6px;">${qualMedLbl}</p>
      <div class="qa-tile${isSleeping?' running':''}" id="sleepToggle" style="width:100%;flex-direction:row;justify-content:center;gap:8px;margin-top:6px;">${ICONS.moon}<span class="lbl">${isSleeping?terminarLbl:tr('Iniciar sono agora')}</span></div>
      <button class="btn ghost wide" id="newSono" type="button" style="margin-top:8px;">${tr('+ Registo manual')}</button>
      <div id="formHolder"></div>
    </div>
    <div class="card"><h2>${tr('Semana')}</h2><p class="muted">${horasDiaLbl}</p><div class="chart-wrap">${barChart(bars,{targetLine:lo})}</div></div>
    <div class="card"><div class="section-label">${tr('Registos')}</div><div id="logList"></div></div>`;
    document.getElementById('main').innerHTML = html;
    document.getElementById('sleepToggle').addEventListener('click', ()=>{ isSleeping ? stopSleep() : (S.running.sleepStart=Date.now(), save(), playChime(), render()); });
    document.getElementById('newSono').addEventListener('click', ()=>{ openForm = (openForm==='new'&&!editId)?null:'new'; editId=null; renderSleepForm(); });
    if(openForm==='new') renderSleepForm();
    renderSleepLog();
  }
  function renderSleepForm(){
    const holder=document.getElementById('formHolder'); if(!holder) return;
    if(openForm!=='new'){ holder.innerHTML=''; return; }
    const editing = editId ? S.sono.find(l=>l.id===editId) : null;
    const now = new Date();
    const isSleeping = !!S.running.sleepStart;
    const iniVal = editing ? fmtTimeOnly(editing.inicio) : now.toTimeString().slice(0,5);

    holder.innerHTML = `<div class="form-panel">

      ${(!isSleeping&&!editing) ? `<label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:.82rem;"><input type="checkbox" id="sAindaDorme" style="width:auto;"> ${tr('Ainda está a dormir — registar só a hora que adormeceu')}</label>` : ''}
      <div id="sFimBlock">

  /* ============ EVOLUÇÃO ============ */
  function whoRef(metric){
    return WHO_MONTHS.map((m,i)=>({m, p10:WHO[metric].p10[i], p50:WHO[metric].p50[i], p90:WHO[metric].p90[i]}));
  }
  function growthChart(series, metric, unit){
    const ref = whoRef(metric);
    const maxM = Math.max(6, ...series.map(s=>s.m));
    const refClamped = ref.filter(r=>r.m<=maxM+1);
    const w=320,h=160,pad=30;
    const allY = [...refClamped.map(r=>r.p10),...refClamped.map(r=>r.p90),...series.map(s=>s.v)];
    const minY=Math.min(...allY)*0.96, maxY=Math.max(...allY)*1.04;
    const x = m => pad + (m/maxM)*(w-pad-14);
    const y = v => h-pad-((v-minY)/(maxY-minY))*(h-pad-14);
    function linePath(pts,key){ return pts.map((p,i)=>`${i===0?'M':'L'}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' '); }
    const p10Path = linePath(refClamped,'p10'), p50Path = linePath(refClamped,'p50'), p90Path = linePath(refClamped,'p90');
    const dataPath = series.map((s,i)=>`${i===0?'M':'L'}${x(s.m).toFixed(1)},${y(s.v).toFixed(1)}`).join(' ');
    const dots = series.map(s=>`<circle cx="${x(s.m).toFixed(1)}" cy="${y(s.v).toFixed(1)}" r="3.4" fill="var(--crit)"/>`).join('');
    const ticks=[0,3,6,9,12].filter(m=>m<=maxM).map(m=>`<text class="axis-label" x="${x(m).toFixed(1)}" y="${h-8}" text-anchor="middle">${m}m</text>`).join('');
    const lastPt = series[series.length-1];
    const endLabel = lastPt ? `<text x="${x(lastPt.m).toFixed(1)}" y="${(y(lastPt.v)-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--crit)">${lastPt.v}${unit}</text>` : '';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="160">
      <path d="${p10Path}" fill="none" stroke="var(--info)" stroke-width="1.3" stroke-dasharray="3,2" opacity=".6"/>
      <path d="${p50Path}" fill="none" stroke="var(--brand)" stroke-width="1.5" opacity=".8"/>
      <path d="${p90Path}" fill="none" stroke="var(--info)" stroke-width="1.3" stroke-dasharray="3,2" opacity=".6"/>
      <path d="${dataPath}" fill="none" stroke="var(--crit)" stroke-width="2.2"/>
      ${dots}${ticks}${endLabel}
    </svg>
    <div class="legend"><span><i style="background:var(--crit)"></i>${tr('Emily/exemplo')}</span><span><i style="background:var(--brand)"></i>${tr('P50 OMS')}</span><span><i style="background:var(--info)"></i>${tr('P10 / P90 OMS')}</span></div>`;
  }
  function ageMonthsAt(dob, dateStr){
    const d0=new Date(dob+"T00:00:00"), d1=new Date(dateStr+"T00:00:00");
    return (d1.getFullYear()-d0.getFullYear())*12+(d1.getMonth()-d0.getMonth()) + (d1.getDate()-d0.getDate())/30;
  }

    <div class="card"><h2>${tr('Peso')}</h2><p class="muted">${ultimoLbl} ${pesoS.length?pesoS[pesoS.length-1].v+'kg':'—'} ${lang==='pt'?'em':lang==='fr'?'le':'on'} ${pesoS.length?pesoS[pesoS.length-1].date:'—'}</p><div class="chart-wrap">${pesoS.length?growthChart(pesoS,'weight','kg'):`<div class="chart-empty muted">${tr('Sem registos suficientes.')}</div>`}</div></div>

  /* ============ RESUMO ============ */
  function periodStats(days, offsetDays){
    offsetDays = offsetDays||0;
    const t1=Date.now()-offsetDays*86400000, t0=t1-days*86400000;
    const mamadas = S.mamadas.filter(l=>inRange(l.ts,t0,t1));
    const fraldas = S.fraldas.filter(l=>inRange(l.ts,t0,t1));
    const sono = S.sono.filter(l=>inRange(l.inicio,t0,t1));
    const sonoMin = sono.reduce((s,l)=>s+(l.duracaoMin||0),0);
    const xixi = fraldas.filter(f=>f.tipo==='xixi').length, coco=fraldas.filter(f=>f.tipo==='coco').length;
    const biberoes = mamadas.filter(m=>m.tipo==='biberao');
    const totalMl = biberoes.reduce((s,m)=>s+(m.mlBebido||m.mlOferecido||0),0);
    return { mamadas: mamadas.length, biberoes: biberoes.length, totalMl, sonoMin, avgSonoH:(sonoMin/60/days).toFixed(1), xixi, coco, xixiAvg:(xixi/days).toFixed(1) };
  }
  function growthDelta(days){
    const cutoff = Date.now()-days*86400000;
    const inWin = arr => arr.filter(r=>new Date(r.date).getTime()>=cutoff);
    const p = inWin(S.evolucao.peso), a = inWin(S.evolucao.altura);
    const dp = p.length>1 ? (p[p.length-1].valor-p[0].valor) : null;
    const da = a.length>1 ? (a[a.length-1].valor-a[0].valor) : null;
    return {dp,da};
  }
  // Resumo inteligente: frases calculadas localmente a partir dos próprios dados (sem IA/API paga).
  function smartInsights(){
    const lang=(S.settings&&S.settings.lang)||'pt';
    const items=[];
    const cur=periodStats(7,0), prev=periodStats(7,7);
    const hasPrev = (prev.sonoMin>0)||(prev.mamadas>0)||(prev.xixi>0);
    if(cur.sonoMin>0 || prev.sonoMin>0){
      const curH=+cur.avgSonoH, prevH=+prev.avgSonoH;
      let txt;
      if(prevH>0){
        const diffPct=Math.round(((curH-prevH)/prevH)*100), sign=diffPct>=0?'+':'';
        txt = lang==='fr' ? `Sommeil moyen : ${curH}h/jour cette semaine (${sign}${diffPct}% vs semaine dernière).`
          : lang==='en' ? `Average sleep: ${curH}h/day this week (${sign}${diffPct}% vs last week).`
          : `Sono médio: ${curH}h/dia esta semana (${sign}${diffPct}% vs semana passada).`;
      } else {
        txt = lang==='fr' ? `Sommeil moyen : ${curH}h/jour cette semaine.`
          : lang==='en' ? `Average sleep: ${curH}h/day this week.`
          : `Sono médio: ${curH}h/dia esta semana.`;
      }
      items.push({ic:ICONS.moon, txt});
    }
    const t1=Date.now(), t0=t1-3*86400000;
    const feeds3 = S.mamadas.filter(m=>inRange(m.ts,t0,t1)).slice().sort((a,b)=>a.ts-b.ts);
    if(feeds3.length>=2){
      const diffs=[]; for(let i=1;i<feeds3.length;i++) diffs.push((feeds3[i].ts-feeds3[i-1].ts)/3600000);
      const avgInt=(diffs.reduce((s,v)=>s+v,0)/diffs.length).toFixed(1);
      const txt = lang==='fr' ? `Intervalle moyen entre repas (3 derniers jours) : ${avgInt}h.`
        : lang==='en' ? `Average interval between feeds (last 3 days): ${avgInt}h.`
        : `Intervalo médio entre mamadas (últimos 3 dias): ${avgInt}h.`;
      items.push({ic:ICONS.bottle, txt});
    }
    if(hasPrev && prev.xixi>0){
      const diffPct=Math.round(((cur.xixi-prev.xixi)/prev.xixi)*100), sign=diffPct>=0?'+':'';
      const txt = lang==='fr' ? `Couches mouillées : ${cur.xixiAvg}/jour cette semaine (${sign}${diffPct}% vs semaine dernière).`
        : lang==='en' ? `Wet diapers: ${cur.xixiAvg}/day this week (${sign}${diffPct}% vs last week).`
        : `Fraldas de xixi: ${cur.xixiAvg}/dia esta semana (${sign}${diffPct}% vs semana passada).`;
      items.push({ic:ICONS.drop, txt});
    }
    const pesoArr = S.evolucao.peso;
    if(pesoArr.length>=2){
      const last=pesoArr[pesoArr.length-1], prevM=pesoArr[pesoArr.length-2];
      const deltaKg=last.valor-prevM.valor, sign=deltaKg>=0?'+':'';
      const days=Math.max(1, Math.round((new Date(last.date)-new Date(prevM.date))/86400000));
      const txt = lang==='fr' ? `Poids : ${sign}${deltaKg.toFixed(2)}kg depuis la dernière pesée (il y a ${days}j).`
        : lang==='en' ? `Weight: ${sign}${deltaKg.toFixed(2)}kg since last weigh-in (${days}d ago).`
        : `Peso: ${sign}${deltaKg.toFixed(2)}kg desde a última pesagem (há ${days}d).`;
      items.push({ic:ICONS.chart, txt});
    }
    return items;
  }
  function parecer(stats, growth, months){
    const [lo] = sleepTargetH(months);
    const lang=(S.settings&&S.settings.lang)||'pt';
    const bits=[];
    if(lang==='fr'){
      bits.push(stats.mamadas ? `${stats.mamadas} repas enregistrés` : 'aucun repas enregistré');
      bits.push(`sommeil moyen ${stats.avgSonoH}h/jour (objectif ${lo}h+)` + (stats.avgSonoH < lo ? ' — sous l\'objectif' : ' — dans l\'objectif'));
      bits.push(`${stats.xixiAvg} couches mouillées/jour en moyenne` + (stats.xixiAvg<6 ? ' — attention à l\'hydratation' : ''));
      if(growth.dp!=null) bits.push(`a pris ${growth.dp.toFixed(2)}kg sur la période`);
      if(growth.da!=null) bits.push(`a grandi de ${growth.da.toFixed(1)}cm sur la période`);
    } else if(lang==='en'){
      bits.push(stats.mamadas ? `${stats.mamadas} feedings logged` : 'no feedings logged');
      bits.push(`average sleep ${stats.avgSonoH}h/day (target ${lo}h+)` + (stats.avgSonoH < lo ? ' — below target' : ' — on target'));
      bits.push(`${stats.xixiAvg} wet diapers/day on average` + (stats.xixiAvg<6 ? ' — watch hydration' : ''));
      if(growth.dp!=null) bits.push(`gained ${growth.dp.toFixed(2)}kg over the period`);
      if(growth.da!=null) bits.push(`grew ${growth.da.toFixed(1)}cm over the period`);
    } else {
      bits.push(stats.mamadas ? `${stats.mamadas} refeições registadas` : 'sem refeições registadas');
      bits.push(`sono médio ${stats.avgSonoH}h/dia (meta ${lo}h+)` + (stats.avgSonoH < lo ? ' — abaixo da meta' : ' — dentro da meta'));
      bits.push(`${stats.xixiAvg} xixi/dia em média` + (stats.xixiAvg<6 ? ' — atenção à hidratação' : ''));
      if(growth.dp!=null) bits.push(`ganhou ${growth.dp.toFixed(2)}kg no período`);
      if(growth.da!=null) bits.push(`cresceu ${growth.da.toFixed(1)}cm no período`);
    }
    return bits.join('; ') + '.';
  }

  async function exportSummaryPdf(label, stats, growth, months){
    try{
      if(!window.jspdf){ showAlert(tr('PDF indisponível offline.')); return; }
      const { jsPDF } = window.jspdf;
      const lang=(S.settings&&S.settings.lang)||'pt';
      const doc = new jsPDF();
      doc.setFontSize(16); doc.text('Emily Tracker — '+tr('Resumo')+' '+tr(label), 14, 18);
      doc.setFontSize(10); doc.text(new Date().toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT'), 14, 25);
      const childLbl = lang==='fr'?'Enfant':lang==='en'?'Child':'Criança';
      const monthsLbl = lang==='fr'?'mois':lang==='en'?'months':'meses';
      const parecerLbl = lang==='fr'?'Avis':lang==='en'?'Assessment':'Parecer';
      const lines = doc.splitTextToSize(
        `${childLbl}: ${S.crianca.nome} (${months} ${monthsLbl})\n\n`+
        summaryBoxTxt(stats)+`\n\n`+
        `${parecerLbl}: ${parecer(stats,growth,months)}`, 180);
      doc.text(lines, 14, 36);
      const blob = doc.output('blob');
      const result = await triggerDownload(`emily-tracker-resumo-${label.toLowerCase()}.pdf`, blob);
      if(result==='error') showAlert(tr('Exportação de ficheiros indisponível nesta vista.'));
    }catch(e){ if(!(e&&e.code==='declined')) showAlert(tr('Não foi possível gerar o PDF.')); }
  }

  /* ============ shared charts ============ */
  function barChart(bars, opts){
    opts=opts||{};
    const w=300,h=140,pad=24,gap=8;
    const max=Math.max(...bars.map(b=>b.v), opts.targetLine||0, 1);
    const bw=(w-2*pad-gap*(bars.length-1))/bars.length;
    const bh=v=>(v/max)*(h-2*pad-14);
    const bars_=bars.map((b,i)=>{ const bx=pad+i*(bw+gap), by=h-pad-bh(b.v);
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh(b.v).toFixed(1)}" rx="3" fill="var(--brand)"/>
        <text class="axis-label" x="${(bx+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${b.label}</text>
        <text x="${(bx+bw/2).toFixed(1)}" y="${(by-5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">${b.v}</text>`;
    }).join('');
    const target = opts.targetLine ? `<line x1="${pad}" y1="${(h-pad-bh(opts.targetLine)).toFixed(1)}" x2="${w-8}" y2="${(h-pad-bh(opts.targetLine)).toFixed(1)}" stroke="var(--crit)" stroke-dasharray="4,3" stroke-width="1.2"/>` : '';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="140">
      <line x1="${pad}" y1="${h-pad}" x2="${w-8}" y2="${h-pad}" stroke="var(--border)"/>
      ${bars_}${target}
    </svg>`;
  }

    applyDemoExClear();
  }
  // Campos com dados de exemplo (perfil demo) ficam marcados "demo-ex" e esvaziam-se
  // sozinhos ao primeiro toque, para não ser preciso apagar tudo à mão para escrever.
  function applyDemoExClear(){
    const c = S.crianca;
    if(!c || !c.seed) return;
    c.seedTouched = c.seedTouched || {};
    document.querySelectorAll('#main input[type=text][id], #main textarea[id]').forEach(el=>{
      if(c.seedTouched[el.id]) return;
      if(!el.value) return;
      el.classList.add('demo-ex');
    });
  }
  document.addEventListener('focusin', (e)=>{
    const el = e.target;
    if(!el || !el.classList || !el.classList.contains('demo-ex')) return;
    el.value=''; el.classList.remove('demo-ex');
    el.dispatchEvent(new Event('input', {bubbles:true}));
    const c = S.crianca;
    if(c){ c.seedTouched = c.seedTouched || {}; c.seedTouched[el.id]=true; }
  });
  function wireFooterSettings(){
    document.getElementById('themeSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.settings.theme=b.dataset.v; save(); applyTheme(); render(); renderSettingsOverlay(); }));
    document.querySelectorAll('[data-accent]').forEach(sw=>sw.addEventListener('click', ()=>{ S.settings.accentIndex=+sw.dataset.accent; save(); applyTheme(); render(); renderSettingsOverlay(); }));
    document.getElementById('langSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.settings.lang=b.dataset.v; applySeedLanguage(b.dataset.v); save(); render(); renderSettingsOverlay(); }));
    document.getElementById('soundToggle').addEventListener('change', e=>{ S.settings.sound = e.target.checked; save(); });
    document.getElementById('testSound').addEventListener('click', ()=>playChime(true));
    const bgBtn=document.getElementById('bgPhotoBtn'), bgInput=document.getElementById('bgPhotoInput'), bgRemove=document.getElementById('bgPhotoRemove');
    if(bgBtn) bgBtn.addEventListener('click', ()=>bgInput.click());
    if(bgInput) bgInput.addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      resizeImageFile(f, 1800, 0.88, (dataUrl)=>{
        if(!dataUrl) return;
        S.settings.bgPhoto = dataUrl;
        const ok = save(); applyBackgroundPhoto();
        if(!ok) showAlert(tr('Não foi possível guardar — o espaço de armazenamento deste dispositivo está cheio (normalmente por causa de fotos/documentos). Remove algumas fotos em Perfil ou exporta os teus dados agora em Definições, para não perderes nada.'));
        renderSettingsOverlay();
      });
    });
    if(bgRemove) bgRemove.addEventListener('click', ()=>{ S.settings.bgPhoto=''; save(); applyBackgroundPhoto(); renderSettingsOverlay(); });
    document.getElementById('exportBtn').addEventListener('click', async ()=>{
      const btn=document.getElementById('exportBtn'); const orig=btn.textContent;
      try{
        const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
        const result = await triggerDownload('emily-tracker-dados.json', blob);
        if(result==='error'){ btn.textContent=tr('Exportação indisponível aqui'); setTimeout(()=>btn.textContent=orig,2000); return; }
        if(result==='declined') return;
        S.settings.lastBackupAt = Date.now(); save();
        btn.textContent=tr('Guardado!'); setTimeout(()=>btn.textContent=orig,1500);
      }catch(err){ btn.textContent=tr('Não foi possível exportar'); setTimeout(()=>btn.textContent=orig,2000); }
    });
    document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
    document.getElementById('importInput').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{ S=loadState(JSON.parse(r.result)); setActiveChild(S.activeChildId); save(); applyTheme(); render(); }catch(err){ showAlert(tr('Ficheiro inválido.')); } };
      r.readAsText(f);
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      showConfirm(tr('Isto apaga TODOS os dados guardados neste dispositivo. Continuar?'), ()=>{
        localStorage.removeItem(KEY); S=defaultState(); S.criancas[0].seed=false; setActiveChild(S.activeChildId); save(); applyTheme(); render();
      });
    });
    const rc=document.getElementById('removeChildBtn');
    if(rc) rc.addEventListener('click', ()=>{
      showConfirm(tr('Remover perfil de')+' '+S.crianca.nome+'? '+tr('Esta ação não pode ser desfeita.'), ()=>{
        S.criancas = S.criancas.filter(x=>x.id!==S.activeChildId);
        setActiveChild(S.criancas[0].id);
        save(); activeTab='inicio'; render();
      });
    });
  }

  applyTheme(); render(); initSync();
  setInterval(()=>{
    renderReminders();
    if(S.running.sleepStart && (activeTab==='inicio'||activeTab==='sono')) render();
  }, 30000);
})();
</script>
</body>
