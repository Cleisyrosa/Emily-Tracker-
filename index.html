<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily Tracker v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Baloo+2:wght@500;600;700;800&family=Mulish:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Padrões de crescimento da OMS: dados oficiais (gerados) + cálculos. Ver tools/who-growth/. -->
<script src="who-growth-data.js"></script>
<script src="who-growth.js"></script>
<style>
:root{
  /* design system U9 — tipografia, espaçamento e raios */
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-base:16px; --fs-lg:18px; --fs-xl:21px; --fs-title:24px; --fs-2xl:28px; --fs-3xl:34px;
  /* Gramática tipográfica (F3): título de página 24 Baloo · título de secção 18 Baloo · corpo 14 Mulish ·
     secundário 13 · rótulo 12 (maiúsculas só para metadados curtos) · números de destaque 18–34 Baloo. Mono só para horas/datas/números técnicos. */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px;
  --r-1:8px; --r-2:12px; --r-3:16px; --r-4:20px; --r-5:24px; --r-6:28px;
  --growth:#2c7280; --growth-soft:#d6eef1; --who-line:#77685d; --who-band:rgba(119,104,93,.09); --feed-text:#953f5e; --on-feed:#ffffff;
  --bg:#fffaf3; --surface:#ffffff; --surface-2:#f5f0e8; --border:#f0e6d6;
  --ink:#5a4a42; --ink-muted:#76685e; --ink-faint:#817061;
  /* ACENTO (identidade, escolhido pelo utilizador) — derivados em JS por applyTheme() para o acento e o tema:
     --accent/--accent-soft fundo suave de seleção · --accent-ink texto/ícone sobre ele · --brand botão principal ·
     --brand-ink texto sobre --brand · --brand-text acento como texto/ícone/borda sobre as superfícies · --header-* header */
  --accent:#f9dce8; --accent-soft:#f9dce8; --accent-ink:#a34569; --brand:#c2708f; --brand-ink:#241d19; --brand-text:#af4b71; --on-crit:#ffffff;
  --good:#2f6b4f; --good-soft:#dcefd4;
  --warn:#81630f; --warn-soft:#fce4a4;
  --crit:#93332b; --crit-soft:#f5c4c4;
  --info:#2f5a86; --info-soft:#d9e8f7;
  --feed:#b8567a; --feed-soft:#f6c9dc; --diaper:#a06a3a; --diaper-soft:#f0e2c9; --sleepc:#6b5aa8; --sleepc-soft:#e2dcf0;
  --shadow:0 1px 2px rgba(90,74,66,.08), 0 10px 26px -14px rgba(90,74,66,.25);
  /* SEMÂNTICA (significado fixo, nunca depende do acento) — nomes de domínio sobre os valores existentes */
  --sleep:var(--sleepc); --sleep-soft:var(--sleepc-soft); --med:var(--warn); --med-soft:var(--warn-soft); --sos:var(--crit); --sos-soft:var(--crit-soft);
  --sos-fill:var(--crit); --on-sos-fill:#ffffff;   /* botão SOS cheio: vermelho de emergência nos dois temas */
  --bg-scrim:rgba(250,247,242,.40); --topbar-scrim-a:rgba(248,215,230,.55); --topbar-scrim-b:rgba(255,255,255,.35);
  --header-bg:#f6c9dc; --header-ink:#7a3350; --header-ink-soft:#a35e78;
  --header-chip-bg:rgba(255,255,255,.75); --header-chip-ink:#7a3350;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a2622; --surface:#3d3935; --surface-2:#46413c; --border:#5a4a42;
    --ink:#f2ede8; --ink-muted:#c9bdb2; --ink-faint:#b6aca4;
    --accent:#f9dce8; --accent-ink:#2a2622; --brand:#c2708f; --brand-ink:#241d19; --brand-text:#d69eb3; --on-crit:#241d19;
    --good:#8fd6ae; --good-soft:#24392f;
    --warn:#e0be6f; --warn-soft:#3a2f14;
    --crit:#e89b92; --crit-soft:#3a201d;
    --info:#8fbde0; --info-soft:#1f2f3f;
    --growth:#7fc8d4; --growth-soft:#1f3a3f; --who-line:#bcb0a5; --who-band:rgba(188,176,165,.10); --feed-text:#e8a0be; --on-feed:#241d19; --feed:#e8a0be; --feed-soft:#4a2f3a; --diaper:#d9a468; --diaper-soft:#3f3222; --sleepc:#b3a3e0; --sleepc-soft:#332c47;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55); --sos-fill:#c2443a; --tl-sleep-op:.55;
    --bg-scrim:rgba(42,38,34,.40); --topbar-scrim-a:rgba(248,215,230,.32); --topbar-scrim-b:rgba(61,57,53,.35);
    --header-bg:#4a2f3a; --header-ink:#f8d7e6; --header-ink-soft:#e8a0be;
    --header-chip-bg:rgba(0,0,0,.28); --header-chip-ink:#f8d7e6;
  }
}
:root[data-theme="dark"]{
  --bg:#2a2622; --surface:#3d3935; --surface-2:#46413c; --border:#5a4a42;
  --ink:#f2ede8; --ink-muted:#c9bdb2; --ink-faint:#b6aca4;
  --accent:#f9dce8; --accent-ink:#2a2622; --brand:#c2708f; --brand-ink:#241d19; --brand-text:#d69eb3; --on-crit:#241d19;
  --good:#8fd6ae; --good-soft:#24392f;
  --warn:#e0be6f; --warn-soft:#3a2f14;
  --crit:#e89b92; --crit-soft:#3a201d;
  --info:#8fbde0; --info-soft:#1f2f3f;
  --growth:#7fc8d4; --growth-soft:#1f3a3f; --who-line:#bcb0a5; --who-band:rgba(188,176,165,.10); --feed-text:#e8a0be; --on-feed:#241d19; --feed:#e8a0be; --feed-soft:#4a2f3a; --diaper:#d9a468; --diaper-soft:#3f3222; --sleepc:#b3a3e0; --sleepc-soft:#332c47;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.55); --sos-fill:#c2443a; --tl-sleep-op:.55;
  --bg-scrim:rgba(42,38,34,.40); --topbar-scrim-a:rgba(248,215,230,.32); --topbar-scrim-b:rgba(61,57,53,.35);
  --header-bg:#4a2f3a; --header-ink:#f8d7e6; --header-ink-soft:#e8a0be;
  --header-chip-bg:rgba(0,0,0,.28); --header-chip-ink:#f8d7e6;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{ color:var(--ink); font-family:'Mulish',system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
h1,h2,h3,.display{ font-family:'Baloo 2','Fraunces',Georgia,serif; font-weight:700; text-wrap:balance; color:var(--ink); margin:0; }
.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; } input,select,textarea{ font-family:inherit; }
:focus-visible{ outline:3px solid var(--brand-text); outline-offset:2px; border-radius:var(--r-1); }
input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--brand-text); outline-offset:1px; }
.topbar :focus-visible{ outline-color:var(--header-ink); }
button:disabled, .btn:disabled{ opacity:.45; cursor:not-allowed; }
.bar-day:focus-visible{ outline:none; } .bar-day:focus-visible rect:first-child{ stroke:var(--brand-text); stroke-width:2; }
svg{ display:block; }
a{ color:inherit; }

.phone{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
@media (min-width:540px){ body{ padding:22px 12px; } .phone{ min-height:calc(100vh - 44px); border-radius:var(--r-6); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; } }

.topbar{ position:relative; display:flex; align-items:center; gap:var(--space-2); padding:16px 14px 18px; background:var(--header-bg); border-radius:0 0 26px 26px; overflow:hidden; }
.topbar .confetti{ position:absolute; pointer-events:none; opacity:.8; }
.avatar{ position:relative; width:46px; height:46px; border-radius:50%; background:var(--surface); color:var(--header-ink); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-size:var(--fs-xl); font-weight:700; flex:none; overflow:hidden; box-shadow:0 6px 16px -6px rgba(122,51,80,.35); border:3px solid #fff; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.topbar-text{ position:relative; flex:1; min-width:0; }
.topbar-text h1{ font-size:var(--fs-xl); line-height:1.2; color:var(--header-ink); }
.topbar-text .age{ font-size:var(--fs-xs); color:var(--header-ink-soft); font-weight:700; line-height:1.25; }
.blood-chip{ position:relative; background:var(--header-chip-bg); color:var(--header-chip-ink); font-weight:800; font-size:var(--fs-xs); padding:4px 7px; border-radius:var(--r-2); flex:none; text-align:center; line-height:1.1; border:none; }
.blood-chip small{ display:block; font-size:var(--fs-xs); font-weight:700; letter-spacing:.03em; }
/* Ecrãs estreitos (< 480px): o grupo sanguíneo passa para uma 2.ª linha, por baixo dos botões,
   para o nome e a idade terem largura (a idade fica em 1–2 linhas). Tamanhos de letra e botões iguais. */
@media (max-width:479px){
  .topbar{ display:grid; grid-template-columns:auto minmax(0,1fr) auto auto auto; column-gap:6px; row-gap:6px; align-items:center; }
  .topbar .avatar{ grid-column:1; grid-row:1 / span 2; }
  .topbar-text{ grid-column:2; grid-row:1 / span 2; }
  .topbar #settingsBtn{ grid-column:3; grid-row:1; }
  .topbar #voiceBtn{ grid-column:4; grid-row:1; }
  .topbar #sosFab{ grid-column:5; grid-row:1; }
  .topbar .blood-chip{ grid-column:3 / span 3; grid-row:2; justify-self:end; }
}

main{ flex:1; overflow-y:auto; padding:14px 14px 84px; }
@keyframes fadeIn{ from{ opacity:.5; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
main.fade-in{ animation:fadeIn .22s ease; }
@media (prefers-reduced-motion:reduce){ main.fade-in{ animation:none; } }
.panel{ display:none; animation:fade .2s ease; } .panel.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }

.card{ background:var(--surface); border:2px solid var(--surface-2); border-radius:var(--r-4); padding:15px; margin-bottom:12px; box-shadow:var(--shadow); transition:box-shadow .15s ease; }
.card h2{ font-size:var(--fs-lg); line-height:1.2; margin-bottom:4px; }
.page-title{ display:flex; align-items:center; gap:var(--space-2); font-size:var(--fs-title); line-height:1.15; margin:2px 2px 12px; color:var(--ink); }
.page-title svg{ width:22px; height:22px; flex:none; color:var(--brand-text); }
.muted{ color:var(--ink-muted); font-size:var(--fs-sm); }
/* título do cartão: o primeiro rótulo de um cartão tem o mesmo nível de um h2 de cartão */
.card > .section-label:first-child{ font-family:'Baloo 2','Fraunces',Georgia,serif; font-size:var(--fs-lg); font-weight:700; letter-spacing:0; line-height:1.2; color:var(--ink); margin-bottom:8px; }
.card > .section-label:first-child .muted{ display:block; margin-top:2px; font-family:'Mulish',system-ui,-apple-system,sans-serif; }
.section-label{ font-size:var(--fs-sm); letter-spacing:.01em; font-weight:800; color:var(--brand-text); margin:0 0 10px; }
.demo-banner{ display:flex; align-items:center; gap:10px; background:var(--info-soft); border:1px solid transparent; color:var(--ink); border-radius:var(--r-4); padding:10px 14px; font-size:var(--fs-sm); margin-bottom:14px; font-weight:700; }
.demo-banner button{ margin-left:auto; background:none; border:1px solid var(--border); color:var(--ink); border-radius:var(--r-2); padding:4px 10px; font-size:var(--fs-xs); font-weight:700; cursor:pointer; flex:none; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.stat{ background:var(--surface); border:2px solid var(--surface-2); border-radius:var(--r-4); padding:12px 13px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow); }
.stat .ic{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-ink); margin-bottom:2px;}
.stat .ic.sleepc{ background:var(--sleepc-soft); color:var(--sleepc); }
.stat .ic.feed{ background:var(--feed-soft); color:var(--feed); }
.stat .ic.diaper{ background:var(--diaper-soft); color:var(--diaper); }
.stat .ic.growth{ background:var(--growth-soft); color:var(--growth); }
.field-hint{ display:flex; align-items:center; gap:var(--space-1); margin:var(--space-1) 0 0; font-size:var(--fs-xs); color:var(--ink-muted); } .field-hint svg{ width:14px; height:14px; }
.mais-group{ font-size:var(--fs-xs); font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin:var(--space-3) 0 var(--space-1); } .mais-group:first-child{ margin-top:0; }
.qm-row{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) 0; border-top:1px solid var(--border); } .qm-row:first-child{ border-top:none; } .qm-row .body{ flex:1; min-width:0; }
.stat-link{ cursor:pointer; } .stat-link:hover{ border-color:var(--brand-text); }
.stat .lbl{ font-size:var(--fs-xs); letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
.stat .val{ font-family:'Baloo 2'; font-size:var(--fs-lg); }
.stat .sub{ font-size:var(--fs-xs); color:var(--ink-muted); }

.qa-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }   /* larguras iguais, uma label longa não alarga a coluna */
.qa-grid.g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.qa-grid .qa-tile{ padding-left:0; padding-right:0; }
.qa-tile .lbl{ hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word; max-width:100%; }   /* a 375 px "Médicament" (FR) não cabe: hifeniza pelo idioma em vez de cortar a palavra */
.qa-tile{ border:2px solid var(--surface-2); background:var(--surface-2); border-radius:var(--r-4); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; color:var(--ink); text-align:center; min-height:64px; justify-content:center;  font:inherit; width:100%;}
.qa-tile:hover{ border-color:var(--brand); }
.qa-tile .ic{ width:34px; height:34px; border-radius:50%; background:var(--surface); color:var(--brand-text); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px -2px rgba(90,74,66,.2); }
.qa-tile .ic.feed{ background:var(--feed-soft); color:var(--feed); }
.qa-tile .ic.diaper{ background:var(--diaper-soft); color:var(--diaper); }
.qa-tile .ic.sleepc{ background:var(--sleepc-soft); color:var(--sleepc); }
.qa-tile .ic.good{ background:var(--good-soft); color:var(--good); }
.qa-tile .ic.med{ background:var(--med-soft); color:var(--med); }
.qa-tile.running{ border-color:var(--good); background:var(--good-soft); }
.qa-tile .lbl{ font-size:var(--fs-xs); font-weight:700; }

.timeline-wrap{ overflow-x:auto; }
.form-panel{ margin-top:12px; padding:13px; border-radius:var(--r-2); background:var(--surface-2); border:1px solid var(--border); display:flex; flex-direction:column; gap:9px; }
.form-row{ display:flex; gap:8px; flex-wrap:wrap; }
.form-row label{ font-size:var(--fs-xs); font-weight:700; color:var(--ink-muted); display:block; margin-bottom:4px; }
.seg{ display:flex; gap:6px; flex-wrap:wrap; }
.seg button{ flex:1; min-width:64px; padding:8px 6px; border:1px solid var(--border); background:var(--surface); border-radius:var(--r-1); font-size:var(--fs-xs); font-weight:700; color:var(--ink-muted); cursor:pointer;  min-height:44px;}
.seg button.on{ background:var(--accent-soft); border-color:var(--brand-text); color:var(--accent-ink); }
input[type=checkbox]{ width:20px; height:20px; accent-color:var(--brand-text); }
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--r-1); background:var(--surface); color:var(--ink); font-size:var(--fs-md); }
textarea{ min-height:56px; resize:vertical; }
input.remembered-fill,textarea.remembered-fill{ /* dado real guardado, não é exemplo — mantém aspeto normal, só limpa ao tocar */ }
.btn{ padding:10px 18px; border-radius:var(--r-3); border:none; background:var(--brand); color:var(--brand-ink); min-height:44px; font-weight:700; font-size:var(--fs-sm); cursor:pointer;  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); font-family:inherit; line-height:1.2; transition:transform .06s ease, filter .12s ease;}
.btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--ink-muted); }
.btn.crit, .btn.danger{ background:var(--crit); color:var(--on-crit); }
.btn.secondary{ background:var(--surface-2); color:var(--ink); border:1.5px solid var(--border); }
.btn.sensitive{ background:var(--med-soft); color:var(--med); border:1.5px solid var(--med); }
.btn:active:not(:disabled), .dose-btn:active:not(:disabled), .qa-tile:active{ transform:translateY(1px) scale(.99); filter:brightness(.96); }
.btn svg, .dose-btn svg{ width:16px; height:16px; flex:none; }
.dose-btn{ display:inline-flex; align-items:center; gap:6px; }
.dose-btn.give{ background:var(--med-soft); color:var(--med); border:1.5px solid var(--med); }
.icon-btn svg{ width:18px; height:18px; }
.log-del svg{ width:18px; height:18px; }
.g-del{ display:flex; align-items:center; justify-content:center; padding:0; } .g-del svg{ width:14px; height:14px; }
.status-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.status-dot.good{ background:var(--good); } .status-dot.warn{ background:var(--warn); } .status-dot.crit{ background:var(--crit); }
.status-dot.neutral{ background:transparent; border:2px solid var(--ink-faint); }
.inline-ic{ display:inline-flex; vertical-align:middle; color:var(--ink-muted); } .inline-ic svg{ width:14px; height:14px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.btn.wide{ width:100%; }
.btn-row{ display:flex; gap:8px; }

.log-item{ display:flex; align-items:center; gap:10px; padding:9px 3px; border-top:1px solid var(--border); }
.log-item:first-child{ border-top:none; }
.log-item .ic{ width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--brand-text); flex:none; }
.log-item .ic.feed{ background:var(--feed-soft); color:var(--feed); }
.log-item .ic.diaper{ background:var(--diaper-soft); color:var(--diaper); }
.log-item .ic.sleepc{ background:var(--sleepc-soft); color:var(--sleepc); }
.log-item .body{ flex:1; min-width:0; }
.log-item .title{ font-size:var(--fs-md); font-weight:700; }
.log-item .meta{ font-size:var(--fs-xs); color:var(--ink-muted); }
.log-item .time{ font-family:'IBM Plex Mono'; font-size:var(--fs-xs); color:var(--ink-faint); flex:none; }
.log-del{ background:none; border:none; color:var(--ink-muted); cursor:pointer; font-size:var(--fs-md); flex:none; padding:4px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-2); }
.log-del:hover{ color:var(--crit); }
.empty{ color:var(--ink-faint); font-size:var(--fs-sm); font-style:italic; padding:8px 3px; }
.example-hint{ font-size:var(--fs-xs); color:var(--ink-faint); border:1px dashed var(--border); border-radius:var(--r-2); padding:7px 10px; margin-top:6px; font-style:italic; }
.example-hint .ex-tag{ font-style:normal; font-size:var(--fs-xs); font-weight:800; text-transform:uppercase; letter-spacing:.05em; background:var(--surface-2); color:var(--ink-muted); border-radius:var(--r-1); padding:2px 6px; margin-right:6px; }

.alert{ display:flex; gap:8px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-3); font-size:var(--fs-sm); font-weight:600; margin-bottom:10px; }
.alert svg{ flex:none; }
/* Hierarquia de estados (F2), do mais leve ao mais forte:
   info   = informação neutra/contexto (backup, lembretes, factos)  · fundo suave, sem contorno
   good   = estado normal / concluído                                 · fundo suave, sem contorno
   warn   = atenção — algo a observar                                 · âmbar suave, contorno fino
   action = ação necessária — o utilizador deve fazer algo            · âmbar com contorno forte
   crit   = urgente — só quando a lógica o justifica                  · vermelho com contorno forte */
.alert.info{ background:var(--info-soft); color:var(--ink); border:1px solid transparent; } .alert.info svg{ color:var(--info); }
.alert.good{ background:var(--good-soft); color:var(--ink); border:1px solid transparent; } .alert.good svg{ color:var(--good); }
.alert.warn{ background:var(--warn-soft); color:var(--ink); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent); } .alert.warn svg{ color:var(--warn); }
.alert.action{ background:var(--warn-soft); color:var(--ink); border:2px solid var(--warn); } .alert.action svg{ color:var(--warn); }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  // Datas de calendário SEMPRE pela hora local do dispositivo (qualquer fuso horário).
  // Antes usavam toISOString() (UTC): entre 00:00 e ~02:00 no Luxemburgo "hoje" ainda era o dia anterior.
  // (A limpeza dos dados de exemplo antigos, em purgeDemoData, mantém a sua própria lógica UTC de propósito:
  //  esses dados foram gerados em UTC e só assim são reconhecidos.)
  function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayISO(){ return ymdLocal(new Date()); }
  function daysAgoISO(n){ const d=new Date(); d.setDate(d.getDate()-n); return ymdLocal(d); }
  function monthsAgoISO(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return ymdLocal(d); }

  function hydrateChild(partial){
    const b = blankChildFields();

      if(c[k]==null) c[k]=b[k];
    });
    if(c.documentoId==null) c.documentoId='';
    if(c.sistemaSaude==null) c.sistemaSaude='';
    if(c.moradaAtual==null) c.moradaAtual='';
    if(c.foto==null) c.foto='';
    if(c.notas==null) c.notas='';
    if(c.tipoSanguineo==null) c.tipoSanguineo='';
    if(c.fatorRh==null) c.fatorRh='';

    if(c.alimentacao.introducao==null) c.alimentacao.introducao=[];
    if(c.alimentacao.dataInicioSolidos==null) c.alimentacao.dataInicioSolidos='';
    if(c.pediatra.morada==null) c.pediatra.morada='';
    c.medicacoes = (c.medicacoes||[]).map(m=>({horario:'',notificacoes:true,tipo:'receitado',...m}));
    c.medicacoes.forEach(m=>{ if(!m.id) m.id=uid(); });   // cada medicamento tem um id estável
    c.mamadas=c.mamadas||[]; c.fraldas=c.fraldas||[]; c.sono=c.sono||[];
    c.evolucao = c.evolucao || {peso:[],altura:[],pc:[]};
    c.desenvolvimento = c.desenvolvimento || {done:{}};
    c.vacinacao = c.vacinacao || {doses:{}};
    if(!c.vacinacao.doses) c.vacinacao.doses={};
    VAX.forEach(v=>v.doses.forEach((label,i)=>{ const k=v.id+'-'+i; if(!c.vacinacao.doses[k]) c.vacinacao.doses[k]={done:null,pais:'',reacao:'',proximaData:''}; }));
    c.doses=c.doses||[];

    // Não apaga nada; o nome gravado na dose mantém-se (é o que foi dado nesse momento).
    c.doses.forEach(d=>{ if(d && !d.medId && d.nome){ const m=c.medicacoes.filter(x=>x.nome===d.nome); if(m.length===1) d.medId=m[0].id; } });

  function migrateToMultiChild(state){
    if(state && state.criancas && state.criancas.length) return state;
    if(!state) return null;
    const child = Object.assign(
      { id: uid(), seed: state.seed!==undefined?state.seed:true },
      state.crianca || {},
      { mamadas:state.mamadas||[], fraldas:state.fraldas||[], sono:state.sono||[],
        evolucao:state.evolucao||{peso:[],altura:[],pc:[]}, desenvolvimento:state.desenvolvimento||{done:{}},
        vacinacao:state.vacinacao||{doses:{}}, doses:state.doses||[], running:state.running||{sleepStart:null} }
    );
    return { criancas:[child], activeChildId: child.id, settings: state.settings || {theme:'system',accentIndex:0,lang:'pt',sound:true} };
  }
  function hydrate(state){
    state.criancas = (state.criancas||[]).map(hydrateChild);
    if(!state.criancas.length) state.criancas=[hydrateChild({})];
    if(!state.activeChildId || !state.criancas.find(c=>c.id===state.activeChildId)) state.activeChildId = state.criancas[0].id;
    state.settings = Object.assign({theme:'system', accentIndex:0, lang:'pt', sound:true}, state.settings||{});
    return state;
  }
  function setActiveChild(id){
    let child = S.criancas.find(c=>c.id===id) || S.criancas[0];
    S.activeChildId = child.id;
    S.crianca = child;
    S.mamadas = child.mamadas; S.fraldas = child.fraldas; S.sono = child.sono;
    S.evolucao = child.evolucao; S.desenvolvimento = child.desenvolvimento; S.vacinacao = child.vacinacao;
    S.doses = child.doses; S.running = child.running;
  }
  function loadState(raw){
    if(!raw) return defaultState();
    return hydrate(migrateToMultiChild(raw));
  }

  function defaultState(){
    // Instalação/perfil novo: começa SEM registos. Exemplos existem só como texto de ajuda
    // (placeholders e etiquetas "Exemplo"), nunca dentro do estado — por isso nunca entram em cálculos.
    const child = hydrateChild({ id:uid(), seed:false });

  }

  /* ============ dados de exemplo de versões antigas → removidos, nunca contam como reais ============
     Versões anteriores punham registos fictícios nos MESMOS arrays dos dados reais (e "Apagar tudo"
     recriava-os marcados como reais). Cada registo fictício é reconhecido pela assinatura exata com que
     foi gerado (id criado no mesmo instante que "now", hora = now − k horas, valores fixos), por isso
     um registo real não é apanhado por engano. */
  const H_MS = 3600000;
  const DEMO_PHONE = "+000 000 000 000", DEMO_EMAIL = "exemplo@clinica.example";
  const DEMO_TEXT = {
    names:["Bebé Exemplo","Bébé Exemple","Example Baby","Mãe Exemplo","Mère Exemple","Example Mother","Pai Exemplo","Père Exemple","Example Father","Dra. Exemplo","Dr Exemple","Dr. Example"],
    alergias:["Exemplo: Penicilina","Exemple : Pénicilline","Example: Penicillin"],
    intol:["Exemplo: Lactose","Exemple : Lactose","Example: Lactose"],
    formulas:["Fórmula sem lactose (exemplo)","Préparation sans lactose (exemple)","Lactose-free formula (example)"],
  };
  const DEMO_LOGS = {
    mamadas:[ {k:2,m:{tipo:'biberao',mlBebido:170}}, {k:6,m:{tipo:'peito-esq',duracaoMin:15}}, {k:10,m:{tipo:'peito-dir',duracaoMin:12}},
              {k:27,m:{tipo:'biberao',mlBebido:160}}, {k:32,m:{tipo:'peito-esq',duracaoMin:14}}, {k:50,m:{tipo:'biberao',mlBebido:180}} ],
    fraldas:[ {k:1,m:{tipo:'xixi',quantidade:'normal'}}, {k:4,m:{tipo:'coco',quantidade:'normal'}}, {k:7,m:{tipo:'xixi',quantidade:'normal'}},
              {k:11,m:{tipo:'xixi',quantidade:'pouco'}}, {k:26,m:{tipo:'coco',quantidade:'normal'}}, {k:29,m:{tipo:'xixi',quantidade:'normal'}} ],
    sono:[ {k:11,m:{periodo:'noite',duracaoMin:480}}, {k:16,m:{periodo:'sesta',duracaoMin:90}}, {k:35,m:{periodo:'noite',duracaoMin:470}}, {k:41,m:{periodo:'sesta',duracaoMin:90}} ],
  };
  const DEMO_GROWTH = { peso:[[4,3.4],[3,4.6],[2,5.6],[1,6.2],[0,6.6]], altura:[[4,50],[3,53.5],[2,55.5],[1,57],[0,58.5]], pc:[[4,35],[3,36.8],[2,38],[1,39],[0,39.8]] };
  const DEMO_MILESTONES = { "0-1 mês|Sorri reflexo":115,"0-1 mês|Acompanha olhar":110,"0-1 mês|Reage a barulhos":108,"0-1 mês|Reflexo de sucção":120,
    "1-2 meses|Sorriso social":90,"1-2 meses|Emite sons (cooing)":85,"1-2 meses|Levanta cabeça ligeiramente":88,"1-2 meses|Puxa objetos":80,
    "2-3 meses|Levanta cabeça/peito com braços":60,"2-3 meses|Abre/fecha mãos":58,"2-3 meses|Vocaliza com sílabas":55,"2-3 meses|Segue movimento com olhos":57,
    "3-4 meses|Mão na boca":12,"3-4 meses|Sorri para caras":3,"3-4 meses|Emite sílabas":9,"3-4 meses|Vira para sons":7 };
  const DEMO_VAX_DONE = ["bcg-0","hepb-0","hepb-1","penta-0","penta-1","penta-2","rota-0","rota-1","rota-2","pneumo-0","pneumo-1","pneumo-2"];
  const DEMO_VAX_NEXT = ["hepb-2","penta-3","pneumo-3","menc-0"];
  const demoCleanupLog = [];
  function idTime(id){ const t=parseInt(String(id||'').slice(0,8),36); return (t>1.5e12 && t<Date.now()+864e5) ? t : null; }
  function demoLogBase(rec, sigs, tsField){
    const it=idTime(rec && rec.id), ts=rec && rec[tsField];
    if(it==null || typeof ts!=='number' || rec.obs) return null;
    for(const s of sigs){
      if(Object.keys(s.m).some(k=>rec[k]!==s.m[k])) continue;
      const d = it - (ts + s.k*H_MS);
      if(d>=0 && d<=3000) return ts + s.k*H_MS;
    }
    return null;
  }
  function purgeDemoData(c){
    const found=[]; const note=k=>{ if(!found.includes(k)) found.push(k); };
    const bases=[];
    // 1) registos diários fictícios (biberões, mamadas, fraldas, sono)
    [['mamadas','ts'],['fraldas','ts'],['sono','inicio']].forEach(([arr,f])=>{
      if(!Array.isArray(c[arr])) return;
      const keep=c[arr].filter(r=>{ const b=demoLogBase(r, DEMO_LOGS[arr], f); if(b!=null){ bases.push(b); return false; } return true; });
      if(keep.length!==c[arr].length){ c[arr].splice(0, c[arr].length, ...keep); note(arr); }
    });
    // 2) alergias/intolerâncias "Exemplo: …"
    [['alergiasMed','alergias'],['intolerancias','intol']].forEach(([arr,k])=>{
      if(!Array.isArray(c[arr])) return;
      const keep=c[arr].filter(a=>{ if(DEMO_TEXT[k].includes(a.nome)){ const t=idTime(a.id); if(t) bases.push(t); return false; } return true; });
      if(keep.length!==c[arr].length){ c[arr]=keep; note(arr); }
    });
    // 3) medicações pré-definidas criadas em bloco pelo perfil de exemplo
    if(Array.isArray(c.medicacoes)){
      const isPreset = m => MED_PRESETS.some(p=>p.nome===m.nome && p.dose===m.dose && p.intervaloHoras===m.intervaloHoras && p.maxVezesDia===m.maxVezesDia);
      const pTimes = c.medicacoes.filter(isPreset).map(m=>idTime(m.id)).filter(t=>t!=null);
      const ref = bases.length ? Math.min(...bases) : null;
      const keep = c.medicacoes.filter(m=>{
        if(!isPreset(m)) return true;
        const t=idTime(m.id); if(t==null) return true;
        const demo = (ref!=null && Math.abs(t-ref)<5000) || pTimes.filter(x=>Math.abs(x-t)<2000).length>=2;
        if(demo) bases.push(t);
        return !demo;
      });
      if(keep.length!==c.medicacoes.length){ c.medicacoes=keep; note('medicacoes'); }
    }
    // 4) momento em que o exemplo foi criado → datas exatas dos pesos, marcos e vacinas fictícios
    let baseMs = bases.length ? Math.min(...bases) : null;
    const doses = (c.vacinacao && c.vacinacao.doses) || {};
    if(baseMs==null){
      const byDate={};
      DEMO_VAX_DONE.forEach(k=>{ const r=doses[k]; if(r && r.done && r.pais==='Luxemburgo' && r.reacao==='Nenhuma') byDate[r.done]=(byDate[r.done]||0)+1; });
      const hit=Object.keys(byDate).find(d=>byDate[d]>=8);
      if(hit) baseMs=new Date(hit+'T12:00:00Z').getTime();
    }
    if(baseMs!=null){
      const isoShift = fn => { const d=new Date(baseMs); fn(d); return d.toISOString().slice(0,10); };
      const dayISO = n => isoShift(d=>d.setDate(d.getDate()-n));
      const monISO = n => isoShift(d=>d.setMonth(d.getMonth()-n));
      if(c.evolucao) Object.keys(DEMO_GROWTH).forEach(k=>{
        const arr=c.evolucao[k]; if(!Array.isArray(arr)) return;
        const keep=arr.filter(r=>!DEMO_GROWTH[k].some(([n,v])=>r.date===monISO(n) && +r.valor===v));
        if(keep.length!==arr.length){ arr.splice(0, arr.length, ...keep); note('evolucao'); }
      });
      const done = c.desenvolvimento && c.desenvolvimento.done;
      if(done) Object.keys(DEMO_MILESTONES).forEach(k=>{ if(done[k] && done[k]===dayISO(DEMO_MILESTONES[k])){ delete done[k]; note('marcos'); } });
      DEMO_VAX_DONE.forEach(k=>{ const r=doses[k]; if(r && r.done===dayISO(0) && r.pais==='Luxemburgo' && r.reacao==='Nenhuma'){ doses[k]={done:null,pais:'',reacao:'',proximaData:''}; note('vacinas'); } });
      DEMO_VAX_NEXT.forEach(k=>{ const r=doses[k]; if(r && !r.done && r.proximaData===monISO(-2)){ r.proximaData=''; note('vacinas'); } });
      if(c.dataNascimento && c.dataNascimento===monISO(4)) note('confirmarNascimento');
    }
    // 5) textos de exemplo inconfundíveis nos contactos/perfil
    let profileDemo=false;
    const clr=(obj,key,pred)=>{ if(obj && obj[key] && pred(obj[key])){ obj[key]=''; profileDemo=true; } };
    const isName=v=>DEMO_TEXT.names.includes(v);
    clr(c,'nome',isName);
    clr(c.pediatra,'nome',isName); clr(c.pediatra,'telefone',v=>v===DEMO_PHONE); clr(c.pediatra,'email',v=>v===DEMO_EMAIL);
    ['mae','pai'].forEach(k=>{ clr(c[k],'nome',isName); clr(c[k],'telefone',v=>v===DEMO_PHONE); });
    clr(c.alimentacao,'formula',v=>DEMO_TEXT.formulas.includes(v));
    if(profileDemo) note('contactos');
    // 6) restantes valores do perfil de exemplo — só quando há prova de que o perfil veio do exemplo
    if(profileDemo || baseMs!=null || c.seed===true){
      const dash=v=>v==='—';
      clr(c,'localNascimento',dash); clr(c,'nacionalidade',dash); clr(c.pediatra,'local',dash);
      ['mae','pai'].forEach(k=>{ clr(c[k],'nacionalidade',dash); clr(c[k],'naturalidade',dash); });
      const n=c.nascimento;
      if(n && n.peso==='3.4' && n.altura==='50' && n.pc==='35'){ n.peso=''; n.altura=''; n.pc=''; note('nascimento'); }
      if(c.alimentacao && c.alimentacao.quantidadeRefeicao==='180') c.alimentacao.quantidadeRefeicao='';
      if(c.tipoSanguineo==='A+' && c.fatorRh==='Positivo'){ c.tipoSanguineo=''; c.fatorRh=''; note('tipoSanguineo'); }
    }
    c.seed=false;
    delete c.seedTouched;
    return found;
  }

  let S;
  try{
    const raw = localStorage.getItem(KEY);
    S = raw ? loadState(JSON.parse(raw)) : defaultState();
  }catch(e){ S = defaultState(); }
  setActiveChild(S.activeChildId);
  let storageOk = true, storageErrKind = null; // 'quota' | 'other'
  function saveLocal(){
    try{
      localStorage.setItem(KEY, JSON.stringify({criancas:S.criancas, activeChildId:S.activeChildId, settings:S.settings}));
      const wasBad = !storageOk; storageOk = true; storageErrKind = null;
      if(wasBad) renderStorageBanner();
      return true;
    }catch(e){
      storageOk = false;
      storageErrKind = (e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014)) ? 'quota' : 'other';
      renderStorageBanner();
      return false;
    }
  }
  // Se ao abrir foram encontrados dados de exemplo antigos misturados com os reais, grava já a versão limpa
  // e deixa um aviso (uma vez) a explicar o que foi removido.
  if(demoCleanupLog.length){
    S.settings.demoCleanupNotice = Array.from(new Set(demoCleanupLog.concat(S.settings.demoCleanupNotice||[])));

  }
  function save(){ const ok=saveLocal(); scheduleDbPush(); return ok; }
  function renderStorageBanner(){
    const el = document.getElementById('storageBanner'); if(!el) return;
    if(storageOk){ el.innerHTML=''; return; }
    const msg = storageErrKind==='quota'
      ? tr('Não foi possível guardar — o espaço de armazenamento deste dispositivo está cheio (normalmente por causa de fotos/documentos). Remove algumas fotos em Perfil ou exporta os teus dados agora em Definições, para não perderes nada.')
      : tr('Não foi possível guardar neste dispositivo/navegador. Tenta noutro browser, ou exporta os teus dados agora em Definições para não perderes nada.');

  /* ============ sincronização entre pais (db) ============ */
  let dbApi=null, dbSyncState='local'; // local | connecting | synced | readonly | error
  let pushTimer=null;
  const WINDOW_MS = 90*86400000;
  function stripHeavy(c){ const {foto,fotos,documentos, ...rest}=c; return rest; }
  function windowByTs(arr){ const cutoff=Date.now()-WINDOW_MS; return (arr||[]).filter(x=>(x.ts||0)>=cutoff); }
  function windowSono(arr){ const cutoff=Date.now()-WINDOW_MS; return (arr||[]).filter(x=>(x.inicio||0)>=cutoff); }
  function payloadForSync(){
    return { criancas: S.criancas.map(c=>({ ...stripHeavy(c),
      mamadas:windowByTs(c.mamadas), fraldas:windowByTs(c.fraldas), doses:windowByTs(c.doses), sono:windowSono(c.sono) })) };
  }
  function mergeById(localArr, remoteArr){ const map={}; (localArr||[]).forEach(x=>map[x.id]=x); (remoteArr||[]).forEach(x=>map[x.id]=x); return Object.values(map); }
  function mergeRemote(remote){
    if(!remote || !remote.criancas) return;
    const localById={}; S.criancas.forEach(c=>localById[c.id]=c);
    const merged = remote.criancas.map(rc=>{
      const local = localById[rc.id];
      const photo = local ? {foto:local.foto, fotos:local.fotos, documentos:local.documentos} : {};
      const child = hydrateChild(Object.assign({}, rc, photo));
      if(local){
        child.mamadas = mergeById(local.mamadas, rc.mamadas);
        child.fraldas = mergeById(local.fraldas, rc.fraldas);
        child.sono = mergeById(local.sono, rc.sono);
        child.doses = mergeById(local.doses, rc.doses);
      }
      return child;
    });
    const remoteIds = new Set(remote.criancas.map(x=>x.id));
    S.criancas.forEach(c=>{ if(!remoteIds.has(c.id)) merged.push(c); });
    S.criancas = merged;
    if(!S.criancas.find(c=>c.id===S.activeChildId)) S.activeChildId = S.criancas[0].id;
    setActiveChild(S.activeChildId);
    saveLocal();
    // Se a cópia partilhada ainda trazia dados de exemplo antigos, já foram retirados acima — envia a versão limpa.
    if(demoCleanupLog.length){ demoCleanupLog.length = 0; scheduleDbPush(); }
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){
      renderSyncBadge();
      return; // não interromper quem está a escrever — o ecrã atualiza-se sozinho a seguir
    }
    render();
  }
  function scheduleDbPush(){ if(!dbApi) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushToDb, 900); }
  async function pushToDb(){
    if(!dbApi) return;
    try{ await dbApi.doc("familia/dados").set(payloadForSync()); if(dbSyncState!=='readonly') dbSyncState='synced'; }
    catch(e){ dbSyncState = (e && e.code==='invalid_argument') ? 'readonly' : 'error'; }
    renderSyncBadge();
  }
  async function initSync(){
    try{ dbApi = window.claude ? await claude.use("db") : null; }catch(e){ dbApi=null; }
    if(!dbApi){ dbSyncState='local'; renderSyncBadge(); return; }
    dbSyncState='connecting'; renderSyncBadge();
    const ref = dbApi.doc("familia/dados");
    ref.onSnapshot(snap=>{
      if(snap.exists) mergeRemote(snap.data());
      else pushToDb();
      if(dbSyncState!=='readonly') dbSyncState='synced';
      renderSyncBadge();
    }, err=>{
      dbSyncState = (err && err.code==='invalid_argument') ? 'readonly' : 'error';
      renderSyncBadge();
    });
  }
  function syncStatusLabel(){
    const lang=(S.settings&&S.settings.lang)||'pt';
    const M = {
      pt:{ local:'Só neste dispositivo (sem sincronização ligada)', connecting:'A ligar à sincronização…',
        synced:'Sincronizado com quem tem acesso de edição', readonly:'Modo leitura — as tuas alterações não ficam guardadas para os outros',
        error:'Erro de sincronização — a app continua a funcionar só neste dispositivo' },
      fr:{ local:'Seulement sur cet appareil (synchronisation désactivée)', connecting:'Connexion à la synchronisation…',
        synced:'Synchronisé avec les personnes ayant un accès en modification', readonly:'Mode lecture seule — tes modifications ne sont pas partagées',
        error:'Erreur de synchronisation — l\'appli continue de fonctionner seulement sur cet appareil' },
      en:{ local:'This device only (sync not connected)', connecting:'Connecting to sync…',
        synced:'Synced with anyone who has edit access', readonly:'Read-only mode — your changes aren\'t saved for others',
        error:'Sync error — the app keeps working on this device only' },
    };
    return (M[lang]||M.pt)[dbSyncState] || '';
  }
  function renderSyncBadge(){
    const el = document.getElementById('syncBanner'); if(!el) return;
    if(dbSyncState==='local' || dbSyncState==='synced'){ el.innerHTML=''; return; }
    const kind = dbSyncState==='readonly' ? 'warn' : dbSyncState==='error' ? 'action' : 'info';

  /* ---- contraste (WCAG 2.x) para o acento escolhido ----
     --brand      fundo dos botões/seleções (o acento; ligeiramente ajustado só se nenhum texto atingir 4,5:1)
     --brand-ink  texto sobre --brand (branco ou tinta escura, o que tiver mais contraste)
     --brand-text o acento usado como texto/ícone sobre as superfícies do tema atual (≥ 4,5:1) */
  const DARK_INK = '#241d19';
  function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255); }
  function relLum(h){ const f=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); const [r,g,b]=hexRgb(h).map(f); return 0.2126*r+0.7152*g+0.0722*b; }
  function contrast(a,b){ const x=relLum(a), y=relLum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function shiftLight(h, dl){
    let [r,g,b]=hexRgb(h); const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let hh=0, ss=0, l=(mx+mn)/2;
    if(mx!==mn){ const d=mx-mn; ss=l>0.5?d/(2-mx-mn):d/(mx+mn); hh = mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); hh/=6; }
    l=Math.max(0,Math.min(1,l+dl));
    const q=l<0.5?l*(1+ss):l+ss-l*ss, p=2*l-q, hue=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t : t<1/2?q : t<2/3?p+(q-p)*(2/3-t)*6 : p; };
    const out = ss===0 ? [l,l,l] : [hue(hh+1/3),hue(hh),hue(hh-1/3)];
    return '#'+out.map(c=>Math.round(c*255).toString(16).padStart(2,'0')).join('');
  }
  function adjustUntil(h, ok, dir){ for(let i=0;i<=80;i++){ const c=shiftLight(h, dir*i*0.005); if(ok(c)) return c; } return h; }
  function brandTokens(brand, dark, accent){
    const inks=['#ffffff', DARK_INK], best=c=>inks.reduce((a,b)=>contrast(c,b)>contrast(c,a)?b:a);
    let fill=brand;
    if(contrast(fill,best(fill))<4.5){
      const darker=adjustUntil(brand,c=>contrast(c,'#ffffff')>=4.5,-1), lighter=adjustUntil(brand,c=>contrast(c,DARK_INK)>=4.5,+1);
      fill = Math.abs(relLum(darker)-relLum(brand)) <= Math.abs(relLum(lighter)-relLum(brand)) ? darker : lighter;
    }
    const surfaces = dark ? ['#3d3935','#46413c','#2a2622'] : ['#ffffff','#fffaf3','#f5f0e8'];
    const text = adjustUntil(brand, c=>surfaces.every(sf=>contrast(c,sf)>=4.5), dark?+1:-1);
    const dir = dark ? +1 : -1;
    // Fundo suave (seleções, chips, navegação ativa): no claro é o pastel do acento; no escuro é o acento
    // misturado com a superfície escura — nunca o pastel claro (era a causa do texto claro sobre pastel, ~1,1:1).
    const soft = dark ? mixHex('#3d3935', brand, 0.30) : accent;
    const softInk = adjustUntil(brand, c=>contrast(c,soft)>=4.5 && (!dark || contrast(c,'#3d3935')>=4.5), dir);
    // Header: um pouco mais cheio que o pastel (claro) ou acento sobre o fundo escuro; texto ≥ 7:1, secundário ≥ 4,5:1.
    const header = dark ? mixHex('#2a2622', brand, 0.26) : mixHex(accent, brand, 0.18);
    const headerInk = adjustUntil(brand, c=>contrast(c,header)>=7, dir);
    const headerInkSoft = adjustUntil(brand, c=>contrast(c,header)>=4.5, dir);
    return { fill, ink:best(fill), text, soft, softInk, header, headerInk, headerInkSoft };
  }

  function ageInfo(dob, atISO){
    const d0=new Date(dob+"T00:00:00"), d1=atISO ? new Date(atISO+"T00:00:00") : new Date();
    let months=(d1.getFullYear()-d0.getFullYear())*12+(d1.getMonth()-d0.getMonth());
    let days=d1.getDate()-d0.getDate();
    if(days<0){ months--; const pm=new Date(d1.getFullYear(),d1.getMonth(),0); days+=pm.getDate(); }
    const lang=(S.settings&&S.settings.lang)||'pt';
    let label;
    if(lang==='fr'){
      label = months<1 ? `${days} jour${days===1?'':'s'}` : `${months} mois`+(days>0?` et ${days} jour${days===1?'':'s'}`:'');
    } else if(lang==='en'){
      label = months<1 ? `${days} day${days===1?'':'s'}` : `${months} month${months===1?'':'s'}`+(days>0?` and ${days} day${days===1?'':'s'}`:'');
    } else {
      label = months<1 ? days+" dia"+(days===1?"":"s") : months+(months===1?" mês":" meses")+(days>0?" e "+days+" dia"+(days===1?"":"s"):"");
    }
    return {months, days, label};
  }
  async function triggerDownload(filename, blob){
    if(window.claude){
      try{
        const downloads = await claude.use("downloads");
        if(downloads){ await downloads.save({ filename, data:blob }); return 'saved'; }
      }catch(e){ if(e && e.code==='declined') return 'declined'; }
    }
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);

  function resizeImageFile(file, maxDim, quality, cb){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ cb(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ cb(e.target.result); }
      };
      img.onerror = ()=>cb(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = ()=>cb(null);
    reader.readAsDataURL(file);
  }

  function fmtWhen(ts){
    const d=new Date(ts), now=new Date();

    const y=new Date(now); y.setDate(now.getDate()-1);
    const isYest=d.toDateString()===y.toDateString();
    const hm=fmtTimeOnly(ts);
    const lang=(S.settings&&S.settings.lang)||'pt';
    if(sameDay) return (lang==='fr'?"aujourd'hui, ":lang==='en'?"today, ":"hoje, ")+hm;

  function agoStr(ts){
    const lang=(S.settings&&S.settings.lang)||'pt';
    const mins=Math.max(0,Math.round((Date.now()-ts)/60000));
    if(mins<1) return lang==='fr'?"à l'instant":lang==='en'?"just now":"agora";
    if(mins<60) return (lang==='fr'?"il y a ":lang==='en'?"":"há ")+mins+(lang==='en'?"min ago":"min");
    const h=Math.floor(mins/60), m=mins%60;
    if(h<24){
      if(lang==='fr') return `il y a ${h}h`+(m?(' '+m+'min'):'');
      if(lang==='en') return `${h}h`+(m?(' '+m+'min'):'')+' ago';
      return `há ${h}h`+(m?(' '+m+'min'):'');
    }
    const days=Math.floor(h/24);
    if(lang==='fr') return `il y a ${days} jour${days===1?'':'s'}`;
    if(lang==='en') return `${days} day${days===1?'':'s'} ago`;

        const h=card.querySelector('h1,h2,h3,p'); if(h){ if(!h.id) h.id='dlgTitle'; card.setAttribute('aria-labelledby', h.id); }
      }
      if(!card.hasAttribute('tabindex')) card.setAttribute('tabindex','-1');
      if(!ov.contains(document.activeElement) || document.activeElement===document.body){
        const f = (prevId && card.querySelector('#'+CSS.escape(prevId))) || card.querySelector('[data-autofocus],#mCancel') || card.querySelector('button:not([disabled])') || card;
        try{ f.focus({preventScroll:true}); }catch(e){}

    if(!overlayHist){ try{ history.pushState({emilyOverlay:true}, ''); overlayHist=true; }catch(e){} }
  }
  function closeOverlay(){
    const ov=overlayEl(); if(!ov) return;
    if(typeof recognition!=='undefined' && recognition && listening){ try{ recognition.stop(); }catch(e){} }
    const had=overlayOpen(); ov.innerHTML='';
    const op=overlayOpener; overlayOpener=null;
    if(had && op && document.contains(op)){ try{ op.focus({preventScroll:true}); }catch(e){} }
    // fechado pela UI: retira a entrada de histórico do diálogo (a não ser que outro diálogo abra logo a seguir)
    if(overlayHist && !popping){ setTimeout(()=>{ if(!overlayOpen() && overlayHist){ overlayHist=false; ignorePop=true; history.back(); } }, 0); }
  }
  // Toque fora: só em diálogos sem risco (não confirmações, não formulários com campos de texto).
  function overlayBackdropAllowed(){
    const card=overlayCard(); if(!card) return true;
    if(card.hasAttribute('data-confirm') || card.getAttribute('role')==='alertdialog') return false;
    return !card.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]),textarea,select');
  }
  // "Dispensar" = o mesmo que o botão Cancelar/Fechar do diálogo (mantém a lógica própria de cada um).
  function dismissOverlay(){
    const card=overlayCard(); if(!card){ closeOverlay(); return; }
    const btn = card.querySelector('[data-dismiss],#mCancel,#mClose,#closeSettings,#vCancel,#mCardClose,[id$="Cancel"],[id$="Close"],[id$="cancel"],[id$="close"]');
    if(btn) btn.click(); else closeOverlay();
    if(overlayOpen() && card===overlayCard() && !btn) closeOverlay();
  }
  function backdropDismiss(){ if(overlayBackdropAllowed()) dismissOverlay(); }
  document.getElementById('voiceOverlay').addEventListener('click', e=>{ if(e.target.classList && e.target.classList.contains('voice-panel') && overlayOpen()) backdropDismiss(); });
  document.addEventListener('keydown', e=>{
    if(!overlayOpen()) return;
    if(e.key==='Escape'){ e.preventDefault(); dismissOverlay(); return; }
    if(e.key==='Tab'){
      const card=overlayCard(); if(!card) return;
      const items=[...card.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
      if(!items.length){ e.preventDefault(); card.focus(); return; }
      const first=items[0], last=items[items.length-1];
      if(!card.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });

  // Tema e idioma redesenham a tela: guarda o que estava escrito nos formulários abertos e repõe-no depois
  // (seleções .seg, valores, caixas de verificação e marcação de erro). Não grava nada por si.
  function withFormState(fn){
    const main=document.getElementById('main');
    const fields = el => [...el.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='file' && x.type!=='hidden');
    const before = main ? fields(main).map((x,i)=>({id:x.id, i, type:x.type, v:x.value, c:x.checked})) : [];
    const segs = main ? [...main.querySelectorAll('.seg[id]')].map(sg=>{ const on=sg.querySelector('button.on'); return {id:sg.id, v:on?on.dataset.v:null}; }) : [];
    const errs = main ? [...main.querySelectorAll('.input-err')].map(x=>x.id).filter(Boolean) : [];
    fn();
    const m2=document.getElementById('main'); if(!m2 || !before.length) return;
    segs.forEach(sg=>{ if(sg.v==null) return; const b=m2.querySelector(`#${CSS.escape(sg.id)} button[data-v="${sg.v}"]`); if(b && !b.classList.contains('on')) b.click(); });
    const after=fields(m2);
    before.forEach(f=>{
      const el = f.id ? m2.querySelector('#'+CSS.escape(f.id)) : (after.length===before.length ? after[f.i] : null);
      if(!el || el.type!==f.type) return;
      if(f.type==='checkbox'||f.type==='radio') el.checked=f.c; else if(el.value!==f.v) el.value=f.v;
    });
    errs.forEach(id=>{ const el=m2.querySelector('#'+CSS.escape(id)); if(el) el.classList.add('input-err'); });
  }

  /* ============ cartões de marcos (estilo cartão-lembrança, sem custos externos) ============ */
  const MILESTONE_GRADIENTS = [
    ['#f8d7e6','#f7ddc9'], ['#e2dcf0','#d3e3ef'], ['#cfe8de','#f0e2c9'], ['#e8d3e3','#e8c9c0'],
  ];
  function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
  function milestoneCardData(item, doneDateStr){
    const c = S.crianca;
    const dob = new Date(c.dataNascimento+"T00:00:00");
    const at = doneDateStr ? new Date(doneDateStr+"T00:00:00") : new Date();
    const weeks = Math.max(0, Math.round((at-dob)/(7*86400000)));
    const lang=(S.settings&&S.settings.lang)||'pt';
    const weekLbl = lang==='fr' ? `semaine ${weeks}` : lang==='en' ? `week ${weeks}` : `semana ${weeks}`;
    const [g1,g2] = MILESTONE_GRADIENTS[hashStr(item)%MILESTONE_GRADIENTS.length];
    return { nome:c.nome, weekLbl, text:tr(item), g1, g2 };
  }
  function showMilestoneCard(item, doneDateStr){
    const d = milestoneCardData(item, doneDateStr);
    showOverlay(`<div class="voice-panel"><div class="voice-card">
      <div class="milestone-card" id="mCardPreview" style="background:linear-gradient(160deg, ${d.g1}, ${d.g2});">
        <div class="mc-name">${d.nome}</div>

        <div class="mc-brand">Emily Tracker</div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn ghost wide" id="mCardClose" type="button">${tr('Fechar')}</button>
        <button class="btn wide" id="mCardDownload" type="button">${tr('Descarregar imagem')}</button>

    document.getElementById('mCardClose').addEventListener('click', closeOverlay);
    document.getElementById('mCardDownload').addEventListener('click', ()=>downloadMilestoneCard(d));

  function downloadMilestoneCard(d){
    const w=640, h=800;
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,d.g1); grad.addColorStop(1,d.g2);
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    const cardX=48,cardY=140,cardW=w-96,cardH=460,cardR=28;
    ctx.beginPath();
    ctx.moveTo(cardX+cardR,cardY);
    ctx.arcTo(cardX+cardW,cardY,cardX+cardW,cardY+cardH,cardR);
    ctx.arcTo(cardX+cardW,cardY+cardH,cardX,cardY+cardH,cardR);
    ctx.arcTo(cardX,cardY+cardH,cardX,cardY,cardR);
    ctx.arcTo(cardX,cardY,cardX+cardW,cardY,cardR);
    ctx.closePath(); ctx.fill();
    ctx.textAlign='center'; ctx.fillStyle='#3d3935';
    ctx.font='700 30px Georgia, serif'; ctx.fillText(d.nome, w/2, cardY+70);
    ctx.font='600 18px sans-serif'; ctx.fillStyle='#8a6a10';
    roundRectText(ctx, d.weekLbl, w/2, cardY+120);
    ctx.fillStyle='#5a4a42'; ctx.font='400 22px sans-serif';
    wrapText(ctx, d.text, w/2, cardY+200, cardW-80, 30);
    ctx.font='600 16px sans-serif'; ctx.fillStyle='#8a7a6e';
    ctx.fillText('Emily Tracker', w/2, cardY+cardH-30);
    canvas.toBlob(async (blob)=>{
      if(!blob){ showAlert(tr('Não foi possível gerar a imagem.')); return; }
      const result = await triggerDownload(`emily-tracker-marco-${todayISO()}.png`, blob);
      if(result==='error') showAlert(tr('Exportação de ficheiros indisponível nesta vista.'));
    }, 'image/png');
  }
  function roundRectText(ctx, text, cx, cy){
    ctx.save();
    const padX=16, w=ctx.measureText(text).width+padX*2, hgt=32;
    ctx.fillStyle='rgba(0,0,0,0.06)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx-w/2, cy-hgt+8, w, hgt, 16) : ctx.rect(cx-w/2, cy-hgt+8, w, hgt);
    ctx.fill();
    ctx.restore();
    ctx.fillText(text, cx, cy);
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words=text.split(' '); let line=''; let curY=y;
    words.forEach((word,i)=>{
      const test=line+word+' ';
      if(ctx.measureText(test).width>maxWidth && i>0){ ctx.fillText(line, x, curY); line=word+' '; curY+=lineHeight; }
      else line=test;
    });
    ctx.fillText(line, x, curY);
  }

  /* ============ som de confirmação (Web Audio API — sem depender do microfone) ============ */
  let audioCtx = null;
  function playChime(force){
    if(!force && S.settings && S.settings.sound===false) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [880,1175].forEach((freq,i)=>{
        const t0 = now + i*0.09;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type='sine'; osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0+0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0+0.18);
      });
    }catch(e){ /* Web Audio indisponível — nunca bloqueia o registo */ }
  }

  let recognition=null, listening=false;
  function startVoice(){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec) return;
    showOverlay(`<div class="voice-panel"><div class="voice-card">
      <h2>${ICONS.mic} ${tr('A ouvir…')}</h2>
      <p class="muted">${tr('Diz, por exemplo: "mamada biberão 120 mililitros", "fralda xixi", "começou a dormir", "acordou".')}</p>
      <div class="voice-transcript" id="vTranscript">…</div>
      <button class="btn ghost wide" id="vCancel" type="button">${tr('Cancelar')}</button>
    </div></div>`);
    document.getElementById('vCancel').addEventListener('click', stopVoice);
    recognition = new Rec();
    recognition.lang = 'pt-PT'; recognition.continuous=false; recognition.interimResults=true;
    recognition.onresult = e=>{
      let text=''; for(let i=0;i<e.results.length;i++) text += e.results[i][0].transcript;
      const el=document.getElementById('vTranscript'); if(el) el.textContent = text;
      if(e.results[e.results.length-1].isFinal) parseVoice(text);
    };
    recognition.onerror = (e)=>{
      stopVoice();
      const reason = e && e.error;
      let msg = tr('Não foi possível usar o microfone aqui.');
      if(reason==='not-allowed' || reason==='service-not-allowed') msg = tr('O acesso ao microfone está bloqueado nesta janela — esta funcionalidade pode não estar disponível neste ecrã.');
      else if(reason==='no-speech') msg = tr('Não percebi nada — tenta falar assim que a janela abrir.');
      showAlert(msg);
    };
    recognition.onend = ()=>{ listening=false; };
    try{ recognition.start(); listening=true; }
    catch(err){ closeOverlay(); showAlert(tr('Não foi possível iniciar o microfone aqui.')); }
  }
  function stopVoice(){ if(recognition && listening){ try{recognition.stop();}catch(e){} } closeOverlay(); }
  function parseVoice(text){
    const low = text.toLowerCase();
    const num = (low.match(/\d+/)||[])[0];
    let toast='';
    const c = S.crianca;
    if(low.includes('mamada')||low.includes('biberão')||low.includes('biberao')||low.includes('peito')){
      let entry = {id:uid(), ts:Date.now(), qualidade:null, obs:''};
      if(low.includes('esquerd')){ entry.tipo='peito-esq'; entry.duracaoMin = num?+num:null; }
      else if(low.includes('direit')){ entry.tipo='peito-dir'; entry.duracaoMin = num?+num:null; }
      else { entry.tipo='biberao'; entry.marcaFormula=''; entry.mlOferecido = null; entry.mlBebido = num?+num:null; }
      S.mamadas.unshift(entry); save();
      toast = tr('Mamada registada:')+' '+feedLabel(entry);
    } else if(low.includes('fralda')||low.includes('xixi')||low.includes('cocó')||low.includes('coco')){
      const entry = {id:uid(), ts:Date.now(), tipo: (low.includes('cocó')||low.includes('coco'))?'coco':'xixi', quantidade:'normal', obs:''};
      S.fraldas.unshift(entry); save();
      toast = tr('Fralda registada:')+' '+diaperLabel(entry);
    } else if(low.includes('dormiu')||low.includes('começou a dormir')||(low.includes('sono')&&!low.includes('acord'))){
      if(!S.running.sleepStart){ S.running.sleepStart=Date.now(); save(); toast=tr('Sono iniciado.'); } else toast=tr('Já havia um sono em curso.');
    } else if(low.includes('acordou')||low.includes('terminou')){
      if(S.running.sleepStart){ stopSleep(); toast=tr('Sono terminado.'); } else toast=tr('Não havia sono em curso.');
    } else {
      toast = tr('Não percebi — tenta novamente.');
    }
    stopVoice();
    showOverlay(`<div class="voice-panel"><div class="voice-card"><p>${toast}</p><button class="btn wide" id="vOk" type="button" data-dismiss>OK</button></div></div>`);
    document.getElementById('vOk').addEventListener('click', ()=>{ closeOverlay(); render(); });
  }

  function medDueSoon(m){
    const last = dosesOf(m).sort((a,b)=>b.ts-a.ts)[0];
    if(!m.notificacoes) return null;
    const lang=(S.settings&&S.settings.lang)||'pt';
    if(last){
      const dueAt = last.ts + m.intervaloHoras*3600000;
      if(Date.now() >= dueAt){
        if(lang==='fr') return `La dose de ${m.nome} peut être administrée (min. ${m.intervaloHoras}h depuis la dernière).`;
        if(lang==='en') return `${m.nome}'s dose can be given now (min. ${m.intervaloHoras}h since the last one).`;
        return `Dose de ${m.nome} já pode ser administrada (mín. ${m.intervaloHoras}h desde a última).`;
      }
      return null;
    }
    if(m.horario){
      const [hh,mm] = m.horario.split(':').map(Number);
      const now=new Date(); const target=new Date(); target.setHours(hh,mm,0,0);
      const diffMin=(target-now)/60000;
      if(diffMin>=-30 && diffMin<=30){
        if(lang==='fr') return `${m.nome} prévu(e) à ${m.horario}.`;
        if(lang==='en') return `${m.nome} scheduled for ${m.horario}.`;
        return `${m.nome} agendado para as ${m.horario}.`;
      }
    }
    return null;
  }
  // Lembretes (backup, dose disponível, consulta e vacina agendadas). Globais: nas outras telas ficam no topo;
  // no Início passam para uma secção secundária no fim, depois do estado do dia, das ações e da linha do tempo.

    const msgs = reminderMsgs(), items = msgs.map(m=>`<div class="alert info">${m}</div>`).join('');   // lembretes = informação

  }
  function reminderMsgs(){
    const c=S.crianca; const msgs=[];
    const lang=(S.settings&&S.settings.lang)||'pt';
    const lastBk = S.settings && S.settings.lastBackupAt;
    const daysSinceBk = lastBk ? (Date.now()-lastBk)/86400000 : Infinity;
    if(daysSinceBk>=14){
      let txt;
      if(lang==='fr') txt = lastBk ? `Ça fait plus de 2 semaines sans sauvegarde. Exporte tes données dans Réglages.` : `Tu n'as pas encore fait de sauvegarde. Exporte tes données dans Réglages pour ne rien perdre.`;
      else if(lang==='en') txt = lastBk ? `It's been over 2 weeks since your last backup. Export your data in Settings.` : `You haven't backed up yet. Export your data in Settings so you don't lose anything.`;
      else txt = lastBk ? `Já lá vão mais de 2 semanas sem backup. Exporta os teus dados em Definições.` : `Ainda não fizeste backup. Exporta os teus dados em Definições para não perderes nada.`;
      msgs.push(ICONS.note+' '+txt);
    }
    (c.medicacoes||[]).forEach(m=>{ const r=medDueSoon(m); if(r) msgs.push(ICONS.pill+' '+r); });
    (c.consultas||[]).forEach(cs=>{
      const days=(new Date(cs.data+"T00:00:00")-new Date())/86400000;
      if(days>=0 && days<=3){
        const dd=Math.ceil(days), esp=cs.especialista||tr('especialista'), dateStr=new Date(cs.data+"T00:00:00").toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT');
        let txt;
        if(lang==='fr') txt = `Rendez-vous avec ${esp} dans ${dd} ${dd===1?'jour':'jours'} — ${dateStr}`;
        else if(lang==='en') txt = `Appointment with ${esp} in ${dd} ${dd===1?'day':'days'} — ${dateStr}`;
        else txt = `Consulta com ${esp} em ${dd} ${dd===1?'dia':'dias'} — ${dateStr}`;
        msgs.push(ICONS.calendar+' '+txt);
      }
    });
    Object.keys(S.vacinacao.doses||{}).forEach(k=>{
      const d = S.vacinacao.doses[k];
      if(d && !d.done && d.proximaData){
        const days=(new Date(d.proximaData+"T00:00:00")-new Date())/86400000;
        if(days>=0 && days<=14){
          const dd=Math.ceil(days), dateStr=new Date(d.proximaData+"T00:00:00").toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT');
          let txt;
          if(lang==='fr') txt = `Vaccin prévu le ${dateStr} (${dd} ${dd===1?'jour':'jours'})`;
          else if(lang==='en') txt = `Vaccine scheduled for ${dateStr} (${dd} ${dd===1?'day':'days'})`;
          else txt = `Vacina agendada para ${dateStr} (${dd} ${dd===1?'dia':'dias'})`;
          msgs.push(ICONS.syringe+' '+txt);
        }
      }
    });
    return msgs;
  }

  /* ============ textos de ajuda "Exemplo" (só visuais — nunca guardados nem contados) ============ */
  function lx(pt,fr,en){ const lang=(S.settings&&S.settings.lang)||'pt'; return lang==='fr'?fr:lang==='en'?en:pt; }
  function exampleHint(txt){ return `<div class="example-hint"><span class="ex-tag">${lx('Exemplo','Exemple','Example')}</span>${txt}</div>`; }
  function demoCleanupText(keys){
    const N = {
      mamadas:lx('mamadas/biberões','repas/biberons','feeds/bottles'), fraldas:lx('fraldas','couches','diapers'), sono:lx('sono','sommeil','sleep'),
      alergiasMed:lx('alergia','allergie','allergy'), intolerancias:lx('intolerância','intolérance','intolerance'), medicacoes:lx('medicações pré-definidas','médicaments prédéfinis','preset medications'),
      evolucao:lx('pesos/medidas','poids/mesures','weights/measurements'), marcos:lx('marcos de desenvolvimento','étapes de développement','milestones'),
      vacinas:lx('vacinas marcadas como feitas','vaccins marqués comme faits','vaccines marked as done'), contactos:lx('nomes/contactos "Exemplo"','noms/contacts « Exemple »','"Example" names/contacts'),
      nascimento:lx('medidas ao nascer','mesures à la naissance','birth measurements'), tipoSanguineo:lx('tipo sanguíneo (A+)','groupe sanguin (A+)','blood type (A+)'),
    };
    const removed = keys.filter(k=>N[k]).map(k=>N[k]).join(', ');
    const check = [];
    if(keys.includes('tipoSanguineo')) check.push(lx('tipo sanguíneo','groupe sanguin','blood type'));
    if(keys.includes('nascimento')) check.push(lx('medidas ao nascer','mesures à la naissance','birth measurements'));
    if(keys.includes('confirmarNascimento')) check.push(lx('data de nascimento','date de naissance','date of birth'));
    let txt = removed ? lx('Removemos dados de exemplo que estavam misturados com os dados reais: ','Nous avons retiré des données d\'exemple mélangées aux vraies données : ','We removed example data that was mixed in with the real data: ')+removed+'.' : '';
    if(check.length) txt += ' '+lx('Confirma no Perfil: ','Vérifie dans le Profil : ','Please check in Profile: ')+check.join(', ')+'.';
    return txt;
  }

  /* ============ INÍCIO ============ */
  // Medição mais recente pela DATA do registo (empate na mesma data → a inserida por último).
  // Usada em Início, referência de dose, SOS — nunca depender da ordem de inserção.
  function latestMeasure(metric){
    const arr=(S.evolucao && S.evolucao[metric]) || [];
    let best=null, bestIdx=-1;
    arr.forEach((r,i)=>{ if(!r || r.valor==null || r.valor==='') return;
      const d=String(r.date||''), bd=best?String(best.date||''):null;
      if(best===null || d>bd || (d===bd && i>bestIdx)){ best=r; bestIdx=i; } });
    return best;
  }
  // Regras de alerta centralizadas (mesma severidade em todos os ecrãs; limiares atuais, sem novos).
  // Texto do aviso de poucas fraldas de xixi (Início e Fraldas): tom de atenção, reconhece que o dia ainda decorre,
  // mantém a orientação sobre sinais de desidratação. A regra (getWetDiaperStatus) não muda.
  function wetDiaperMsg(n){
    const one = n===1;
    return lx(`Até agora, ${n} ${one?'fralda':'fraldas'} de xixi hoje (referência: 6–8 por dia). Se continuar baixo, observa sinais de desidratação.`,
      `Jusqu'ici, ${n} ${one?'couche mouillée':'couches mouillées'} aujourd'hui (repère : 6–8 par jour). Si cela reste bas, surveille les signes de déshydratation.`,
      `So far, ${n} wet ${one?'diaper':'diapers'} today (reference: 6–8 a day). If it stays low, watch for signs of dehydration.`);
  }
  function getWetDiaperStatus(xixiCount){ return (xixiCount>0 && xixiCount<6) ? 'warn' : null; }
  function getFeedGapStatus(lastFeed){ return (lastFeed && (Date.now()-lastFeed.ts) > 4*3600000) ? 'warn' : null; }
  function lastOf(arr){ return arr.slice().sort((a,b)=>b.ts-a.ts)[0]; }
  // Último período de sono = o que terminou mais tarde. Os registos de sono têm inicio/fim (não ts), por isso
  // lastOf() não serve: devolvia o primeiro da lista, que pode não ser o mais recente (registos manuais/importados).
  function lastSleepOf(arr){
    let best=null, bestT=-Infinity;
    (arr||[]).forEach(s=>{ if(!s) return; const t = s.fim!=null ? +s.fim : +s.inicio; if(!isNaN(t) && t>bestT){ best=s; bestT=t; } });
    return best;
  }
  function timelineSvg(){
    const [t0] = todayRange();
    // F5: pontos maiores e com contorno (ficam legíveis por cima da faixa de sono, que é só contexto de fundo);
    // medicação em losango para se distinguir das fraldas sem nova cor; horas ≥ 12 px.
    const w=600,h=66, cy=39; const evs=[];
    S.mamadas.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'feed'}));
    S.fraldas.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'diaper'}));
    S.doses.filter(l=>inRange(l.ts,t0,t0+86400000)).forEach(l=>evs.push({x:l.ts,type:'med'}));
    const sleeps = S.sono.filter(l=>l.inicio<t0+86400000 && l.fim>t0);
    const xPos = ts => 12 + ((ts-t0)/86400000)*(w-24);
    const bands = sleeps.map(s=>{
      const a=Math.max(s.inicio,t0), b=Math.min(s.fim,t0+86400000);
      return `<rect class="tl-sleep" x="${xPos(a).toFixed(1)}" y="24" width="${Math.max(3,(xPos(b)-xPos(a))).toFixed(1)}" height="30" rx="6" fill="var(--sleepc)"/>`;
    }).join('');
    const colors = {feed:'var(--feed)', diaper:'var(--diaper)', med:'var(--med)'};   // cores de categoria: não dependem do acento
    const mark = e => { const x=xPos(e.x).toFixed(1);
      return e.type==='med'
        ? `<rect x="${(x-7.5).toFixed(1)}" y="${cy-7.5}" width="15" height="15" rx="2" transform="rotate(45 ${x} ${cy})" fill="${colors.med}" stroke="var(--surface)" stroke-width="2.5"/>`
        : `<circle cx="${x}" cy="${cy}" r="8.5" fill="${colors[e.type]}" stroke="var(--surface)" stroke-width="2.5"/>`; };
    const dots = evs.filter(e=>e.type!=='med').map(mark).join('') + evs.filter(e=>e.type==='med').map(mark).join('');
    const hours = `<div class="tl-hours" aria-hidden="true">${[0,6,12,18,24].map(hh=>`<span style="left:${((12+hh/24*(w-24))/w*100).toFixed(2)}%">${hh}h</span>`).join('')}</div>`;
    const nF=evs.filter(e=>e.type==='feed').length, nD=evs.filter(e=>e.type==='diaper').length, nM=evs.filter(e=>e.type==='med').length;
    const desc = lx('Linha do tempo de hoje: ',"Chronologie d'aujourd'hui : ","Today's timeline: ")+[pl(nF,'refeição','refeições','repas','repas','feed','feeds'), pl(nD,'fralda','fraldas','couche','couches','diaper','diapers'), pl(nM,'dose','doses','dose','doses','dose','doses'), pl(sleeps.length,'período de sono','períodos de sono','période de sommeil','périodes de sommeil','sleep period','sleep periods')].join(', ')+'.';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${desc}" style="display:block;">
      <line x1="12" y1="${cy}" x2="${w-12}" y2="${cy}" stroke="var(--border)" stroke-width="2"/>
      ${bands}${dots}
    </svg>${hours}
    <div class="legend" aria-hidden="true"><span><i class="lg-dot" style="background:var(--feed)"></i>${tr('refeição')}</span><span><i class="lg-dot" style="background:var(--diaper)"></i>${tr('fralda')}</span><span><i class="lg-diamond" style="background:var(--med)"></i>${tr('medicação')}</span><span><i style="background:var(--sleepc)"></i>${tr('sono')}</span></div>`;
  }

  function renderInicio(){
    const [t0,t1]=todayRange();
    const feed=lastOf(S.mamadas), diaper=lastOf(S.fraldas);
    const isSleeping=!!S.running.sleepStart;
    const lastSleep=lastSleepOf(S.sono);
    const feedsToday=S.mamadas.filter(l=>inRange(l.ts,t0,t1)).length;
    const diapersToday=S.fraldas.filter(l=>inRange(l.ts,t0,t1));
    const xixiToday=diapersToday.filter(d=>d.tipo==='xixi').length, cocoToday=diapersToday.filter(d=>d.tipo==='coco').length;
    const sleepMinsToday=S.sono.filter(l=>inRange(l.inicio,t0,t1)||inRange(l.fim,t0,t1)).reduce((s,l)=>s+(l.duracaoMin||0),0);
    const peso = latestMeasure('peso') ? latestMeasure('peso').valor : null;

    let html='';
    const notice = S.settings.demoCleanupNotice;
    if(notice && notice.length) html += `<div class="demo-banner" style="flex-wrap:wrap;">${ICONS.note} <span style="flex:1;min-width:200px;">${demoCleanupText(notice)}</span> <button id="dismissDemoNotice" type="button">${tr('OK')}</button></div>`;
    if(!S.mamadas.length && !S.fraldas.length && !S.sono.length && !isSleeping){
      html += `<div class="card"><div class="section-label">${lx('Ainda sem registos','Pas encore d\'enregistrements','No records yet')}</div>
        <p class="muted" style="margin:0;">${lx('Usa as ações rápidas abaixo para registar. Os resumos e gráficos só usam o que registares.','Utilise les actions rapides ci-dessous. Les résumés et graphiques n\'utilisent que ce que tu enregistres.','Use the quick actions below. Summaries and charts only use what you log.')}</p>
        ${exampleHint(tr('Biberão')+' · '+tr('Bebido')+' 140ml · 14:30')}
      </div>`;
    }

    // Estado do dia primeiro; a atenção aparece no próprio cartão (reforço discreto + selo curto), sem repetir
    // numa caixa separada o que o cartão já diz. A orientação das fraldas (sinais de desidratação) fica logo a seguir às ações.
    const wetStatus = getWetDiaperStatus(xixiToday);
    const feedGap = getFeedGapStatus(feed);
    const flag = (st, txt) => st ? `<span class="stat-flag">${txt}</span>` : '';
    const cls = st => 'stat' + (st==='warn' ? ' stat-warn' : st==='action' ? ' stat-action' : '');
    html += `<div class="grid2 home-status">
      <div class="${cls(feedGap)}"><div class="ic feed">${ICONS.bottle}</div><div class="lbl">${tr('Última refeição')}</div><div class="val">${feed?agoStr(feed.ts):'—'}</div><div class="sub">${feed?feedLabel(feed):tr('sem registos')}</div>${(S.mamadas.length||feedGap)?`<div class="stat-foot">${S.mamadas.length?`<span class="sub stat-today">${lx(`${feedsToday} hoje`,`${feedsToday} aujourd'hui`,`${feedsToday} today`)}</span>`:''}${flag(feedGap, lx('A observar','À surveiller','Keep an eye'))}</div>`:''}</div>
      <div class="${cls(wetStatus)}"><div class="ic diaper">${ICONS.drop}</div><div class="lbl">${tr('Última fralda')}</div><div class="val">${diaper?agoStr(diaper.ts):'—'}</div><div class="sub">${diaper?diaperLabel(diaper):tr('sem registos')}</div>${(S.fraldas.length||wetStatus)?`<div class="stat-foot">${S.fraldas.length?`<span class="sub stat-today">${lx(`${xixiToday} xixi · ${cocoToday} cocó hoje`,`${xixiToday} pipi · ${cocoToday} caca aujourd'hui`,`${xixiToday} wet · ${cocoToday} dirty today`)}</span>`:''}${flag(wetStatus, lx('A observar','À surveiller','Keep an eye'))}</div>`:''}</div>
      <div class="stat"><div class="ic sleepc">${ICONS.moon}</div><div class="lbl">${isSleeping?tr('A dormir há'):tr('Sono hoje')}</div><div class="val">${isSleeping? durStr((Date.now()-S.running.sleepStart)/60000) : durStr(sleepMinsToday)}</div><div class="sub">${isSleeping?tr('em curso'):(lastSleep?(tr('último:')+' '+agoStr(lastSleep.fim)):tr('sem registos'))}</div></div>
      <div class="stat stat-link" role="button" tabindex="0" data-go="evolucao"><div class="ic growth">${ICONS.chart}</div><div class="lbl">${tr('Peso atual')}</div><div class="val">${peso?fmtNum(peso,3)+' kg':'—'}</div><div class="sub">${tr('ver em Evolução')}</div></div>
    </div>

    <div class="card"><div class="section-label">${tr('Ações rápidas')}</div>
      <div class="qa-grid">
        <button type="button" class="qa-tile" data-quick="mamadas"><div class="ic feed">${ICONS.bottle}</div><span class="lbl" lang="${(S.settings&&S.settings.lang)||'pt'}">${tr('Mamada')}</span></button>
        <button type="button" class="qa-tile" data-quick="fraldas"><div class="ic diaper">${ICONS.drop}</div><span class="lbl" lang="${(S.settings&&S.settings.lang)||'pt'}">${tr('Fralda')}</span></button>
        <button type="button" class="qa-tile${isSleeping?' running':''}" data-quick="sono"><div class="ic sleepc">${ICONS.moon}</div><span class="lbl" lang="${(S.settings&&S.settings.lang)||'pt'}">${isSleeping?tr('Terminar'):tr('Sono')}</span></button>
        <button type="button" class="qa-tile" data-quick="med"><div class="ic med">${ICONS.pill}</div><span class="lbl" lang="${(S.settings&&S.settings.lang)||'pt'}">${tr('Medicação')}</span></button>
      </div>
    </div>
    ${wetStatus ? `<div class="alert alert-compact ${wetStatus}">${ICONS.drop} <span>${wetDiaperMsg(xixiToday)}</span></div>` : ''}

    <div class="card"><div class="section-label">${tr('Linha do tempo · hoje')}</div><div class="timeline-wrap">${timelineSvg()}</div></div>
    <div id="homeReminders"></div>`;
    document.getElementById('main').innerHTML = html;
    renderReminders();   // preenche a secção de lembretes do Início
    const dn=document.getElementById('dismissDemoNotice');
    if(dn) dn.addEventListener('click', ()=>{ delete S.settings.demoCleanupNotice; save(); render(); });
    document.querySelectorAll('#main [data-go]').forEach(el=>el.addEventListener('click', ()=>{ activeTab=el.dataset.go; openForm=null; editId=null; render(); }));
    document.querySelectorAll('[data-quick]').forEach(t=>t.addEventListener('click', ()=>{
      const dest=t.dataset.quick;
      if(dest==='sono' && isSleeping){ stopSleep(); return; }
      if(dest==='sono'){ S.running.sleepStart=Date.now(); save(); playChime(); render(); return; }
      if(dest==='med'){ showQuickMedication(); return; }
      activeTab=dest; openForm='new'; render();
    }));
  }

  function stopSleep(){
    const start=S.running.sleepStart, end=Date.now();
    S.sono.unshift({id:uid(), periodo:null, posicao:null, inicio:start, fim:end, duracaoMin:(end-start)/60000, qualidade:null, interrupcoes:null, obs:''});   // período/posição: não indicados (a utilizadora não escolheu)
    S.running.sleepStart=null; save(); playChime(); render();
  }

    document.getElementById('main').innerHTML = html;
