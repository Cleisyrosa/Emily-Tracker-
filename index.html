    document.querySelectorAll('[data-growth-view]').forEach(b=>b.addEventListener('click', ()=>{
      growthView=b.dataset.growthView; renderEvolucao();
      const nb=document.querySelector(`[data-growth-view="${growthView}"]`); if(nb) nb.focus();
    }));
    document.getElementById('gSave').addEventListener('click', ()=>{
      const date=document.getElementById('gDate').value||todayISO();
      clearFieldErrors(document.getElementById('main'));
      // "6,5" e "6.5" → 6,5 (vírgula ou ponto). Valores fora do intervalo possível são rejeitados junto ao campo.
      const weight=readNum('gWeight'), height=readNum('gHeight'), head=readNum('gHead');
      const errs=[];
      [['gWeight','peso',weight],['gHeight','altura',height],['gHead','pc',head]].forEach(([id,m,v])=>{ const e=measureError(m,v); if(e) errs.push([id,e]); });
      if(date>todayISO()) errs.push(['gDate', msgFuturo()]);
      if(!errs.length && weight==null && height==null && head==null) errs.push(['gWeight', lx('Preenche pelo menos um valor.','Remplis au moins une valeur.','Fill in at least one value.')]);
      if(!showFieldErrors(errs)) return;
      const commit=()=>{
        if(weight) S.evolucao.peso.push({date, valor:weight});
        if(height) S.evolucao.altura.push({date, valor:height});
        if(head) S.evolucao.pc.push({date, valor:head});
        save(); if(weight||height||head) playChime(); renderEvolucao(); };
      const warns=[measureUnusual('peso',weight), measureUnusual('altura',height), measureUnusual('pc',head)].filter(Boolean);
      if(warns.length) confirmUnusual(warns, commit); else commit();
    });
    document.querySelectorAll('[data-meas-metric]').forEach(b=>b.addEventListener('click', ()=>showMeasurementDetails(b.dataset.measMetric, +b.dataset.measIdx)));
  }
  const MEAS = { peso:{lbl:'Peso', unit:'kg'}, altura:{lbl:'Comprimento/altura', unit:'cm'}, pc:{lbl:'Perímetro cefálico', unit:'cm'} };
  // null (vazio) = sem erro. Bloqueia só texto inválido e valores <= 0.
  function measureError(metric, v){
    if(v==null) return null;
    if(Number.isNaN(v)) return lx('Número inválido. Usa, por exemplo, 6,5 ou 6.5.','Nombre invalide. Utilise par ex. 6,5 ou 6.5.','Invalid number. Use e.g. 6.5.');
    if(v<=0) return lx('O valor tem de ser maior que 0.','La valeur doit être supérieure à 0.','Value must be above 0.');
    return null;
  }
  // Fora do intervalo habitual → devolve a pergunta de confirmação (o valor pode ser guardado se confirmado).
  function measureUnusual(metric, v){
    if(v==null || Number.isNaN(v) || v<=0) return null;
    const [lo,hi]=LIMITS[metric]; if(v>=lo && v<=hi) return null;
    const u=MEAS[metric].unit, x=numTxt(v);
    if(metric==='peso') return lx(`Este peso é invulgar. Tens a certeza que queres guardar ${x} kg?`,`Ce poids est inhabituel. Veux-tu vraiment enregistrer ${x} kg ?`,`This weight is unusual. Are you sure you want to save ${x} kg?`);
    if(metric==='altura') return lx(`Esta altura é invulgar. Tens a certeza que queres guardar ${x} cm?`,`Cette taille est inhabituelle. Veux-tu vraiment enregistrer ${x} cm ?`,`This height is unusual. Are you sure you want to save ${x} cm?`);
    return lx(`Este perímetro cefálico é invulgar. Tens a certeza que queres guardar ${x} cm?`,`Ce périmètre crânien est inhabituel. Veux-tu vraiment enregistrer ${x} cm ?`,`This head circumference is unusual. Are you sure you want to save ${x} cm?`);
  }
  // Detalhe de uma medição: idade exata, indicador OMS, percentil e z-score (o z-score só aparece aqui).
  function growthDetailsHtml(metric, rec){
    const res=growthResult(metric, rec);
    const line=(k,v)=>`<div class="rec-line"><span>${k}</span><b>${v}</b></div>`;
    let h=`<div class="section-label" style="margin-top:14px;">${lx('Padrões de crescimento da OMS','Standards de croissance de l\'OMS','WHO growth standards')}</div>`;
    if(!res.ok) return h+`<p class="muted growth-note">${growthReason(res)}</p>`;
    h+=line(lx('Idade na medição','Âge à la mesure','Age at measurement'), `${ageInfo(S.crianca.dataNascimento, rec.date).label} (${pl(res.days,'dia','dias','jour','jours','day','days')})`);
    h+=line(lx('Indicador','Indicateur','Indicator'), growthIndicatorName(res, metric));
    h+=line(lx('Percentil','Percentile','Percentile'), pctText(res.percentile));
    h+=line('z-score', zText(res.z));
    if(metric==='peso' || metric==='altura'){
      const pair=growthPairs().find(p=>p.date===rec.date);
      if(pair && pair.res.ok) h+=line(growthIndicatorName(pair.res), `${pctText(pair.res.percentile)} · z ${zText(pair.res.z)}`);
    }
    if(res.flagged) h+=`<p class="growth-note" style="font-weight:600;">${lx('Este valor está muito afastado dos padrões da OMS. Confirma se a medição foi registada corretamente.','Cette valeur est très éloignée des standards de l\'OMS. Vérifie que la mesure a été correctement saisie.','This value is very far from the WHO standards. Check that the measurement was entered correctly.')}</p>`;
    return h+`<p class="muted growth-note">${growthDisclaimer()}</p>`;
  }
  function showMeasurementDetails(metric, idx, editing, typed){
    const rec=(S.evolucao[metric]||[])[idx]; if(!rec){ closeOverlay(); return; }
    const M=MEAS[metric];
    showOverlay(`<div class="voice-panel" id="measPanel"><div class="voice-card" style="text-align:left;">
      <h2 style="margin:0 0 10px;display:flex;align-items:center;gap:8px;">${ICONS.chart} ${tr(M.lbl)}</h2>
      ${editing ? `<div class="form-row"><div style="flex:1;"><label>${tr('Data')}</label><input type="date" id="mDate" value="${typed?typed.date:(rec.date||'')}"></div>
          <div style="flex:1;"><label>${tr(M.lbl)} (${M.unit})</label><input type="text" inputmode="decimal" id="mVal" value="${typed?typed.raw:rec.valor}"></div></div>
        <button class="btn wide" id="mSave" type="button">${tr('Guardar alterações')}</button>`
      : `<div class="rec-line"><span>${tr('Data')}</span><b>${rec.date ? new Date(rec.date+'T12:00:00').toLocaleDateString(localeTag()) : '—'}</b></div>
        <div class="rec-line"><span>${tr(M.lbl)}</span><b>${growthNum(Number(rec.valor))} ${M.unit}</b></div>
        ${growthDetailsHtml(metric, rec)}
        <div class="btn-row" style="margin-top:14px;"><button class="btn secondary wide" id="mEdit" type="button">${ICONS.edit} ${lx('Editar','Modifier','Edit')}</button><button class="btn crit wide" id="mDel" type="button">${tr('Apagar')}</button></div>`}
      <button class="btn ghost wide" id="mClose" type="button" style="margin-top:8px;">${editing?tr('Cancelar'):tr('Fechar')}</button>
    </div></div>`);
    const panel=document.getElementById('measPanel');
    /* toque fora: regra comum em overlayBackdropAllowed() */
    document.getElementById('mClose').addEventListener('click', ()=> editing ? showMeasurementDetails(metric, idx, false) : closeOverlay());
    const eb=document.getElementById('mEdit'); if(eb) eb.addEventListener('click', ()=>showMeasurementDetails(metric, idx, true));
    const db=document.getElementById('mDel'); if(db) db.addEventListener('click', ()=>showConfirm(lx('Apagar esta medição?','Supprimer cette mesure ?','Delete this measurement?'), ()=>{
      const arr=S.evolucao[metric]; const i=arr.indexOf(rec); if(i>-1) arr.splice(i,1); save(); renderEvolucao();
    }));
    const sb=document.getElementById('mSave'); if(sb) sb.addEventListener('click', ()=>{
      clearFieldErrors(document.getElementById('measPanel'));
      const v=readNum('mVal'), d=document.getElementById('mDate').value, errs=[];
      if(!d) errs.push(['mDate', lx('Indica a data.','Indique la date.','Enter the date.')]); else if(d>todayISO()) errs.push(['mDate', msgFuturo()]);
      if(v==null) errs.push(['mVal', lx('Indica o valor.','Indique la valeur.','Enter the value.')]); else { const e=measureError(metric,v); if(e) errs.push(['mVal', e]); }
      if(!showFieldErrors(errs)) return;
      const commit=()=>{ const arr=S.evolucao[metric]; const i=arr.indexOf(rec); if(i<0){ closeOverlay(); return; }
        rec.valor=v; rec.date=d; save(); closeOverlay(); renderEvolucao(); };
      const raw=document.getElementById('mVal').value;
      const wq=measureUnusual(metric, v);
      if(wq) confirmUnusual([wq], commit, ()=>showMeasurementDetails(metric, idx, true, {date:d, raw}));   // Cancelar volta à edição com o que foi escrito
      else commit();
    });
  }

  /* ============ DESENVOLVIMENTO ============ */
  function renderDesenv(){
    let allDone=true, totalDone=0, totalItems=0, relItems=0, relDone=0;
    const lang=(S.settings&&S.settings.lang)||'pt';
    const dob=S.crianca.dataNascimento, ageM = dob ? ageInfo(dob).months : null;
    const bands = MILESTONE_BANDS.map(band=>{
      const start = parseInt(band.band,10);                 // "0-1 mês" → 0, "4-6 meses" → 4
      const future = ageM!=null && start > ageM;            // ainda não é altura: neutro
      const rows = band.items.map(item=>{
        const key = band.band+"|"+item;
        const done = S.desenvolvimento.done[key];
        totalItems++; if(done) totalDone++; else allDone=false;
        if(!future){ relItems++; if(done) relDone++; }
        const state = done ? 'done' : future ? 'future' : 'expected';
        // F8: a data real (F7) é formatada como no resto da app, nunca a string ISO crua; done continua guardado em ISO.
        const right = done ? new Date(done+'T12:00:00').toLocaleDateString(localeTag()) : future ? lx(`${start}+ meses`,`${start}+ mois`,`${start}+ months`) : tr('esperado');
        return `<div class="mi-row ${state}"><span class="dot"></span><span>${tr(item)}</span><span class="d">${right}</span>${done?`<button class="log-del" data-card-mi="${key}" type="button" style="margin-left:4px;" title="${tr('Ver cartão')}" aria-label="${tr('Ver cartão')}">${ICONS.card}</button>`:''}<button class="log-del" data-toggle-mi="${key}" type="button" style="margin-left:4px;" aria-label="${done?lx('Desmarcar marco','Décocher l\'étape','Unmark milestone'):lx('Marcar como alcançado','Marquer comme atteint','Mark as reached')}" title="${done?lx('Desmarcar marco','Décocher l\'étape','Unmark milestone'):lx('Marcar como alcançado','Marquer comme atteint','Mark as reached')}">${done?ICONS.undo:ICONS.check}</button></div>`;
      }).join('');
      return `<div class="milestone-band"><h3>${tr(band.band)}</h3>${rows}</div>`;
    }).join('');
    const later = totalItems-relItems;
    const progressTxt = ageM==null
      ? (lang==='fr' ? `${totalDone} sur ${totalItems} étapes notées pour l'instant.` : lang==='en' ? `${totalDone} of ${totalItems} milestones noted so far.` : `${totalDone} de ${totalItems} marcos registados até agora.`)
      : lx(`${relDone} de ${relItems} marcos habituais até esta idade estão registados${later?` · ${later} são para mais tarde`:''}. Cada criança tem o seu ritmo.`,
           `${relDone} sur ${relItems} étapes habituelles à cet âge sont notées${later?` · ${later} viendront plus tard`:''}. Chaque enfant a son rythme.`,
           `${relDone} of ${relItems} milestones usual by this age are noted${later?` · ${later} come later`:''}. Every child has their own pace.`);
    document.getElementById('main').innerHTML = `${pageTitle(lx('Desenvolvimento','Développement','Milestones'))}
      <div class="alert ${allDone?'good':'info'}">${ICONS.brain} ${allDone?tr('Desenvolvimento normal para a idade — tudo no tempo esperado.'):progressTxt}</div>
      <div class="card">${bands}</div>`;
    document.querySelectorAll('[data-toggle-mi]').forEach(b=>b.addEventListener('click', ()=>{
      const key=b.dataset.toggleMi;
      if(S.desenvolvimento.done[key]){ delete S.desenvolvimento.done[key]; save(); renderDesenv(); return; }   // desmarcar
      // marcar: pergunta a data real em que o marco foi alcançado (hoje pré-selecionado, mas pode ser uma data passada)
      const item = key.split('|').slice(1).join('|');
      showDateConfirm(lx(`Quando foi alcançado — ${tr(item)}?`,`Quand a été atteint — ${tr(item)} ?`,`When was it reached — ${tr(item)}?`), (date)=>{
        S.desenvolvimento.done[key] = date; save(); renderDesenv();
      });
    }));
    document.querySelectorAll('[data-card-mi]').forEach(b=>b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const key=b.dataset.cardMi; const parts=key.split('|'); const item=parts.slice(1).join('|');
      showMilestoneCard(item, S.desenvolvimento.done[key]);
    }));
  }

  /* ============ VACINAÇÃO ============ */
  function vaxDueTxt(n){ return lx(`${n} ${n===1?'dose prevista':'doses previstas'} para a idade ainda por registar — confirma no boletim de vacinas.`,
    `${n} ${n===1?'dose prévue':'doses prévues'} pour l'âge pas encore ${n===1?'notée':'notées'} — vérifie le carnet de vaccination.`,
    `${n} ${n===1?'dose':'doses'} due for this age not logged yet — check the vaccination record.`); }
  function vaxOkTxt(m, next){ if(m==null) return lx('Indica a data de nascimento no Perfil para ver o calendário por idade.','Indique la date de naissance dans le Profil pour voir le calendrier par âge.','Add the date of birth in Profile to see the schedule by age.');
    return lx(`Em dia para a idade.${next!=null?` Próximas doses aos ${next} meses.`:''}`, `À jour pour l'âge.${next!=null?` Prochaines doses à ${next} mois.`:''}`, `Up to date for this age.${next!=null?` Next doses at ${next} months.`:''}`); }
  function vaxRec(key){ S.vacinacao.doses = S.vacinacao.doses||{}; if(!S.vacinacao.doses[key]) S.vacinacao.doses[key]={done:null,pais:'',reacao:'',proximaData:''}; return S.vacinacao.doses[key]; }
  function renderVacinas(){
    const dob=S.crianca.dataNascimento, months = dob ? ageInfo(dob).months : null;
    let complete=true, dueCount=0, nextDue=null;
    const fmtShort = iso => new Date(iso+'T12:00:00').toLocaleDateString(localeTag(), {day:'2-digit', month:'2-digit'});
    const groups = VAX.map(v=>{
      const doses = v.doses.map((label,i)=>{
        const key=v.id+'-'+i; const rec=vaxRec(key);
        if(!rec.done) complete=false;
        // Estado visual: administrada · agendada (data futura) · futura (ainda não é altura) · prevista para a idade e por registar.
        // Não afirmamos "atrasada": os calendários variam e a dose pode só não ter sido registada.
        const due = v.due ? v.due[i] : null;
        let vState='pending', vLbl=lx('Prevista','Prévue','Due');
        if(rec.done){ vState='done'; vLbl=new Date(rec.done+'T12:00:00').toLocaleDateString(localeTag()); }
        else if(rec.proximaData && rec.proximaData>=todayISO()){ vState='scheduled'; vLbl=lx('Agendada ','Prévue ','Scheduled ')+fmtShort(rec.proximaData); }
        // sem idade (sem DOB) não há como calcular se é cedo/na hora: estado neutro, texto próprio (não "Prevista").
        else if(months==null || due==null){ vState='future'; vLbl=lx('Idade por indicar','Âge à indiquer','Age not set'); }
        else if(due>months){ vState='future'; vLbl= due===0 ? lx('À nascença','À la naissance','At birth') : lx(`Aos ${due} meses`,`À ${due} mois`,`At ${due} months`); if(nextDue==null||due<nextDue) nextDue=due; }
        else { vState='pending'; vLbl=lx('Prevista','Prévue','Due'); dueCount++; }
        const extra = rec.done
          ? `<div class="form-row" style="margin-top:4px;"><div style="flex:1;"><input type="text" data-vaxPais="${key}" placeholder="${tr('País')}" value="${rec.pais||''}"></div><div style="flex:1;"><input type="text" data-vaxReacao="${key}" placeholder="${tr('Reação')}" value="${rec.reacao||''}"></div></div>`
          : `<div class="form-row" style="margin-top:4px;"><div style="flex:1;"><label style="font-size:var(--fs-xs);">${tr('Data agendada')}</label><input type="date" data-vaxData="${key}" value="${rec.proximaData||''}"></div></div>`;
        return `<div class="vax-dose" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;align-items:center;gap:8px;"><span class="lbl">${tr(label)}</span><button class="vax-badge ${vState}" data-vax="${key}" title="${rec.done?lx('Desmarcar','Décocher','Unmark'):lx('Marcar como administrada','Marquer comme administré','Mark as given')}">${vLbl}</button></div>
          ${extra}
        </div>`;
      }).join('');
      return `<div class="vax-group"><div class="vname">${tr(v.nome)}</div>${doses}</div>`;
    }).join('');
    const lang=(S.settings&&S.settings.lang)||'pt';
    const completeTxt = lang==='fr' ? `À jour — tous les vaccins pour ${months} mois sont complets.` : lang==='en' ? `Up to date — all vaccines for ${months} months are complete.` : `Em dia — todas as vacinas para os ${months} meses estão completas.`;
    document.getElementById('main').innerHTML = `${pageTitle(lx('Vacinas','Vaccins','Vaccines'))}
      <div class="alert ${complete?'good':dueCount?'warn':months==null?'info':'good'}">${ICONS.syringe} ${complete?completeTxt:dueCount?vaxDueTxt(dueCount):vaxOkTxt(months,nextDue)}</div>
      <div class="card">${groups}
        <button class="btn wide" id="saveVacinas" type="button" style="margin-top:10px;">${ICONS.check} ${tr('Guardar')}</button>
      </div>
      <p class="muted" style="text-align:center;">${tr('Calendário Bélgica (Wallonie) + Luxemburgo. Confirma sempre datas exatas com o/a pediatra.')}</p>`;
    document.querySelectorAll('[data-vax]').forEach(b=>b.addEventListener('click', ()=>{
      const key=b.dataset.vax, rec=vaxRec(key);
      const [vid, di] = [key.slice(0,key.lastIndexOf('-')), +key.slice(key.lastIndexOf('-')+1)];
      const v = VAX.find(x=>x.id===vid); const nome = v ? tr(v.nome)+' — '+tr(v.doses[di]) : key;
      if(!rec.done){
        // F8: "agendada" é planeamento (rec.proximaData) — gerir a data agendada, NUNCA abrir "Quando foi administrada?".
        if(rec.proximaData && rec.proximaData>=todayISO()){
          showDateConfirm(lx(`Data agendada — ${nome}`,`Date prévue — ${nome}`,`Scheduled date — ${nome}`), (date)=>{
            rec.proximaData = date; save(); renderVacinas(); renderReminders();
          }, { initial: rec.proximaData, blockFuture:false, label: tr('Data agendada') });
          return;
        }
        // prevista/futura (sem agendamento): pergunta a data real de administração (hoje pré-selecionado, pode ser passada)
        showDateConfirm(lx(`Quando foi administrada — ${nome}?`,`Quand a été administré — ${nome} ?`,`When was it given — ${nome}?`), (date)=>{
          rec.done = date; save(); playChime(); renderVacinas(); renderReminders();
        });
        return;
      }
      // desmarcar: confirmação (a data de administração é removida; país e reação ficam guardados)
      const when = new Date(rec.done+'T12:00:00').toLocaleDateString(localeTag());
      showConfirm(lx(`Remover o registo de administração de ${nome} (${when})? A data de administração é apagada. O país e a reação, se preenchidos, ficam guardados.`,
        `Retirer l'enregistrement d'administration de ${nome} (${when}) ? La date d'administration est supprimée. Le pays et la réaction, s'ils sont remplis, restent enregistrés.`,
        `Remove the record that ${nome} was given (${when})? The date given is deleted. Country and reaction, if filled in, are kept.`),
        ()=>{ rec.done=null; save(); renderVacinas(); renderReminders(); });
    }));
    document.querySelectorAll('[data-vaxPais]').forEach(el=>el.addEventListener('input', ()=>{ vaxRec(el.dataset.vaxpais).pais=el.value; save(); }));
    document.querySelectorAll('[data-vaxReacao]').forEach(el=>el.addEventListener('input', ()=>{ vaxRec(el.dataset.vaxreacao).reacao=el.value; save(); }));
    document.querySelectorAll('[data-vaxData]').forEach(el=>el.addEventListener('input', ()=>{ vaxRec(el.dataset.vaxdata).proximaData=el.value; save(); renderReminders(); }));
    const saveVacBtn = document.getElementById('saveVacinas');
    saveVacBtn.addEventListener('click', ()=>{
      const ok = save();
      if(ok) playChime();
      saveVacBtn.innerHTML = ok ? ICONS.check+' '+tr('Guardado!') : ICONS.sos+' '+tr('Não foi possível guardar');
      setTimeout(()=>{ saveVacBtn.innerHTML = ICONS.check+' '+tr('Guardar'); }, 1500);
    });
  }

  /* ============ CONSULTAS ============ */

    </div>

      save(); playChime(); renderConsultas(); renderReminders();

  }

  /* ============ RESUMO ============ */
  // Períodos em dias de calendário (hoje incluído): 7 dias = hoje + 6 anteriores.
  function periodRange(days, offsetDays){
    const start=new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()-(days-1)-(offsetDays||0));
    const end=new Date(start); end.setDate(end.getDate()+days);
    return [start.getTime(), end.getTime()];
  }
  function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
  function fmtInt(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
  // Valor de formulário: vazio em vez de "undefined"/"null" quando o campo nunca foi preenchido.
  function fv(v){ return v==null ? '' : v; }
  // Número para mostrar, com a vírgula/ponto do idioma e sem zeros a mais (6,45 · 8 · 7,5). fixed=true → casas fixas (1,0).
  function fmtNum(v, maxD, fixed){ const lang=(S.settings&&S.settings.lang)||'pt';
    return new Intl.NumberFormat(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT', {minimumFractionDigits:fixed?maxD:0, maximumFractionDigits:maxD, useGrouping:false}).format(+v); }
  function fmtDec(n,d){ const v=(+n).toFixed(d); return ((S.settings&&S.settings.lang)||'pt')==='en' ? v : v.replace('.',','); }
  // Estatísticas objetivas de um período, só com registos reais. As médias por dia usam
  // APENAS os dias que têm registos dessa categoria — um dia sem registos não conta como 0.
  function periodSummary(days, offsetDays){
    const [a,b]=periodRange(days, offsetDays);
    return rangeSummary(a, b, days);
  }
  // Semana do resumo semanal = semana de calendário, segunda a domingo. weekOffset 0 = semana atual, 1 = anterior, …
  // É o MESMO período usado pela reflexão e pela nota da semana (chave = data da segunda-feira).
  function weekStartDate(d){ const x=new Date(d||Date.now()); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  function weekKeyOf(d){ const x=weekStartDate(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
  function viewedWeek(weekOffset){
    const a=weekStartDate(); a.setDate(a.getDate()-7*(weekOffset||0));
    const b=new Date(a); b.setDate(b.getDate()+7);
    const pa=new Date(a); pa.setDate(pa.getDate()-7);
    const today=new Date(); today.setHours(0,0,0,0);
    // Semana em curso: só contam os dias já decorridos (até hoje) para o "X/N dias".
    const span = today>=a && today<b ? Math.round((today-a)/86400000)+1 : 7;
    return { a:a.getTime(), b:b.getTime(), pa:pa.getTime(), key:weekKeyOf(a), span, current:(weekOffset||0)===0 };
  }
  function rangeSummary(a, b, days){
    const feeds=S.mamadas.filter(l=>inRange(l.ts,a,b));
    const bott=feeds.filter(l=>l.tipo==='biberao');
    const withMl=bott.filter(l=>bottleMl(l)!=null);
    const ml=withMl.reduce((s,l)=>s+bottleMl(l),0);
    const mlDays=new Set(withMl.map(l=>dayKey(l.ts))).size;
    const breast=feeds.filter(l=>l.tipo==='peito-esq'||l.tipo==='peito-dir');
    const withDur=breast.filter(l=>l.duracaoMin!=null && +l.duracaoMin>0);
    const durTotal=withDur.reduce((s,l)=>s+(+l.duracaoMin),0);
    const sono=S.sono.filter(l=>inRange(l.inicio,a,b));
    const sonoMin=sono.reduce((s,l)=>s+(l.duracaoMin||0),0);
    const sonoDays=new Set(sono.map(l=>dayKey(l.inicio))).size;
    const fr=S.fraldas.filter(l=>inRange(l.ts,a,b));
    const xixi=fr.filter(f=>f.tipo==='xixi').length, coco=fr.filter(f=>f.tipo==='coco').length;
    const frDays=new Set(fr.map(l=>dayKey(l.ts))).size;
    return { days, a, b,
      bottle:{ n:bott.length, ml, noMl:bott.length-withMl.length, days:new Set(bott.map(l=>dayKey(l.ts))).size, mlDays, mlPerDay: mlDays ? ml/mlDays : null },
      breast:{ n:breast.length, left:breast.filter(l=>l.tipo==='peito-esq').length, right:breast.filter(l=>l.tipo==='peito-dir').length,
        durTotal, withDur:withDur.length, avgDur: withDur.length ? durTotal/withDur.length : null, days:new Set(breast.map(l=>dayKey(l.ts))).size },
      sleep:{ n:sono.length, nights:sono.filter(l=>l.periodo==='noite').length, naps:sono.filter(l=>l.periodo==='sesta').length, noPeriod:sono.filter(l=>l.periodo!=='noite'&&l.periodo!=='sesta').length, min:sonoMin, days:sonoDays, perDay: sonoDays ? sonoMin/sonoDays : null },
      diaper:{ n:fr.length, xixi, coco, days:frDays, xixiPerDay: frDays ? xixi/frDays : null, cocoPerDay: frDays ? coco/frDays : null },
    };
  }
  function growthDelta(days, range){
    const cutoff = Date.now()-days*86400000;
    const inWin = arr => arr.filter(r=> range ? inRange(new Date(r.date+'T12:00:00').getTime(), range[0], range[1]) : new Date(r.date).getTime()>=cutoff).slice().sort((x,y)=>new Date(x.date)-new Date(y.date));
    const p = inWin(S.evolucao.peso), a = inWin(S.evolucao.altura);
    const dp = p.length>1 ? (p[p.length-1].valor-p[0].valor) : null;
    const da = a.length>1 ? (a[a.length-1].valor-a[0].valor) : null;
    return {dp,da,np:p.length,na:a.length};
  }
  // Secções do resumo (usadas no ecrã e no PDF). Cada linha é HTML simples (<b>, <span class="muted">).
  // Singular/plural: pl(1,…) → "1 noite", pl(2,…) → "2 noites". parts() junta só as partes diferentes de zero.
  function pl(n, ptS, ptP, frS, frP, enS, enP){ return n+' '+(n===1 ? lx(ptS,frS,enS) : lx(ptP,frP,enP)); }
  function parts(list){ return list.filter(x=>x && x.n>0).map(x=>x.txt).join(' · '); }
  function summarySections(days, weekOffset){
    let cur, prev, g, span=days;
    if(days===7){
      const w=viewedWeek(weekOffset);
      cur=rangeSummary(w.a, w.b, 7); prev=rangeSummary(w.pa, w.a, 7); g=growthDelta(7,[w.a,w.b]); span=w.span;
    } else { cur=periodSummary(days,0); prev=periodSummary(days,days); g=growthDelta(days); }
    const dia=lx('dia','jour','day');
    const daysLine = n => `<b>${n}/${span}</b> ${lx('dias com registos','jours avec enregistrements','days with records')}`+(span<days?` <span class="muted">(${lx('semana em curso','semaine en cours','week in progress')})</span>`:'');
    const avgNote = n => `<span class="muted">(${n===1 ? lx('só 1 dia com registos','1 seul jour avec enregistrements','only 1 day with records') : lx(`média dos ${n} dias com registos`,`moyenne sur ${n} jours avec enregistrements`,`average over ${n} days with records`)})</span>`;
    const prevLbl = days===7 ? lx('Semana anterior','Semaine précédente','Previous week') : lx(`${days} dias anteriores`,`${days} jours précédents`,`Previous ${days} days`);
    const minDays = days===7 ? 3 : 7; // "dados suficientes" para comparar: nº mínimo de dias com registos nos DOIS períodos
    const canCmp = (c,p) => c>=minDays && p>=minDays;
    const signed = (v,f) => (v>=0?'+':'−')+f(Math.abs(v));
    const out=[];
    const B=cur.bottle, PB=prev.bottle;
    if(B.n){
      const lines=[`<b>${B.n}</b> ${lx(B.n===1?'biberão registado':'biberões registados',B.n===1?'biberon enregistré':'biberons enregistrés',B.n===1?'bottle logged':'bottles logged')}`];
      if(B.ml>0) lines.push(`<b>${fmtInt(B.ml)} ml</b> ${lx('registados','enregistrés','logged')}`+(B.noMl?` <span class="muted">(${B.noMl} ${lx('sem quantidade','sans quantité','without an amount')})</span>`:''));
      else lines.push(`<span class="muted">${lx('Nenhum biberão com quantidade em ml.','Aucun biberon avec quantité en ml.','No bottle with an amount in ml.')}</span>`);
      if(B.mlPerDay!=null) lines.push(`<b>~${fmtInt(B.mlPerDay)} ml/${dia}</b> ${avgNote(B.mlDays)}`);
      lines.push(daysLine(B.days));
      let cmp='';
      if(canCmp(B.mlDays,PB.mlDays)) cmp=`${prevLbl}: ${pl(PB.n,'biberão','biberões','biberon','biberons','bottle','bottles')} · ${fmtInt(PB.ml)} ml · ~${fmtInt(PB.mlPerDay)} ml/${dia} (${PB.days}/${days}) — ${lx('diferença','différence','difference')}: ${signed(B.mlPerDay-PB.mlPerDay,fmtInt)} ml/${dia}`;
      out.push({ic:ICONS.bottle, title:lx('Alimentação · biberão','Alimentation · biberon','Feeding · bottle'), lines, cmp});
    }
    const M=cur.breast, PM=prev.breast;
    if(M.n){
      const sides = parts([{n:M.left, txt:M.left+' '+lx('esq.','gauche','left')},{n:M.right, txt:M.right+' '+lx('dir.','droite','right')}]);
      const lines=[`<b>${M.n}</b> ${lx(M.n===1?'sessão de amamentação':'sessões de amamentação',M.n===1?'tétée':'tétées',M.n===1?'breastfeeding session':'breastfeeding sessions')}`+(sides?` <span class="muted">(${sides})</span>`:'')];
      if(M.withDur){
        lines.push(`<b>${durStr(M.durTotal)}</b> ${lx('de duração total registada','de durée totale enregistrée','total duration logged')}`+(M.withDur<M.n?` <span class="muted">(${M.n-M.withDur} ${lx('sem duração','sans durée','without a duration')})</span>`:''));
        lines.push(`<b>~${Math.round(M.avgDur)} min</b> ${lx('por sessão, em média','par tétée en moyenne','per session on average')} <span class="muted">(${pl(M.withDur,'sessão com duração','sessões com duração','tétée avec durée','tétées avec durée','session with a duration','sessions with a duration')})</span>`);
      }
      lines.push(daysLine(M.days));
      lines.push(`<span class="muted">${lx('A amamentação é contada em sessões e minutos — não é convertida em ml.','L\'allaitement est compté en tétées et minutes — pas converti en ml.','Breastfeeding is counted in sessions and minutes — never converted to ml.')}</span>`);
      let cmp='';
      if(canCmp(M.days,PM.days)) cmp=`${prevLbl}: ${pl(PM.n,'sessão','sessões','tétée','tétées','session','sessions')}`+(PM.avgDur!=null?` · ~${Math.round(PM.avgDur)} min/${lx('sessão','tétée','session')}`:'')+` (${PM.days}/${days})`;
      out.push({ic:ICONS.bottle, title:lx('Alimentação · amamentação','Alimentation · allaitement','Feeding · breastfeeding'), lines, cmp});
    }
    const Z=cur.sleep, PZ=prev.sleep;
    if(Z.n){
      const kinds = parts([{n:Z.nights, txt:pl(Z.nights,'noite','noites','nuit','nuits','night','nights')},{n:Z.naps, txt:pl(Z.naps,'sesta','sestas','sieste','siestes','nap','naps')},{n:Z.noPeriod, txt:Z.noPeriod+' '+lx('sem período indicado','sans période indiquée','with no period given')}]);
      const lines=[`<b>${Z.n}</b> ${lx(Z.n===1?'período de sono registado':'períodos de sono registados',Z.n===1?'période de sommeil enregistrée':'périodes de sommeil enregistrées',Z.n===1?'sleep period logged':'sleep periods logged')}`+(kinds?` <span class="muted">(${kinds})</span>`:''),
        `<b>${durStr(Z.min)}</b> ${lx('de sono registado','de sommeil enregistré','of sleep logged')}`,
        `<b>~${durStr(Z.perDay)}/${dia}</b> ${avgNote(Z.days)}`,
        daysLine(Z.days)];
      let cmp='';
      if(canCmp(Z.days,PZ.days)) cmp=`${prevLbl}: ~${durStr(PZ.perDay)}/${dia} (${PZ.days}/${days}) — ${lx('diferença','différence','difference')}: ${signed(Z.perDay-PZ.perDay,v=>durStr(v))}/${dia}`;
      out.push({ic:ICONS.moon, title:lx('Sono','Sommeil','Sleep'), lines, cmp});
    }
    const F=cur.diaper, PF=prev.diaper;
    if(F.n){
      const fk = parts([{n:F.xixi, txt:F.xixi+' '+tr('xixi')},{n:F.coco, txt:F.coco+' '+tr('cocó')}]);
      const perDay = parts([{n:F.xixi, txt:`~${fmtDec(F.xixiPerDay,1)} ${tr('xixi')}/${dia}`},{n:F.coco, txt:`~${fmtDec(F.cocoPerDay,1)} ${tr('cocó')}/${dia}`}]);
      const lines=[`<b>${F.n}</b> ${lx(F.n===1?'fralda registada':'fraldas registadas',F.n===1?'couche enregistrée':'couches enregistrées',F.n===1?'diaper logged':'diapers logged')}`+(fk?` <span class="muted">(${fk})</span>`:''),
        `<b>${perDay}</b> ${avgNote(F.days)}`,
        daysLine(F.days)];
      let cmp='';
      if(canCmp(F.days,PF.days)) cmp=`${prevLbl}: ${parts([{n:PF.xixi, txt:`~${fmtDec(PF.xixiPerDay,1)} ${tr('xixi')}/${dia}`},{n:PF.coco, txt:`~${fmtDec(PF.cocoPerDay,1)} ${tr('cocó')}/${dia}`}])} (${PF.days}/${days})`;
      out.push({ic:ICONS.drop, title:lx('Fraldas','Couches','Diapers'), lines, cmp});
    }
    if(g.dp!=null || g.da!=null){
      const lines=[];
      if(g.dp!=null) lines.push(`${tr('Peso')}: <b>${g.dp>=0?'+':'−'}${fmtDec(Math.abs(g.dp),2)} kg</b> <span class="muted">(${pl(g.np,'medição no período','medições no período','mesure sur la période','mesures sur la période','measurement in the period','measurements in the period')})</span>`);
      if(g.da!=null) lines.push(`${tr('Altura')}: <b>${g.da>=0?'+':'−'}${fmtDec(Math.abs(g.da),1)} cm</b> <span class="muted">(${pl(g.na,'medição no período','medições no período','mesure sur la période','mesures sur la période','measurement in the period','measurements in the period')})</span>`);
      out.push({ic:ICONS.chart, title:lx('Crescimento','Croissance','Growth'), lines, cmp:''});
    }
    return {cur, sections:out};
  }
  function periodLabel(sum){
    const f = ts => new Date(ts).toLocaleDateString(localeTag(),{day:'numeric',month:'short'});
    return f(sum.a)+' – '+f(sum.b-1);
  }
  function summaryHtml(days, weekOffset){
    const {cur, sections} = summarySections(days, weekOffset);
    if(!sections.length) return `<div class="empty">${lx('Sem registos neste período.','Aucun enregistrement sur cette période.','No records in this period.')}</div>${exampleHint(lx('32 biberões registados · 4 180 ml · ~697 ml/dia · 6/7 dias com registos','32 biberons · 4 180 ml · ~697 ml/jour · 6/7 jours','32 bottles · 4,180 ml · ~697 ml/day · 6/7 days with records'))}`;
    return `<p class="muted" style="margin:4px 0 0;">${days===7?'':periodLabel(cur)+' · '}${lx('médias calculadas só sobre os dias com registos (dias sem registos não contam como zero)','moyennes calculées uniquement sur les jours avec enregistrements','averages use only days with records (days without records do not count as zero)')}</p>`+
      sections.map(sec=>`<div class="sum-block"><div class="sum-title">${sec.ic}<span>${sec.title}</span></div>${sec.lines.map(l=>`<div class="sum-line">${l}</div>`).join('')}${sec.cmp?`<div class="sum-cmp">${sec.cmp}</div>`:''}</div>`).join('');
  }
  function summaryPlainText(days, weekOffset){
    const {cur, sections} = summarySections(days, weekOffset);
    const strip = h => h.replace(/<[^>]+>/g,'').replace(/ | /g,' ').replace(/−/g,'-');
    if(!sections.length) return strip(periodLabel(cur))+'\n\n'+lx('Sem registos neste período.','Aucun enregistrement sur cette période.','No records in this period.');
    return strip(periodLabel(cur))+'\n'+lx('Médias calculadas só sobre os dias com registos.','Moyennes calculées uniquement sur les jours avec enregistrements.','Averages use only days with records.')+'\n\n'+
      sections.map(sec=>strip(sec.title).toUpperCase()+'\n'+sec.lines.map(l=>'  '+strip(l)).join('\n')+(sec.cmp?'\n  '+strip(sec.cmp):'')).join('\n\n');
  }
  // Resumo inteligente: frases calculadas localmente a partir dos próprios dados (sem IA/API paga).
  function smartInsights(){
    const items=[];
    const cur=periodSummary(7,0), prev=periodSummary(7,7);
    const dia=lx('dia','jour','day');
    if(cur.sleep.perDay!=null){
      let txt = lx('Sono','Sommeil','Sleep')+`: ~${durStr(cur.sleep.perDay)}/${dia} (${pl(cur.sleep.days,'dia com registos','dias com registos','jour avec enregistrements','jours avec enregistrements','day with records','days with records')} ${lx('nos últimos 7 dias','sur les 7 derniers jours','in the last 7 days')})`;
      if(prev.sleep.perDay!=null && cur.sleep.days>=3 && prev.sleep.days>=3){
        const diffPct=Math.round(((cur.sleep.perDay-prev.sleep.perDay)/prev.sleep.perDay)*100);
        txt += ` (${diffPct>=0?'+':''}${diffPct}% ${lx('vs semana anterior','vs semaine précédente','vs previous week')})`;
      }
      items.push({ic:ICONS.moon, txt:txt+'.'});
    }
    const t1=Date.now(), t0=t1-3*86400000;
    const feeds3 = S.mamadas.filter(m=>inRange(m.ts,t0,t1)).slice().sort((a,b)=>a.ts-b.ts);
    if(feeds3.length>=2){
      const diffs=[]; for(let i=1;i<feeds3.length;i++) diffs.push((feeds3[i].ts-feeds3[i-1].ts)/3600000);
      const avgInt=fmtDec(diffs.reduce((s,v)=>s+v,0)/diffs.length,1);
      items.push({ic:ICONS.bottle, txt:lx(`Intervalo médio entre mamadas registadas (últimos 3 dias): ${avgInt} h.`,`Intervalle moyen entre repas enregistrés (3 derniers jours) : ${avgInt} h.`,`Average interval between logged feeds (last 3 days): ${avgInt} h.`)});
    }
    if(cur.diaper.xixiPerDay!=null && cur.diaper.xixi>0){   // sem xixi registado não se mostra "~0,0/dia"
      let txt = `${lx('Fraldas de xixi','Couches mouillées','Wet diapers')}: ~${fmtDec(cur.diaper.xixiPerDay,1)}/${dia} (${pl(cur.diaper.days,'dia com registos','dias com registos','jour avec enregistrements','jours avec enregistrements','day with records','days with records')} ${lx('nos últimos 7 dias','sur les 7 derniers jours','in the last 7 days')})`;
      if(prev.diaper.xixiPerDay && cur.diaper.days>=3 && prev.diaper.days>=3){
        const diffPct=Math.round(((cur.diaper.xixiPerDay-prev.diaper.xixiPerDay)/prev.diaper.xixiPerDay)*100);
        txt += ` (${diffPct>=0?'+':''}${diffPct}% ${lx('vs semana anterior','vs semaine précédente','vs previous week')})`;
      }
      items.push({ic:ICONS.drop, txt:txt+'.'});
    }
    const pesoArr = S.evolucao.peso.slice().sort((x,y)=>new Date(x.date)-new Date(y.date));
    if(pesoArr.length>=2){
      const last=pesoArr[pesoArr.length-1], prevM=pesoArr[pesoArr.length-2];
      const deltaKg=last.valor-prevM.valor, sign=deltaKg>=0?'+':'−';
      const days=Math.max(1, Math.round((new Date(last.date)-new Date(prevM.date))/86400000));
      items.push({ic:ICONS.chart, txt:lx(`Peso: ${sign}${fmtDec(Math.abs(deltaKg),2)} kg entre as duas últimas pesagens (${days} dias de intervalo).`,`Poids : ${sign}${fmtDec(Math.abs(deltaKg),2)} kg entre les deux dernières pesées (${days} jours d'écart).`,`Weight: ${sign}${fmtDec(Math.abs(deltaKg),2)} kg between the last two weigh-ins (${days} days apart).`)});
    }
    return items;
  }
  /* ============ REFLEXÃO SEMANAL (opcional) ============
     Guardada por criança e por semana de calendário (segunda a domingo). Só guarda o que o utilizador
     escolhe/escreve: sem escolha = null, campo vazio = null. O placeholder da nota é só visual. */
  const WEEK_MOODS = [

  let resumoWeekOffset = 0;   // semana que está a ser vista no resumo semanal (0 = atual)
  function weekReflection(key){ const r=S.crianca.reflexoesSemanais||{}; return r[key||viewedWeek(resumoWeekOffset).key] || {humor:null, nota:null}; }
  function setWeekReflection(patch, key){
    const c=S.crianca; c.reflexoesSemanais=c.reflexoesSemanais||{};
    key = key || viewedWeek(resumoWeekOffset).key;
    const rec=Object.assign({humor:null, nota:null}, c.reflexoesSemanais[key]||{}, patch);
    if(rec.humor==null && rec.nota==null) delete c.reflexoesSemanais[key];   // nada escolhido nem escrito → não fica nenhum registo
    else { rec.atualizadoEm=Date.now(); c.reflexoesSemanais[key]=rec; }

  function weeklyReflectionHtml(){
    const r=weekReflection();

  function wireWeeklyReflection(){
    const key = viewedWeek(resumoWeekOffset).key;   // a semana mostrada quando o ecrã foi desenhado — tudo o que se escolhe/escreve aqui vai para ela
    document.querySelectorAll('.mood-btn[data-mood]').forEach(b=>b.addEventListener('click', ()=>{
      const cur=weekReflection(key).humor;
      const next = cur===b.dataset.mood ? null : b.dataset.mood;   // tocar outra vez na mesma opção desmarca
      setWeekReflection({humor:next}, key);
      document.querySelectorAll('.mood-btn[data-mood]').forEach(x=>{ const on=x.dataset.mood===next; x.classList.toggle('on',on); x.setAttribute('aria-checked',on); });
    }));
    const ta=document.getElementById('weekNote'); if(!ta) return;
    const st=document.getElementById('weekNoteStatus');
    let tmr=null;
    const commit=()=>{ const v=ta.value.trim(); setWeekReflection({nota: v ? v : null}, key); if(st){ st.innerHTML = v ? ICONS.check+' '+tr('Guardado!') : ''; } };
    ta.addEventListener('input', ()=>{ clearTimeout(tmr); tmr=setTimeout(commit, 600); });
    ta.addEventListener('blur', ()=>{ clearTimeout(tmr); commit(); });
  }

  async function exportSummaryPdf(label, days, weekOffset){
    try{
      if(!window.jspdf){ showAlert(tr('PDF indisponível offline.')); return; }
      const { jsPDF } = window.jspdf;
      const lang=(S.settings&&S.settings.lang)||'pt';
      const months = ageInfo(S.crianca.dataNascimento).months;
      const doc = new jsPDF();
      doc.setFontSize(16); doc.text('Emily Tracker — '+tr('Resumo')+' '+tr(label), 14, 18);
      doc.setFontSize(10); doc.text(new Date().toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT'), 14, 25);

      const monthsLbl = lang==='fr'?'mois':lang==='en'?'months':'meses';
      const lines = doc.splitTextToSize(`${childLbl}: ${S.crianca.nome} (${months} ${monthsLbl})\n\n`+summaryPlainText(days, weekOffset), 180);
      doc.text(lines, 14, 36);

      const result = await triggerDownload(`emily-tracker-resumo-${label.toLowerCase()}.pdf`, blob);

  /* ============ shared charts ============ */
  function barChart(bars, opts){
    opts=opts||{};
    const w=300,h=140,pad=24,gap=8;
    const max=Math.max(...bars.map(b=>b.v), opts.targetLine||0, 1);
    const bw=(w-2*pad-gap*(bars.length-1))/bars.length;
    const bh=v=>(v/max)*(h-2*pad-14);
    const bars_=bars.map((b,i)=>{ const bx=pad+i*(bw+gap), by=h-pad-bh(b.v);
      const open = b.date ? `<g class="bar-day" data-date="${b.date}" role="button" tabindex="0" aria-label="${new Date(b.date+'T12:00:00').toLocaleDateString(localeTag(),{weekday:'long',day:'numeric',month:'long'})}: ${b.v}" style="cursor:pointer;">` : '<g>';
      return `${open}<rect x="${bx.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${h}" fill="transparent"/>
        <rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh(b.v).toFixed(1)}" rx="3" fill="${(opts&&opts.color)||'var(--ink-muted)'}"/>
        <text class="axis-label" x="${(bx+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${b.label}</text>
        <text x="${(bx+bw/2).toFixed(1)}" y="${(by-5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${fmtNum(b.v,1)}</text></g>`;
    }).join('');
    const target = opts.targetLine ? `<line x1="${pad}" y1="${(h-pad-bh(opts.targetLine)).toFixed(1)}" x2="${w-8}" y2="${(h-pad-bh(opts.targetLine)).toFixed(1)}" stroke="var(--ink-faint)" stroke-dasharray="4,3" stroke-width="1.2"/>` : '';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="140">
      <line x1="${pad}" y1="${h-pad}" x2="${w-8}" y2="${h-pad}" stroke="var(--border)"/>
      ${bars_}${target}
    </svg>`;
  }

    </div>

      <p class="muted">${syncStatusLabel()}${dbSyncState==='synced'?' — '+tr('usa o menu de partilha desta página para dar acesso de edição ao outro pai/mãe, ou só de visualização ao médico.'):''}</p>

      ${readImportBackup() ? `<button class="btn ghost wide" id="restoreBackupBtn" type="button" style="margin-top:8px;">${lx('Repor dados de antes da última importação','Restaurer les données d\'avant la dernière importation','Restore data from before the last import')}</button>` : ''}

      ${S.criancas.length>1 ? `<button class="btn crit wide" id="removeChildBtn" type="button" style="margin-top:8px;">${tr('Remover perfil de')} ${S.crianca.nome}</button>` : ''}

  }

  /* ============ exportar / importar (Fase 2) ============
     Exportação: UMA cópia de cada registo (antes o ficheiro tinha os dados 3 vezes: criancas, crianca e mamadas/fraldas/…),
     sem fotos, documentos digitalizados nem foto de fundo. Continua a usar a chave "criancas", por isso é lido pela importação
     desta versão e das anteriores; a importação continua a aceitar os formatos antigos. */
  const IMPORT_BACKUP_KEY = KEY+'-backup-antes-importacao';
  function exportPayload(){
    const settings = Object.assign({}, S.settings); delete settings.bgPhoto; delete settings.demoCleanupNotice;
    return { app:'emily-tracker', formato:2, exportadoEm:new Date().toISOString(), semFotos:true,
      activeChildId:S.activeChildId, settings, criancas:S.criancas.map(stripHeavy) };
  }
  function importChildren(raw){
    if(raw && Array.isArray(raw.criancas)) return raw.criancas;
    if(raw && raw.crianca && typeof raw.crianca==='object') return [Object.assign({}, raw.crianca, {mamadas:raw.mamadas, fraldas:raw.fraldas, sono:raw.sono, evolucao:raw.evolucao, doses:raw.doses})];
    return [];
  }
  function isValidImport(raw){
    if(!raw || typeof raw!=='object' || Array.isArray(raw)) return false;
    const kids=importChildren(raw);
    return kids.length>0 && kids.every(c=>c && typeof c==='object' && !Array.isArray(c))
      && kids.every(c=>['mamadas','fraldas','sono','doses','consultas','medicacoes'].every(k=>c[k]==null || Array.isArray(c[k])));
  }
  function countRecords(kids){
    let n=0;
    (kids||[]).forEach(c=>{ ['mamadas','fraldas','sono','doses','consultas'].forEach(k=>{ n+=(Array.isArray(c[k])?c[k].length:0); });
      const e=c.evolucao||{}; ['peso','altura','pc'].forEach(k=>{ n+=(Array.isArray(e[k])?e[k].length:0); }); });
    return n;
  }
  // Fotos, documentos e fundo que não vêm no ficheiro são mantidos a partir dos dados atuais deste dispositivo (mesmo id de criança).
  function keepLocalMedia(next, raw){
    const prevById={}; S.criancas.forEach(c=>prevById[c.id]=c);
    const srcKids=importChildren(raw);
    next.criancas.forEach(c=>{ const src=srcKids.find(k=>k && k.id===c.id) || {}; const old=prevById[c.id]; if(!old) return;
      ['foto','fotos','documentos'].forEach(k=>{ if(!(k in src)) c[k]=old[k]; }); });
    const prevBg = S.settings && S.settings.bgPhoto;
    if(prevBg && !(raw && raw.settings && raw.settings.bgPhoto)) next.settings.bgPhoto = prevBg;
    return next;
  }
  function readImportBackup(){ try{ const b=JSON.parse(localStorage.getItem(IMPORT_BACKUP_KEY)||'null'); return (b && b.data && b.savedAt) ? b : null; }catch(e){ return null; } }
  function showImportConfirm(raw){
    const kids=importChildren(raw), nNew=countRecords(kids), nCur=countRecords(S.criancas);
    const names=kids.map(c=>c.nome||tr('Bebé')).join(', ');
    showOverlay(`<div class="voice-panel" id="importPanel"><div class="voice-card" data-confirm style="text-align:left;">
      <h2 style="margin:0 0 8px;">${lx('Importar dados?','Importer les données ?','Import data?')}</h2>
      <div class="rec-line"><span>${lx('No ficheiro','Dans le fichier','In the file')}</span><b>${pl(nNew,'registo','registos','enregistrement','enregistrements','record','records')} · ${names}</b></div>
      <div class="rec-line"><span>${lx('Neste dispositivo agora','Sur cet appareil','On this device now')}</span><b>${pl(nCur,'registo','registos','enregistrement','enregistrements','record','records')}</b></div>
      <div class="alert action" style="margin-top:10px;">${ICONS.note} ${lx('Os dados atuais serão SUBSTITUÍDOS pelos do ficheiro. Antes disso é guardada automaticamente uma cópia de segurança dos dados atuais neste dispositivo.','Les données actuelles seront REMPLACÉES. Une copie de sécurité est enregistrée automatiquement avant.','Current data will be REPLACED. A backup of the current data is saved automatically first.')}</div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost wide" id="impCancel" type="button">${tr('Cancelar')}</button>
        <button class="btn crit wide" id="impOk" type="button">${lx('Substituir e importar','Remplacer et importer','Replace and import')}</button>
      </div>
    </div></div>`);
    document.getElementById('impCancel').addEventListener('click', ()=>{ closeOverlay(); renderSettingsOverlay(); });
    document.getElementById('impOk').addEventListener('click', async ()=>{
      // 3) cópia de segurança ANTES de substituir; se não for possível guardar, a importação é cancelada
      // Cópia COMPLETA (incluindo fotos e documentos): a importação pode trazer outra criança e a reposição tem de devolver tudo.
      // 1.º neste dispositivo; se não houver espaço, descarrega-se a cópia como ficheiro; se nenhuma for possível, cancela-se.
      const snapshot={ savedAt:Date.now(), data:{ criancas:S.criancas, activeChildId:S.activeChildId, settings:S.settings } };
      let backedUp=false;
      try{ localStorage.setItem(IMPORT_BACKUP_KEY, JSON.stringify(snapshot)); backedUp=true; }catch(err){ backedUp=false; }
      if(!backedUp){
        const res = await triggerDownload(`emily-tracker-copia-antes-importacao-${todayISO()}.json`, new Blob([JSON.stringify(snapshot.data,null,2)],{type:'application/json'}));
        backedUp = res==='saved';
      }
      if(!backedUp){ showAlert(lx('Não foi possível criar a cópia de segurança — importação cancelada. Nada foi alterado.','Impossible de créer la copie de sécurité — importation annulée.','Could not create the backup — import cancelled. Nothing was changed.')); return; }
      // 4) importar; fotos/documentos/fundo que não vêm no ficheiro são mantidos deste dispositivo
      S = keepLocalMedia(loadState(raw), raw);
      if(demoCleanupLog.length){ S.settings.demoCleanupNotice=Array.from(new Set(demoCleanupLog)); demoCleanupLog.length=0; }
      setActiveChild(S.activeChildId); save(); applyTheme(); render();
      showAlert(lx(`Importação concluída: ${pl(countRecords(S.criancas),'registo','registos','','','','')}. A cópia dos dados anteriores ficou guardada (Definições › Repor dados de antes da última importação).`,`Importation terminée : ${countRecords(S.criancas)} enregistrement(s). La copie des données précédentes est conservée.`,`Import complete: ${countRecords(S.criancas)} record(s). A copy of the previous data was kept.`));
    });
  }

  /* ============ dispatch ============ */
  function render(){
    syncThemeIfChanged();
    renderTabbar(); renderHeader(); renderChildSwitch(); wireGlobalControls(); renderReminders(); renderSyncBadge(); renderStorageBanner();
    const mainEl=document.getElementById('main');
    if(mainEl){ mainEl.classList.remove('fade-in'); void mainEl.offsetWidth; mainEl.classList.add('fade-in'); }
    if(activeTab!=='resumo') resumoWeekOffset=0;
    if(activeTab==='inicio') renderInicio();
    else if(activeTab==='perfil') renderPerfil();
    else if(activeTab==='mamadas') renderMamadas();
    else if(activeTab==='fraldas') renderFraldas();
    else if(activeTab==='sono') renderSono();
    else if(activeTab==='evolucao') renderEvolucao();
    else if(activeTab==='desenv') renderDesenv();
    else if(activeTab==='vacinas') renderVacinas();
    else if(activeTab==='consultas') renderConsultas();
    else if(activeTab==='resumo') renderResumo();
    else if(activeTab==='sos') renderSos();
    wireDayBars();
  }
  // Toque/clique numa barra dos gráficos semanais. Antes o listener só era ligado pelo render() global e
  // perdia-se quando o ecrã se redesenhava sozinho (ex.: depois de guardar um registo). Agora há UM listener
  // delegado em #main, que funciona sempre, por toque (mobile) ou clique (desktop) — sem depender de hover.
  function wireDayBars(){ /* mantido por compatibilidade: a ligação é feita uma vez, em baixo */ }
  document.getElementById('main').addEventListener('click', e=>{
    const g = e.target && e.target.closest ? e.target.closest('.bar-day[data-date]') : null;
    if(g) showDaySummary(g.dataset.date);
  });
  function showDaySummary(dateISO){

    const dateLbl = new Date(dateISO+"T00:00:00").toLocaleDateString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'pt-PT', {weekday:'long', day:'numeric', month:'long'});
    const byTime=(k)=>(x,y)=>x[k]-y[k];
    const feeds = S.mamadas.filter(l=>inRange(l.ts,a,b)).sort(byTime('ts'));
    const bott = feeds.filter(l=>l.tipo==='biberao'), breast = feeds.filter(l=>l.tipo!=='biberao');

      return row('mamada', l.id, `<b>${hhmm(l.ts)}</b> — ${ml!=null ? `<b>${ml} ml</b>`+extra : `<span class="muted">${lx('sem quantidade','sans quantité','no amount')}</span>`}`); }).join('');

    showOverlay(`<div class="voice-panel" id="dayPanel"><div class="voice-card" style="text-align:left;max-height:85vh;overflow-y:auto;">
      <h2 style="margin:0 0 4px;">${dateLbl.charAt(0).toUpperCase()+dateLbl.slice(1)}</h2>
      <p class="muted" style="margin:0 0 10px;">${lx('Toca num registo para ver detalhes ou editar.','Touche un enregistrement pour voir les détails ou modifier.','Tap a record to see details or edit.')}</p>
      <div class="day-sec"><div class="sum-title">${ICONS.bottle}<span>${tr('Biberão')}</span></div>${bottRows||none}
        ${bott.length ? `<div class="sum-cmp">${lx('Total registado','Total enregistré','Total logged')}: <b>${mlTotal} ml</b> · ${bott.length} ${lx(bott.length===1?'biberão':'biberões',bott.length===1?'biberon':'biberons',bott.length===1?'bottle':'bottles')}</div>` : ''}</div>
      ${breast.length ? `<div class="day-sec"><div class="sum-title">${ICONS.bottle}<span>${lx('Amamentação','Allaitement','Breastfeeding')}</span></div>${breastRows}</div>` : ''}
      <div class="day-sec"><div class="sum-title">${ICONS.drop}<span>${tr('Fraldas')}</span></div>${diaperRows||none}</div>
      <div class="day-sec"><div class="sum-title">${ICONS.moon}<span>${tr('Sono')}</span></div>${sleepRows||none}</div>

  /* ============ validação de formulários (Fase 2) ============
     Limites de plausibilidade (não clínicos) para apanhar erros de escrita: não existiam limites na app. */
  // mlMax, peitoMaxMin, sonoMaxH e os intervalos de peso/altura/pc só PEDEM CONFIRMAÇÃO (valor invulgar) — não bloqueiam.
  // Bloqueia-se apenas o logicamente impossível: negativos/texto inválido, 0 onde não faz sentido, datas futuras,
  // início = fim, bebido > oferecido, qualidade fora da escala 1–10 (inteiros).
  const LIMITS = { mlMax:500, peitoMaxMin:180, sonoMaxH:16, qualMin:1, qualMax:10,
    peso:[0.3,50], altura:[20,150], pc:[20,70] };
  function clearFieldErrors(scope){ (scope||document).querySelectorAll('.field-err').forEach(e=>e.remove()); (scope||document).querySelectorAll('.input-err').forEach(e=>e.classList.remove('input-err')); }
  // errs = [[idDoCampo, mensagem], …] → mostra cada mensagem logo a seguir ao campo e foca o primeiro. Devolve true se não houver erros.
  function showFieldErrors(errs){
    errs.forEach(([id,msg],i)=>{
      const el=document.getElementById(id); if(!el) return;
      el.classList.add('input-err');
      const p=document.createElement('p'); p.className='field-err'; p.setAttribute('role','alert'); p.textContent=msg;
      el.insertAdjacentElement('afterend', p);
      el.addEventListener('input', ()=>{ el.classList.remove('input-err'); if(p.parentNode) p.remove(); }, {once:true});
      if(i===0 && el.focus) el.focus();
    });
    return errs.length===0;
  }
  // Lê um número de um campo; aceita vírgula ou ponto decimal ("6,5" e "6.5" → 6.5). Vazio → null; texto inválido → NaN.
  function readNum(id){
    const el=document.getElementById(id); if(!el) return null;
    const raw=String(el.value||'').trim();
    if(raw==='') return (el.validity && el.validity.badInput) ? NaN : null;
    const v=parseFloat(raw.replace(/\s/g,'').replace(',','.'));
    return /^[-+]?\d*[.,]?\d+\s*[a-zA-Z]*$/.test(raw.replace(/\s/g,'')) ? v : NaN;
  }
  const FUTURE_TOL_MS = 60000;   // 1 min de tolerância para relógios ligeiramente diferentes
  // Confirmação para valores possíveis mas invulgares: Cancelar não grava; Guardar grava exatamente o valor introduzido.
  function confirmUnusual(lines, onSave, onCancel){
    showOverlay(`<div class="voice-panel" id="unusualPanel"><div class="voice-card" data-confirm>
      ${lines.map(l=>`<p style="margin:0 0 8px;">${l}</p>`).join('')}
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost wide" id="unCancel" type="button">${tr('Cancelar')}</button>
        <button class="btn wide" id="unSave" type="button">${tr('Guardar')}</button>
      </div>
    </div></div>`);
    document.getElementById('unCancel').addEventListener('click', ()=>{ closeOverlay(); if(onCancel) onCancel(); });
    document.getElementById('unSave').addEventListener('click', ()=>{ closeOverlay(); onSave(); });
  }
  const numTxt = v => String(v).replace('.', lx(',',',','.'));
  const msgFuturo = () => lx('A data/hora não pode ser no futuro.','La date/heure ne peut pas être dans le futur.','Date/time cannot be in the future.');
  // Pequeno diálogo para indicar uma data: por omissão, para QUANDO algo aconteceu de facto (vacina administrada,
  // marco alcançado) — hoje pré-selecionado, editável para uma data passada, nunca futura.
  // opts.blockFuture:false + opts.initial + opts.label → mesmo diálogo para gerir uma data AGENDADA (F8): essa é uma
  // data de planeamento (rec.proximaData), não a data real de administração (rec.done) — os dois nunca se misturam.
  function showDateConfirm(title, onConfirm, opts){
    opts = opts || {};
    const blockFuture = opts.blockFuture !== false;
    const initial = opts.initial || todayISO();
    const label = opts.label || tr('Data');
    showOverlay(`<div class="voice-panel" id="dateConfirmPanel"><div class="voice-card" style="text-align:left;">
      <h2 style="margin:0 0 10px;">${title}</h2>
      <div class="form-row"><div style="flex:1;"><label>${label}</label><input type="date" id="dcDate" value="${initial}"></div></div>
      <button class="btn wide" id="dcOk" type="button">${tr('Confirmar')}</button>
      <button class="btn ghost wide" id="dcCancel" type="button" style="margin-top:8px;">${tr('Cancelar')}</button>
    </div></div>`);
    const panel=document.getElementById('dateConfirmPanel');
    /* toque fora: regra comum em overlayBackdropAllowed() */
    document.getElementById('dcCancel').addEventListener('click', closeOverlay);
    document.getElementById('dcOk').addEventListener('click', ()=>{
      clearFieldErrors(panel);
      const v=document.getElementById('dcDate').value;
      const errs=[];
      if(!v) errs.push(['dcDate', lx('Indica a data.','Indique la date.','Enter the date.')]);
      else if(blockFuture && v>todayISO()) errs.push(['dcDate', msgFuturo()]);
      if(!showFieldErrors(errs)) return;
      closeOverlay(); onConfirm(v);
    });
  }

  /* ============ ver detalhes → ✏️ editar / apagar (reutiliza os formulários de edição existentes) ============ */
  function localISO(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function hhmm(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  // Data + hora escolhidas no formulário → timestamp. Sem data, mantém o comportamento antigo (só hora).
  // Registo NOVO com data de hoje e hora ainda no futuro = ontem (como antes). Numa edição usa exatamente o que foi escolhido.
  function dateTimeToTs(dateStr, timeStr, isNew){
    if(!dateStr) return timeStrToTs(timeStr);
    const [y,m,d]=dateStr.split('-').map(Number), [hh,mm]=(timeStr||'00:00').split(':').map(Number);
    let t=new Date(y,m-1,d,hh||0,mm||0,0,0).getTime();
    if(isNew && dateStr===localISO(Date.now()) && t>Date.now()) t-=86400000;
    return t;
  }
  const REC_KINDS = {
    mamada:{ arr:()=>S.mamadas, tab:'mamadas', tsKey:'ts', ic:'bottle', del:'Apagar este registo de mamada?' },
    fralda:{ arr:()=>S.fraldas, tab:'fraldas', tsKey:'ts', ic:'drop',   del:'Apagar este registo de fralda?' },
    sono:  { arr:()=>S.sono,    tab:'sono',    tsKey:'inicio', ic:'moon', del:'Apagar este registo de sono?' },
  };
  function recordDetailRows(kind, l){
    const dash='—', R=[];
    if(kind==='mamada'){
      if(l.tipo==='biberao'){
        R.push([tr('Tipo'), tr('Biberão')]);
        R.push([tr('Oferecido (ml)'), l.mlOferecido!=null ? l.mlOferecido+' ml' : dash]);
        R.push([tr('Bebido (ml)'), l.mlBebido!=null ? l.mlBebido+' ml' : dash]);
        if(l.marcaFormula) R.push([tr('Marca fórmula'), l.marcaFormula]);
      } else {
        R.push([tr('Tipo'), l.tipo==='peito-esq'?tr('Peito esquerdo'):tr('Peito direito')]);
        R.push([tr('Duração (min)'), l.duracaoMin!=null && l.duracaoMin>0 ? durStr(l.duracaoMin) : dash]);
      }
      R.push([lx('Sucção','Succion','Sucking'), l.qualidade==='fraca'?tr('sucção fraca'):l.qualidade==='ativa'?tr('sucção ativa'):lx('não indicado','non indiqué','not given')]);
    } else if(kind==='fralda'){
      R.push([tr('Tipo'), tr(l.tipo==='xixi'?'Xixi':'Cocó')]);
      R.push([tr('Quantidade'), l.quantidade ? tr(l.quantidade) : dash]);
      if(l.tipo==='coco'){ R.push([tr('Cor'), l.cor?tr(l.cor):dash]); R.push([tr('Consistência'), l.consistencia?tr(l.consistencia):dash]); }
    } else {
      R.push([tr('Período'), l.periodo==='noite'?tr('Noite'):l.periodo==='sesta'?tr('Sesta'):lx('não indicado','non indiqué','not given')]);
      R.push([tr('Adormeceu'), fmtWhen(l.inicio)]);
      R.push([tr('Acordou'), fmtWhen(l.fim)]);
      R.push([lx('Duração','Durée','Duration'), durStr(l.duracaoMin)]);
      R.push([tr('Qualidade (1–10)'), l.qualidade!=null ? l.qualidade+'/10' : dash]);
      if(l.interrupcoes) R.push([tr('Interrupções'), l.interrupcoes]);
      if(l.posicao) R.push([tr('Posição'), tr(l.posicao.charAt(0).toUpperCase()+l.posicao.slice(1))]);
    }
    if(l.obs) R.push([lx('Observações','Observations','Notes'), l.obs]);
    return R;
  }
  function showRecordDetails(kind, id, back){
    const K=REC_KINDS[kind]; const l=K.arr().find(x=>x.id===id);
    if(!l){ closeOverlay(); return; }
    const title = kind==='mamada' ? (l.tipo==='biberao'?tr('Biberão'):lx('Amamentação','Allaitement','Breastfeeding')) : kind==='fralda' ? tr('Fralda') : tr('Sono');
    const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    showOverlay(`<div class="voice-panel" id="recPanel"><div class="voice-card" style="text-align:left;">
      <h2 style="margin:0 0 2px;display:flex;align-items:center;gap:8px;">${ICONS[K.ic]} ${title}</h2>
      <p class="muted" style="margin:0 0 10px;">${(d=>d.charAt(0).toUpperCase()+d.slice(1))(new Date(l[K.tsKey]).toLocaleDateString(localeTag(),{weekday:'long',day:'numeric',month:'long'}))} · ${hhmm(l[K.tsKey])}</p>
      ${recordDetailRows(kind,l).map(([k,v])=>`<div class="rec-line"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn secondary wide" id="recEdit" type="button">${ICONS.edit} ${lx('Editar','Modifier','Edit')}</button>
        <button class="btn crit wide" id="recDel" type="button">${tr('Apagar')}</button>
      </div>
      <button class="btn ghost wide" id="recClose" type="button" style="margin-top:8px;">${back ? lx('Voltar ao dia','Retour au jour','Back to day') : tr('Fechar')}</button>
    </div></div>`);
    const panel=document.getElementById('recPanel');
    /* toque fora: regra comum em overlayBackdropAllowed() */
    document.getElementById('recClose').addEventListener('click', ()=>{ if(back) back(); else closeOverlay(); });
    document.getElementById('recEdit').addEventListener('click', ()=>{
      closeOverlay(); activeTab=K.tab; openForm='new'; editId=id; render();
      const h=document.getElementById('formHolder'); if(h && h.scrollIntoView) h.scrollIntoView({block:'center'});
    });
    document.getElementById('recDel').addEventListener('click', ()=>{
      showConfirm(tr(K.del), ()=>{ const arr=K.arr(); const i=arr.findIndex(x=>x.id===id); if(i>-1) arr.splice(i,1); if(editId===id){ editId=null; openForm=null; } save(); render(); });
    });
  }

  // Exemplos nos campos vazios = só placeholder (texto cinzento "Exemplo: …"). Nunca é um valor:
  // não é guardado, não entra em cálculos e não é preciso apagá-lo para escrever.
  const EXAMPLE_PLACEHOLDERS = {
    pNome:'Maria', pLocal:'Luxemburgo', pNac:'Portuguesa', pDocId:'123456789', pSaude:'CNS Luxemburgo', pMorada:'Rue de la Gare 1, 1234 Luxembourg',
    pNascPeso:'3.4', pNascAlt:'50', pNascPc:'35', pBlood:'O+', pRh:'Positivo',
    pediNome:'Dra. Silva', pediTel:'+352 000 000 000', pediEmail:'nome@clinica.lu', pediLocal:'Clínica…', pediMorada:'Rua…',
    alimFormula:'NAN Evolia', alimQtd:'150', fMarca:'NAN Evolia', csEsp:'Pediatra', gWeight:'6.2', gHeight:'60', gHead:'40',
  };
  // Botões só com ícone sem nome acessível: nome a partir da função (apagar/fechar).
  function a11yPass(){
    document.querySelectorAll('button:not([aria-label])').forEach(b=>{
      const txt=b.textContent.trim();
      if(txt && !/^[✕×]$/.test(txt)) return;
      const isDel = [...b.attributes].some(a=>/^data-(rm|del|dose-?del)/i.test(a.name)) || b.classList.contains('g-del');
      b.setAttribute('aria-label', isDel ? tr('Apagar') : tr('Fechar'));
    });
  }
  document.addEventListener('keydown', e=>{
    if((e.key==='Enter'||e.key===' ') && e.target && e.target.getAttribute && e.target.getAttribute('role')==='button' && e.target.tagName!=='BUTTON'){
      e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    }
  });
  function applyExamplePlaceholders(){
    const pre = lx('Exemplo: ','Exemple : ','Example: ');
    Object.keys(EXAMPLE_PLACEHOLDERS).forEach(id=>{
      const el = document.getElementById(id);
      if(el && !el.getAttribute('placeholder')) el.setAttribute('placeholder', pre+EXAMPLE_PLACEHOLDERS[id]);
    });
  }
  // Os ecrãs redesenham-se sozinhos (ex.: depois de guardar), por isso os placeholders são repostos sempre que #main muda.
  (function(){ const m=document.getElementById('main'); if(m && window.MutationObserver) new MutationObserver(()=>{ applyExamplePlaceholders(); a11yPass(); }).observe(m,{childList:true,subtree:true});
    const ov=document.getElementById('voiceOverlay'); if(ov && window.MutationObserver) new MutationObserver(a11yPass).observe(ov,{childList:true,subtree:true}); })();
  document.addEventListener('focusin', (e)=>{
    const el = e.target;
    if(!el || !el.classList) return;
    if(el.classList.contains('remembered-fill')){
      el.value=''; el.classList.remove('remembered-fill');
      el.dispatchEvent(new Event('input', {bubbles:true}));
    }
  });
  function wireFooterSettings(){
    document.getElementById('themeSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.settings.theme=b.dataset.v; save(); applyTheme(); withFormState(render); renderSettingsOverlay(); }));
    document.querySelectorAll('[data-accent]').forEach(sw=>sw.addEventListener('click', ()=>{ S.settings.accentIndex=+sw.dataset.accent; save(); applyTheme(); render(); renderSettingsOverlay(); }));
    document.getElementById('langSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.settings.lang=b.dataset.v; save(); withFormState(render); renderSettingsOverlay(); }));
    document.getElementById('soundToggle').addEventListener('change', e=>{ S.settings.sound = e.target.checked; save(); });
    document.getElementById('testSound').addEventListener('click', ()=>playChime(true));
    const bgBtn=document.getElementById('bgPhotoBtn'), bgInput=document.getElementById('bgPhotoInput'), bgRemove=document.getElementById('bgPhotoRemove');
    if(bgBtn) bgBtn.addEventListener('click', ()=>bgInput.click());
    if(bgInput) bgInput.addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      resizeImageFile(f, 1800, 0.88, (dataUrl)=>{
        if(!dataUrl) return;
        S.settings.bgPhoto = dataUrl;
        const ok = save(); applyBackgroundPhoto();
        if(!ok) showAlert(tr('Não foi possível guardar — o espaço de armazenamento deste dispositivo está cheio (normalmente por causa de fotos/documentos). Remove algumas fotos em Perfil ou exporta os teus dados agora em Definições, para não perderes nada.'));
        renderSettingsOverlay();
      });
    });
    if(bgRemove) bgRemove.addEventListener('click', ()=>{ S.settings.bgPhoto=''; save(); applyBackgroundPhoto(); renderSettingsOverlay(); });
    document.getElementById('exportBtn').addEventListener('click', async ()=>{
      const btn=document.getElementById('exportBtn'); const orig=btn.textContent;
      try{
        const blob=new Blob([JSON.stringify(exportPayload(),null,2)],{type:'application/json'});
        const result = await triggerDownload('emily-tracker-dados.json', blob);
        if(result==='error'){ btn.textContent=tr('Exportação indisponível aqui'); setTimeout(()=>btn.textContent=orig,2000); return; }
        if(result==='declined') return;
        S.settings.lastBackupAt = Date.now(); save();
        btn.textContent=tr('Guardado!'); setTimeout(()=>btn.textContent=orig,1500);
      }catch(err){ btn.textContent=tr('Não foi possível exportar'); setTimeout(()=>btn.textContent=orig,2000); }
    });
    document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
    document.getElementById('importInput').addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      e.target.value='';   // permite escolher o mesmo ficheiro outra vez
      const r=new FileReader();
      r.onload=()=>{
        // 1) validar SEM tocar nos dados atuais
        let raw=null; try{ raw=JSON.parse(r.result); }catch(err){ raw=null; }
        if(!isValidImport(raw)){ showAlert(lx('Ficheiro inválido — não é uma exportação do Emily Tracker. Nada foi alterado.','Fichier invalide — ce n\'est pas un export Emily Tracker. Rien n\'a été modifié.','Invalid file — not an Emily Tracker export. Nothing was changed.')); return; }
        // 2) confirmar
        showImportConfirm(raw);
      };
      r.onerror=()=>showAlert(tr('Ficheiro inválido.'));
      r.readAsText(f);
    });
    const rb=document.getElementById('restoreBackupBtn');
    if(rb) rb.addEventListener('click', ()=>{
      const bk=readImportBackup(); if(!bk) return;
      showConfirm(lx(`Repor os dados guardados antes da última importação (${new Date(bk.savedAt).toLocaleString(localeTag())})? Os dados atuais serão substituídos.`,`Restaurer les données d'avant la dernière importation (${new Date(bk.savedAt).toLocaleString(localeTag())}) ? Les données actuelles seront remplacées.`,`Restore the data from before the last import (${new Date(bk.savedAt).toLocaleString(localeTag())})? Current data will be replaced.`), ()=>{
        S=keepLocalMedia(loadState(bk.data), bk.data); setActiveChild(S.activeChildId); save(); applyTheme(); render(); renderSettingsOverlay();
      });
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      showConfirm(tr('Isto apaga TODOS os dados guardados neste dispositivo. Continuar?'), ()=>{
        localStorage.removeItem(KEY); S=defaultState(); setActiveChild(S.activeChildId); save(); applyTheme(); render();
      });
    });
    const rc=document.getElementById('removeChildBtn');
    if(rc) rc.addEventListener('click', ()=>{
      showConfirm(tr('Remover perfil de')+' '+S.crianca.nome+'? '+tr('Esta ação não pode ser desfeita.'), ()=>{
        S.criancas = S.criancas.filter(x=>x.id!==S.activeChildId);
        setActiveChild(S.criancas[0].id);
        save(); activeTab='inicio'; render();
      });
    });
  }

  applyTheme(); render(); initSync();
  setInterval(()=>{
    renderReminders();
    // Atualiza o tempo de sono em curso, mas nunca por cima de um formulário aberto, de um campo em edição ou de um diálogo.
    const a=document.activeElement, main=document.getElementById('main');
    const busy = !!openForm || overlayOpen() || (a && main && main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
    if(S.running.sleepStart && (activeTab==='inicio'||activeTab==='sono') && !busy) render();
  }, 30000);
})();
</script>
</body>
